services:
  - type: web
    name: glint-tracker
    runtime: node
    plan: starter          # $7/mese — ha persistent disk
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true     # Render genera automaticamente
      - key: GOOGLE_CLIENT_ID
        sync: false             # Da inserire manualmente nel dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false             # es. https://glint-tracker.onrender.com/auth/google/callback
      - key: SYSTEM_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: glint-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
