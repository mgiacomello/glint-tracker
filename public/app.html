<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glint — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090b; --surface: #111113; --card: #18181b; --border: #27272a;
      --text: #fafafa; --muted: #a1a1aa; --subtle: #52525b;
      --accent: #6366f1; --accent2: #8b5cf6;
      --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --blue: #60a5fa;
      --radius: 12px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(9,9,11,.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      height: 56px; padding: 0 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .tb-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .tb-logo .gem { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .tb-logo span { font-size: 16px; font-weight: 700; color: var(--text); }
    .tb-date { font-size: 13px; color: var(--muted); margin-left: 4px; }
    .tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .btn-run {
      display: flex; align-items: center; gap: 6px;
      background: var(--accent); border: none; border-radius: 8px;
      color: #fff; padding: 6px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    .btn-run:hover { opacity: .85; }
    .btn-run:disabled { opacity: .4; cursor: not-allowed; }
    .btn-settings {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); padding: 6px 12px; font-size: 13px;
      cursor: pointer; text-decoration: none; transition: color .15s, border-color .15s;
    }
    .btn-settings:hover { color: var(--text); border-color: var(--subtle); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ── LAYOUT ── */
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 56px); }

    /* ── SIDEBAR ── */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex; flex-direction: column; gap: 2px;
      position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
    }
    .sidebar-section { font-size: 10px; font-weight: 700; color: var(--subtle); text-transform: uppercase; letter-spacing: .08em; padding: 14px 10px 6px; }
    .sidebar-item {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 10px; border-radius: 8px;
      cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500;
      transition: background .12s, color .12s; text-decoration: none;
    }
    .sidebar-item:hover { background: var(--card); color: var(--text); }
    .sidebar-item.active { background: rgba(99,102,241,.12); color: #a5b4fc; }
    .sidebar-item .icon { font-size: 14px; width: 18px; text-align: center; flex-shrink: 0; }
    .sidebar-item .sb-label { flex: 1; }
    .sidebar-item .badge { background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }
    .sidebar-item .badge.blue { background: var(--accent); }
    .sidebar-item .badge.grey { background: var(--subtle); }
    .sidebar-item .badge.amber { background: var(--amber); color: #000; }

    /* ── MAIN ── */
    .main { padding: 24px; max-width: 900px; display: flex; flex-direction: column; gap: 18px; }

    /* ── GREETING ROW ── */
    .greeting-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .greeting-title { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .day-type-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 11px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .day-type-badge.focus  { background: rgba(34,197,94,.12);  color: #86efac; }
    .day-type-badge.maker  { background: rgba(245,158,11,.12); color: #fde68a; }
    .day-type-badge.manager{ background: rgba(99,102,241,.12); color: #a5b4fc; }
    .greeting-progress { margin-left: auto; font-size: 12px; color: var(--muted); }

    /* ── STATS STRIP ── */
    .stats-strip {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .stat-chip {
      display: flex; align-items: center; gap: 7px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 8px 14px;
      font-size: 13px; font-weight: 500; color: var(--muted);
      flex: 1; min-width: 110px;
    }
    .stat-chip .sv { font-size: 16px; font-weight: 700; color: var(--text); }
    .stat-chip .sl { font-size: 11px; color: var(--subtle); margin-top: 1px; }
    .stat-chip .sicon { font-size: 16px; }
    .stat-chip-inner { display: flex; flex-direction: column; gap: 0; }
    .stat-chip.red-chip { border-color: rgba(239,68,68,.25); }
    .stat-chip.red-chip .sv { color: #f87171; }

    /* ── AGENT LOG (run panel) ── */
    .agent-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: none;
    }
    .agent-panel.visible { display: block; }
    .agent-panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .agent-panel-header span { font-size: 13px; font-weight: 600; flex: 1; }
    .agent-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
    .agent-log-box {
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
      color: #86efac; background: #0a0a0c;
      padding: 14px 16px; max-height: 200px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 3px;
    }
    .log-err { color: #fca5a5; }
    .log-done { color: #a78bfa; font-weight: 600; }
    .agent-summary-bar {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: none; gap: 20px; flex-wrap: wrap;
    }
    .agent-summary-bar.visible { display: flex; }
    .sum-chip { display: flex; flex-direction: column; gap: 1px; }
    .sum-chip .v { font-size: 18px; font-weight: 800; color: #a5b4fc; }
    .sum-chip .l { font-size: 11px; color: var(--subtle); }

    /* ── COACHING STRIP ── */
    .coaching-strip {
      background: linear-gradient(135deg, rgba(99,102,241,.07), rgba(139,92,246,.07));
      border: 1px solid rgba(99,102,241,.18);
      border-radius: var(--radius); padding: 13px 18px;
      font-size: 13px; color: #c4b5fd; line-height: 1.7;
    }

    /* ── HEALTH BAR ── */
    .health-bar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 18px;
      display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
    }
    .health-metric { display: flex; flex-direction: column; gap: 2px; }
    .health-metric .hv { font-size: 18px; font-weight: 700; }
    .health-metric .hl { font-size: 11px; color: var(--muted); }
    .health-recs { flex: 1; min-width: 200px; font-size: 12px; color: var(--muted); line-height: 1.8; border-left: 1px solid var(--border); padding-left: 16px; }

    /* ── SECTION CARD ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .card-header {
      padding: 13px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .card-header h2 { font-size: 13px; font-weight: 600; }
    .card-header .count { font-size: 12px; color: var(--subtle); }
    .card-body { padding: 0; }

    /* ── QUADRANT TABS ── */
    .q-tabs {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-left: auto;
    }
    .q-tab {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border); background: transparent;
      color: var(--subtle); transition: all .14s;
    }
    .q-tab:hover { color: var(--muted); border-color: var(--subtle); }
    .q-tab.active { color: var(--text); border-color: var(--subtle); background: rgba(255,255,255,.05); }
    .q-tab.q1-tab.active { border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.1); color: #fca5a5; }
    .q-tab.q2-tab.active { border-color: rgba(96,165,250,.5); background: rgba(96,165,250,.1); color: #93c5fd; }
    .q-tab.q3-tab.active { border-color: rgba(245,158,11,.5); background: rgba(245,158,11,.1); color: #fde68a; }
    .q-tab.q4-tab.active { border-color: rgba(82,82,91,.6); background: rgba(82,82,91,.15); color: var(--muted); }

    /* ── EVENT ITEM ── */
    .event-item {
      padding: 13px 18px; border-bottom: 1px solid var(--border);
      display: flex; gap: 14px; align-items: flex-start;
      transition: background .1s; cursor: pointer;
    }
    .event-item:last-child { border-bottom: none; }
    .event-item:hover { background: rgba(255,255,255,.02); }
    .event-item.done { opacity: .5; }
    .event-time { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 80px; padding-top: 2px; }
    .event-info { flex: 1; }
    .event-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .event-participants { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .event-brief { font-size: 12px; color: var(--subtle); line-height: 1.5; }
    .event-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .btn-meet {
      background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.2);
      color: #86efac; border-radius: 6px; padding: 4px 10px;
      font-size: 11px; font-weight: 600; text-decoration: none;
      white-space: nowrap;
    }
    .btn-done {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--border); background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; transition: border-color .15s, background .15s;
    }
    .btn-done:hover { border-color: var(--green); }
    .btn-done.checked { background: var(--green); border-color: var(--green); color: #fff; }

    /* ── TASK ITEM ── */
    .task-item {
      padding: 13px 18px; border-bottom: 1px solid var(--border);
      display: flex; gap: 12px; align-items: flex-start;
      transition: background .1s;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item:hover { background: rgba(255,255,255,.02); }
    .task-item.done { opacity: .45; }
    .task-item.q1 { border-left: 3px solid rgba(239,68,68,.8); background: rgba(239,68,68,.03); padding-left: 15px; }
    .task-item.q1:hover { background: rgba(239,68,68,.05); }
    .q-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .q-dot.Q1 { background: var(--red); box-shadow: 0 0 6px rgba(239,68,68,.5); }
    .q-dot.Q2 { background: var(--blue); }
    .q-dot.Q3 { background: var(--amber); }
    .q-dot.Q4 { background: var(--subtle); }
    .task-info { flex: 1; min-width: 0; }
    .task-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-item.q1 .task-title { color: #fef2f2; }
    .task-due { font-size: 11px; color: var(--muted); }
    .task-brief { font-size: 12px; color: var(--subtle); margin-top: 5px; line-height: 1.55; display: none; overflow: hidden; max-height: 0; transition: max-height .2s ease, opacity .2s ease; opacity: 0; }
    .task-brief.open { display: block; max-height: 500px; opacity: 1; }
    .task-aps { margin-top: 8px; display: none; flex-direction: column; gap: 4px; }
    .task-aps.open { display: flex; }
    .ap-item {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 12px; color: var(--muted); padding: 4px 0;
    }
    .ap-cb { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--border); background: none; cursor: pointer; flex-shrink: 0; margin-top: 1px; transition: background .1s, border-color .1s; }
    .ap-cb.done { background: var(--green); border-color: var(--green); }
    .ap-text.done { text-decoration: line-through; opacity: .5; }
    .task-actions { display: flex; gap: 6px; align-items: flex-start; flex-shrink: 0; margin-top: 1px; }
    .btn-expand {
      background: none; border: none; color: var(--subtle); font-size: 15px;
      cursor: pointer; padding: 2px; transition: color .15s, transform .18s;
      line-height: 1;
    }
    .btn-expand:hover { color: var(--muted); }
    .btn-expand.open { transform: rotate(180deg); color: var(--muted); }

    /* ── STUDY ITEMS ── */
    .study-item {
      padding: 13px 18px; border-bottom: 1px solid var(--border);
      display: flex; gap: 12px; align-items: flex-start;
    }
    .study-item:last-child { border-bottom: none; }
    .study-item.done { opacity: .4; }
    .study-num { width: 24px; height: 24px; border-radius: 6px; background: rgba(167,139,250,.12); color: #a78bfa; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .study-info { flex: 1; }
    .study-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .study-source { font-size: 11px; color: var(--subtle); margin-bottom: 4px; }
    .study-summary { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 4px; }
    .study-rec { font-size: 12px; color: #6ee7b7; }
    .study-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
    .study-tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
    .study-tag.high  { background: rgba(239,68,68,.15);  color: #f87171; }
    .study-tag.medium{ background: rgba(234,179,8,.12);  color: #fbbf24; }
    .study-tag.low   { background: rgba(107,114,128,.15); color: #9ca3af; }
    .study-tag.cat   { background: rgba(99,102,241,.12); color: #a5b4fc; }
    .study-tag.gmail { background: rgba(52,211,153,.1);  color: #6ee7b7; }

    /* ── FAMILY ── */
    .family-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .family-col { padding: 14px 18px; }
    .family-col:first-child { border-right: 1px solid var(--border); }
    .family-label { font-size: 11px; font-weight: 600; color: var(--subtle); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .family-item { font-size: 13px; color: var(--muted); line-height: 1.7; }
    .family-item .alert { color: var(--amber); font-size: 12px; margin-top: 4px; }

    /* ── NETWORK ── */
    .network-item { padding: 13px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
    .network-item:last-child { border-bottom: none; }
    .network-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; }
    .network-info { flex: 1; }
    .network-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .network-meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .network-desc { font-size: 12px; color: var(--subtle); line-height: 1.5; }
    .network-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
    .network-tag { font-size: 10px; padding: 1px 7px; border-radius: 10px; background: rgba(99,102,241,.12); color: #a5b4fc; font-weight: 600; }
    .btn-register {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      border-radius: 6px; background: rgba(99,102,241,.15); border: 1px solid rgba(99,102,241,.25);
      color: #a5b4fc; text-decoration: none; white-space: nowrap;
      transition: background .12s;
    }
    .btn-register:hover { background: rgba(99,102,241,.25); }

    /* ── EMPTY STATE ── */
    .empty { padding: 32px; text-align: center; color: var(--subtle); font-size: 13px; line-height: 1.7; }
    .empty-section { padding: 18px 18px; color: var(--subtle); font-size: 13px; line-height: 1.7; }
    .empty .big { font-size: 28px; margin-bottom: 8px; }

    /* ── USER MENU ── */
    .user-menu {
      position: absolute; top: 52px; right: 16px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 8px; min-width: 200px; z-index: 200;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      display: none;
    }
    .user-menu.open { display: block; }
    .um-name { padding: 8px 12px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border); margin-bottom: 4px; color: var(--text); }
    .um-email { font-size: 11px; color: var(--subtle); font-weight: 400; }
    .um-item { padding: 8px 12px; font-size: 13px; color: var(--muted); cursor: pointer; border-radius: 8px; transition: background .1s; text-decoration: none; display: block; }
    .um-item:hover { background: rgba(255,255,255,.05); color: var(--text); }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .family-grid { grid-template-columns: 1fr; }
      .family-col:first-child { border-right: none; border-bottom: 1px solid var(--border); }
      .stats-strip { gap: 6px; }
      .stat-chip { min-width: 80px; }
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <a class="tb-logo" href="/app.html"><div class="gem">✦</div><span>Glint</span></a>
  <span class="tb-date" id="tb-date"></span>
  <div class="tb-right">
    <button class="btn-run" id="run-btn" onclick="runAgent(false)">☀️ Briefing</button>
    <button class="btn-run" onclick="runAgent(true)" style="background:#3f3f46;font-size:12px;padding:5px 10px;" title="Rianalizza tutte le email da capo">⚡</button>
    <a href="/wellness.html" class="btn-settings" title="Wellness &amp; Brain Training" style="font-size:16px">🧠</a>
    <a href="/settings.html" class="btn-settings">⚙️</a>
    <div class="avatar" id="avatar-btn" onclick="toggleUserMenu()">?
      <img id="avatar-img" src="" style="display:none"/>
    </div>
  </div>
  <div class="user-menu" id="user-menu">
    <div class="um-name" id="um-name">Caricamento...</div>
    <a href="/wellness.html" class="um-item">🧠 Wellness &amp; Brain</a>
    <a href="/settings.html" class="um-item">⚙️ Impostazioni</a>
    <div class="um-item" onclick="logout()">↩ Esci</div>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">Oggi</div>
    <div class="sidebar-item active" onclick="showSection('all', this)">
      <span class="icon">📋</span><span class="sb-label">Panoramica</span>
    </div>
    <div class="sidebar-item" onclick="showSection('events', this)">
      <span class="icon">📅</span><span class="sb-label">Riunioni</span>
      <span class="badge blue" id="sb-events">0</span>
    </div>
    <div class="sidebar-item" onclick="showSection('tasks', this)">
      <span class="icon">📧</span><span class="sb-label">Email</span>
      <span class="badge" id="sb-tasks">0</span>
    </div>
    <div class="sidebar-section">Altro</div>
    <div class="sidebar-item" onclick="showSection('growth', this)">
      <span class="icon">📚</span><span class="sb-label">Crescita</span>
      <span class="badge grey" id="sb-growth" style="display:none">0</span>
    </div>
    <div class="sidebar-item" onclick="showSection('family', this)">
      <span class="icon">👨‍👩‍👦</span><span class="sb-label">Famiglia</span>
    </div>
    <div class="sidebar-item" onclick="showSection('network', this)">
      <span class="icon">🌐</span><span class="sb-label">Network</span>
      <span class="badge blue" id="sb-network" style="display:none">0</span>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main-content">
    <div class="empty"><div class="big">☀️</div>Caricamento briefing...</div>
  </main>
</div>

<!-- User menu overlay -->
<div id="overlay" style="display:none;position:fixed;inset:0;z-index:150;" onclick="closeUserMenu()"></div>

<script>
const today = new Date().toISOString().slice(0,10);
let dayData = null;
let currentSection = 'all';
let userName = '';
let qFilter = 'all';

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  // Set date
  const d = new Date();
  document.getElementById('tb-date').textContent = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });

  // Load user
  try {
    const r = await fetch('/api/me', { credentials: 'include' });
    if (r.status === 401) { location.href = '/login.html'; return; }
    const u = await r.json();
    userName = u.name || '';
    const initials = userName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase() || '?';
    document.getElementById('avatar-btn').childNodes[0].nodeValue = initials;
    if (u.picture) {
      const img = document.getElementById('avatar-img');
      img.src = u.picture; img.style.display = 'block';
    }
    document.getElementById('um-name').innerHTML = `${esc(u.name || '')}<div class="um-email">${esc(u.email || '')}</div>`;
  } catch(e) { location.href = '/login.html'; return; }

  await loadDay();
})();

async function loadDay() {
  try {
    const r = await fetch(`/api/day/${today}`, { credentials: 'include' });
    dayData = await r.json();
    // Set default qFilter based on whether there are Q1 tasks
    const tasks = dayData?.tasks || [];
    const items = dayData?.items || {};
    const hasQ1 = tasks.some(t => (t.quadrant||'Q2').toUpperCase() === 'Q1' && !items[t.id]?.done);
    if (qFilter === 'all' && hasQ1) qFilter = 'Q1';
    render();
  } catch(e) {
    renderEmpty();
  }
}

// ── setQFilter ─────────────────────────────────────────────────────────────────
function setQFilter(q) {
  qFilter = q;
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const d = dayData || {};
  const events   = d.events   || [];
  const tasks    = d.tasks    || [];
  const items    = d.items    || {};
  const insights = d.insights || {};
  const family   = d.family   || {};
  const network  = d.network  || {};
  const health   = d.health   || null;
  const study    = insights.studyItems || [];
  const networkEvts = network.events || [];

  // ── Compute stats ──
  const q1Tasks  = tasks.filter(t => (t.quadrant||'Q2').toUpperCase() === 'Q1');
  const q2Tasks  = tasks.filter(t => (t.quadrant||'Q2').toUpperCase() === 'Q2');
  const q3Tasks  = tasks.filter(t => (t.quadrant||'Q2').toUpperCase() === 'Q3');
  const q4Tasks  = tasks.filter(t => (t.quadrant||'Q2').toUpperCase() === 'Q4');
  const q1Count  = q1Tasks.filter(t => !items[t.id]?.done).length;
  const networkCount = networkEvts.length;
  const growthCount  = study.length;

  // ── Update sidebar badges ──
  document.getElementById('sb-events').textContent = events.length;
  const tasksBadge = q1Count > 0 ? q1Count : tasks.filter(t => !items[t.id]?.done).length;
  const tasksEl = document.getElementById('sb-tasks');
  tasksEl.textContent = tasksBadge;
  if (q1Count > 0) {
    tasksEl.className = 'badge';
  } else {
    tasksEl.className = 'badge blue';
  }

  const growthEl = document.getElementById('sb-growth');
  if (growthCount > 0) { growthEl.textContent = growthCount; growthEl.style.display = ''; }
  else { growthEl.style.display = 'none'; }

  const networkEl = document.getElementById('sb-network');
  if (networkCount > 0) { networkEl.textContent = networkCount; networkEl.style.display = ''; }
  else { networkEl.style.display = 'none'; }

  const main = document.getElementById('main-content');
  let html = '';

  // ── PANORAMICA / ALL header ──
  if (currentSection === 'all' || currentSection === 'panoramica') {
    const dayType = insights.dayType || '';
    const dayTypeHtml = dayType
      ? `<div class="day-type-badge ${dayType}">${{focus:'🧘 Focus Day', maker:'🛠️ Maker Day', manager:'👔 Manager Day'}[dayType] || dayType}</div>`
      : '';
    const done  = Object.values(items).filter(i => i.done).length;
    const total = events.length + tasks.length;

    html += `<div class="greeting-row">
      <div class="greeting-title">Buongiorno${userName ? ', ' + esc(userName.split(' ')[0]) : ''} 👋</div>
      ${dayTypeHtml}
      <span class="greeting-progress">${done}/${total} completati</span>
    </div>`;

    // Stats strip
    html += `<div class="stats-strip">
      <div class="stat-chip">
        <span class="sicon">📅</span>
        <div class="stat-chip-inner"><span class="sv">${events.length}</span><span class="sl">riunioni</span></div>
      </div>
      <div class="stat-chip ${q1Count > 0 ? 'red-chip' : ''}">
        <span class="sicon">🔴</span>
        <div class="stat-chip-inner"><span class="sv">${q1Count}</span><span class="sl">urgenti Q1</span></div>
      </div>
      <div class="stat-chip">
        <span class="sicon">📧</span>
        <div class="stat-chip-inner"><span class="sv">${tasks.length}</span><span class="sl">email</span></div>
      </div>
      <div class="stat-chip">
        <span class="sicon">📚</span>
        <div class="stat-chip-inner"><span class="sv">${growthCount}</span><span class="sl">da leggere</span></div>
      </div>
    </div>`;

    // Agent panel (hidden by default, shown when running)
    html += `<div class="agent-panel" id="agent-panel">
      <div class="agent-panel-header">
        <span>☀️ Morning Agent</span>
        <button class="agent-close" onclick="closeAgentPanel()">×</button>
      </div>
      <div class="agent-log-box" id="agent-log"></div>
      <div class="agent-summary-bar" id="agent-summary"></div>
    </div>`;

    // Coaching strip
    if (insights.growthBrief) {
      html += `<div class="coaching-strip">✦ ${esc(insights.growthBrief).replace(/\n/g,'<br/>')}</div>`;
    }

    // Health bar
    if (health) {
      const s = health.sleepScore; const hrv = health.hrv; const stress = health.stressLevel;
      const recs = health.recommendations;
      html += `<div class="health-bar">
        <div class="health-metric"><div class="hv" style="color:${s>=76?'#86efac':s>=60?'#fde68a':'#fca5a5'}">${s||'?'}/100</div><div class="hl">Sonno</div></div>
        <div class="health-metric"><div class="hv">${hrv||'?'} ms</div><div class="hl">HRV</div></div>
        <div class="health-metric"><div class="hv">${health.restingHR||'?'} bpm</div><div class="hl">FC riposo</div></div>
        <div class="health-metric"><div class="hv">${stress||'?'}</div><div class="hl">Stress</div></div>
        ${recs ? `<div class="health-recs">🏃 ${esc(recs.activity)}<br/>🧠 ${esc(recs.mindset)}</div>` : ''}
      </div>`;
    }
  } else {
    // In single-section views still show the agent panel so it can appear
    html += `<div class="agent-panel" id="agent-panel">
      <div class="agent-panel-header">
        <span>☀️ Morning Agent</span>
        <button class="agent-close" onclick="closeAgentPanel()">×</button>
      </div>
      <div class="agent-log-box" id="agent-log"></div>
      <div class="agent-summary-bar" id="agent-summary"></div>
    </div>`;
  }

  // ── EVENTS ──
  if (currentSection === 'all' || currentSection === 'events') {
    if (events.length > 0) {
      html += `<div class="card">
        <div class="card-header"><h2>📅 Riunioni di oggi</h2><span class="count">${events.length}</span></div>
        <div class="card-body">`;
      for (const evt of events) {
        const st = items[evt.id] || {};
        const brief = st.brief || evt.brief || '';
        html += `<div class="event-item ${st.done ? 'done' : ''}" id="ei-${esc(evt.id)}">
          <div class="event-time">${esc(evt.time || '')}</div>
          <div class="event-info">
            <div class="event-title">${esc(evt.title)}</div>
            ${evt.participants ? `<div class="event-participants">👥 ${esc(evt.participants)}</div>` : ''}
            ${brief ? `<div class="event-brief">${esc(brief).slice(0,200)}…</div>` : ''}
          </div>
          <div class="event-actions">
            ${evt.meetLink ? `<a href="${esc(evt.meetLink)}" target="_blank" class="btn-meet">Join ↗</a>` : ''}
            <button class="btn-done ${st.done ? 'checked' : ''}" onclick="toggleDone('${esc(evt.id)}','event')">${st.done ? '✓' : ''}</button>
          </div>
        </div>`;
      }
      html += `</div></div>`;
    } else if (currentSection === 'events') {
      html += `<div class="card"><div class="empty"><div class="big">📅</div>Nessuna riunione per oggi.</div></div>`;
    }
  }

  // ── TASKS with quadrant tabs ──
  if (currentSection === 'all' || currentSection === 'tasks') {
    // Build tab HTML
    const countFor = q => tasks.filter(t => (t.quadrant||'Q2').toUpperCase() === q).length;
    const allCount = tasks.length;
    const qTabsHtml = `<div class="q-tabs">
      <button class="q-tab ${qFilter==='all'?'active':''}" onclick="setQFilter('all')">Tutti (${allCount})</button>
      <button class="q-tab q1-tab ${qFilter==='Q1'?'active':''}" onclick="setQFilter('Q1')">🔴 Q1 (${countFor('Q1')})</button>
      <button class="q-tab q2-tab ${qFilter==='Q2'?'active':''}" onclick="setQFilter('Q2')">🔵 Q2 (${countFor('Q2')})</button>
      <button class="q-tab q3-tab ${qFilter==='Q3'?'active':''}" onclick="setQFilter('Q3')">🟠 Q3 (${countFor('Q3')})</button>
      <button class="q-tab q4-tab ${qFilter==='Q4'?'active':''}" onclick="setQFilter('Q4')">⚫ Q4 (${countFor('Q4')})</button>
    </div>`;

    const filteredTasks = qFilter === 'all' ? tasks : tasks.filter(t => (t.quadrant||'Q2').toUpperCase() === qFilter);
    // Sort: Q1 first when showing all
    const sortedTasks = qFilter === 'all'
      ? [...q1Tasks, ...q2Tasks, ...q3Tasks, ...q4Tasks]
      : filteredTasks;

    html += `<div class="card">
      <div class="card-header">
        <h2>📧 Email</h2>
        <span class="count">${tasks.filter(t => !items[t.id]?.done).length} attivi</span>
        ${qTabsHtml}
      </div>
      <div class="card-body">`;

    if (sortedTasks.length > 0) {
      html += sortedTasks.map(t => renderTask(t, items[t.id] || {})).join('');
    } else if (tasks.length === 0) {
      html += `<div class="empty"><div class="big">📧</div>Nessuna email da gestire.<br/>Clicca <strong>☀️ Briefing</strong> per analizzare la tua inbox.</div>`;
    } else {
      html += `<div class="empty"><div class="big">✅</div>Nessun task in questa categoria.</div>`;
    }
    html += `</div></div>`;
  }

  // ── GROWTH / STUDY ──
  if (currentSection === 'all' || currentSection === 'growth') {
    const highItems   = study.filter(s => s.priority === 'high');
    const mediumItems = study.filter(s => s.priority === 'medium');
    const lowItems    = study.filter(s => s.priority === 'low' || !s.priority);
    const byGmailCat = {};
    study.forEach(s => { const k = s.gmailCategory||s.source||''; byGmailCat[k] = (byGmailCat[k]||0)+1; });
    const catSummary = ['Aggiornamenti','Social','Promozioni','Forum']
      .filter(c => study.some(s => s.gmailCategory === c))
      .map(c => `${c}: ${study.filter(s=>s.gmailCategory===c).length}`)
      .join(' · ');

    const renderStudyItem = (s, i) => `
      <div class="study-item ${s.done ? 'done' : ''}" id="study-${i}">
        <div class="study-num">${i+1}</div>
        <div class="study-info">
          <div class="study-title">
            ${s.link ? `<a href="${esc(s.link)}" target="_blank" style="color:inherit;text-decoration:none;">${esc(s.title||'')}</a>` : esc(s.title||'')}
          </div>
          <div class="study-source">${esc(s.source||'')}${s.gmailCategory ? ` · Gmail: ${esc(s.gmailCategory)}` : ''}</div>
          <div class="study-summary">${esc(s.summary||'')}</div>
          ${s.recommendation ? `<div class="study-rec">→ ${esc(s.recommendation)}</div>` : ''}
          <div class="study-tags">
            <span class="study-tag ${s.priority||'medium'}">${s.priority||'medium'}</span>
            ${s.category ? `<span class="study-tag cat">${esc(s.category)}</span>` : ''}
          </div>
        </div>
        <div>
          <button class="btn-done ${s.done ? 'checked' : ''}" style="margin-top:2px;" onclick="toggleStudy(${i})">${s.done ? '✓' : ''}</button>
        </div>
      </div>`;

    html += `<div class="card">
      <div class="card-header">
        <h2>📚 Crescita · Da leggere</h2>
        ${study.length ? `<span class="count">${study.length}</span>` : ''}
        ${study.length && catSummary ? `<span style="font-size:11px;color:var(--subtle);margin-left:4px;">${esc(catSummary)}</span>` : ''}
      </div>
      <div class="card-body">
        ${study.length ? [
            ...highItems.map((s) => renderStudyItem(s, study.indexOf(s))),
            ...mediumItems.map((s) => renderStudyItem(s, study.indexOf(s))),
            ...lowItems.map((s) => renderStudyItem(s, study.indexOf(s)))
          ].join('') : `<div class="empty-section">Nessun contenuto trovato in Aggiornamenti, Social o Promozioni.<br/><span style="font-size:12px;color:var(--subtle)">Clicca ⚡ per avviare l'agente che analizza tutte le categorie Gmail.</span></div>`}
      </div>
    </div>`;
  }

  // ── FAMILY ──
  if (currentSection === 'all' || currentSection === 'family') {
    const al = family.alessandraEvents || [];
    const tm = family.tommasoAlerts   || [];
    const spouseName = (dayData?.userSettings?.familyMembers||[]).find(f=>f.role==='spouse')?.name || 'Partner';
    const childName  = (dayData?.userSettings?.familyMembers||[]).find(f=>f.role==='child')?.name  || 'Figli';
    html += `<div class="card">
      <div class="card-header"><h2>👨‍👩‍👦 Famiglia</h2></div>
      <div class="family-grid">
        <div class="family-col">
          <div class="family-label">${esc(spouseName)}</div>
          <div class="family-item">${al.length
            ? al.map(e => `${e.time ? esc(e.time) + ' · ' : ''}${esc(e.title)}${e.isAway ? '<div class="alert">⚠️ Non sarà a casa</div>' : ''}`).join('<br/>')
            : '<span style="color:var(--subtle)">Nessun impegno rilevato oggi</span>'}</div>
        </div>
        <div class="family-col">
          <div class="family-label">${esc(childName)} · Scuola</div>
          <div class="family-item">${tm.length
            ? tm.map(t => `<a href="${esc(t.link)}" target="_blank" style="color:var(--blue);text-decoration:none;">${esc(t.title)}</a>${t.priority === 'high' ? ' 🔴' : ''}`).join('<br/>')
            : '<span style="color:var(--subtle)">Nessuna comunicazione recente</span>'}</div>
        </div>
      </div>
      ${!al.length && !tm.length ? `<div style="padding:8px 18px 14px;font-size:12px;color:var(--subtle)">Configura i membri della famiglia in <a href="/settings.html" style="color:var(--accent);text-decoration:none;">Impostazioni → Famiglia</a> per abilitare il monitoraggio.</div>` : ''}
    </div>`;
  }

  // ── NETWORK ──
  if (currentSection === 'all' || currentSection === 'network') {
    const city = network.city || '';
    html += `<div class="card">
      <div class="card-header">
        <h2>🌐 Network${city ? ' · ' + esc(city) : ''}</h2>
        ${networkEvts.length ? `<span class="count">${networkEvts.length} eventi</span>` : ''}
      </div>
      <div class="card-body">
        ${networkEvts.length
          ? networkEvts.map(e => `<div class="network-item">
              <div class="network-dot"></div>
              <div class="network-info">
                <div class="network-title">${esc(e.title||'')}</div>
                <div class="network-meta">${esc(e.date||'')}${e.time ? ' · ' + esc(e.time) : ''}${e.location ? ' · ' + esc(e.location) : ''}</div>
                ${e.description ? `<div class="network-desc">${esc(e.description)}</div>` : ''}
                ${(e.tags && e.tags.length) ? `<div class="network-tags">${e.tags.slice(0,4).map(tag=>`<span class="network-tag">${esc(tag)}</span>`).join('')}</div>` : ''}
              </div>
              ${e.link ? `<a href="${esc(e.link)}" target="_blank" class="btn-register">↗ Registrati</a>` : ''}
            </div>`).join('')
          : `<div class="empty-section">Nessun evento trovato. Clicca ☀️ Briefing per cercare eventi ${city ? 'a ' + esc(city) : 'nella tua città'}.</div>`
        }
      </div>
    </div>`;
  }

  if (!html) html = renderEmpty(true);
  main.innerHTML = html;

  // Restore agent panel visibility if it was visible before re-render
  if (_agentPanelVisible) {
    const p = document.getElementById('agent-panel');
    if (p) p.classList.add('visible');
    const logEl = document.getElementById('agent-log');
    if (logEl && _agentLogLines.length) {
      _agentLogLines.forEach(line => {
        const div = document.createElement('div');
        if (line.cls) div.className = line.cls;
        div.textContent = line.text;
        logEl.appendChild(div);
      });
      logEl.scrollTop = logEl.scrollHeight;
    }
    const sumEl = document.getElementById('agent-summary');
    if (sumEl && _agentSummaryHtml) {
      sumEl.innerHTML = _agentSummaryHtml;
      sumEl.classList.add('visible');
    }
  }
}

function renderEmpty(ret = false) {
  const html = `<div class="card"><div class="empty">
    <div class="big">☀️</div>
    Nessun dato per oggi.<br/>
    Clicca <strong>☀️ Briefing</strong> in alto per analizzare Gmail e Calendar.
  </div></div>`;
  if (ret) return html;
  document.getElementById('main-content').innerHTML = html;
}

function renderTask(t, st) {
  const aps = st.actionPoints || [];
  const q = (t.quadrant || 'Q2').toUpperCase();
  return `<div class="task-item ${st.done ? 'done' : ''} ${q === 'Q1' ? 'q1' : ''}" id="ti-${esc(t.id)}">
    <div class="q-dot ${q}"></div>
    <div class="task-info">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-due">${esc(t.due||'')} ${t.link ? `<a href="${esc(t.link)}" target="_blank" style="color:var(--accent);text-decoration:none;margin-left:4px;">↗ Apri</a>` : ''}</div>
      <div class="task-brief" id="brief-${esc(t.id)}">${esc(t.brief||'').replace(/\n/g,'<br/>')}</div>
      ${aps.length ? `<div class="task-aps" id="aps-${esc(t.id)}">
        ${aps.map((ap,i) => `<div class="ap-item">
          <div class="ap-cb ${ap.done ? 'done' : ''}" onclick="toggleAp('${esc(t.id)}','${esc(ap.id)}',${i})"></div>
          <span class="ap-text ${ap.done ? 'done' : ''}">${esc(ap.text||'')}</span>
        </div>`).join('')}
      </div>` : ''}
    </div>
    <div class="task-actions">
      <button class="btn-expand" id="exp-${esc(t.id)}" onclick="expandTask('${esc(t.id)}')" title="Espandi">⌄</button>
      <button class="btn-done ${st.done ? 'checked' : ''}" onclick="toggleDone('${esc(t.id)}','task')">${st.done ? '✓' : ''}</button>
    </div>
  </div>`;
}

// ── Interactions ──────────────────────────────────────────────────────────────
function showSection(s, el) {
  currentSection = s;
  document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
  if (el) el.classList.add('active');
  render();
}

function expandTask(id) {
  const brief  = document.getElementById(`brief-${id}`);
  const aps    = document.getElementById(`aps-${id}`);
  const expBtn = document.getElementById(`exp-${id}`);
  if (brief) brief.classList.toggle('open');
  if (aps)   aps.classList.toggle('open');
  if (expBtn) expBtn.classList.toggle('open');
}

async function toggleDone(id, type) {
  if (!dayData) return;
  if (!dayData.items) dayData.items = {};
  if (!dayData.items[id]) dayData.items[id] = {};
  dayData.items[id].done = !dayData.items[id].done;
  render();
  await fetch(`/api/day/${today}/item/${id}`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done: dayData.items[id].done })
  });
}

async function toggleAp(taskId, apId, idx) {
  if (!dayData?.items?.[taskId]?.actionPoints) return;
  const ap = dayData.items[taskId].actionPoints.find(a => a.id === apId) || dayData.items[taskId].actionPoints[idx];
  if (!ap) return;
  ap.done = !ap.done;
  render();
  await fetch(`/api/day/${today}/item/${taskId}/action-point/${apId}`, {
    method: 'PATCH', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done: ap.done })
  });
}

async function toggleStudy(idx) {
  if (!dayData?.insights?.studyItems?.[idx]) return;
  const s = dayData.insights.studyItems[idx];
  s.done = !s.done;
  render();
  await fetch(`/api/day/${today}/study-item/${idx}/done`, {
    method: 'PATCH', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done: s.done })
  });
}

// ── Agent panel state (persists across renders) ────────────────────────────────
let _agentPanelVisible = false;
let _agentLogLines = [];
let _agentSummaryHtml = '';

// ── Morning Agent runner ───────────────────────────────────────────────────────
async function runAgent(force = false) {
  const btn = document.getElementById('run-btn');
  _agentPanelVisible = true;
  _agentLogLines = [];
  _agentSummaryHtml = '';

  btn.disabled = true;
  btn.textContent = force ? '⚡ Force refresh...' : '⏳ In esecuzione...';

  // Make sure we're on panoramica so panel is visible
  if (currentSection !== 'all' && currentSection !== 'panoramica') {
    currentSection = 'all';
    document.querySelectorAll('.sidebar-item').forEach((el, i) => {
      el.classList.toggle('active', i === 0);
    });
  }
  render();

  const panel  = document.getElementById('agent-panel');
  const logEl  = document.getElementById('agent-log');
  const sumEl  = document.getElementById('agent-summary');
  if (panel) panel.classList.add('visible');
  if (logEl) logEl.innerHTML = '';
  if (sumEl) sumEl.classList.remove('visible');

  const url = force
    ? `/api/morning-agent/${today}/run?force=true`
    : `/api/morning-agent/${today}/run`;

  try {
    const r = await fetch(url, { method: 'POST', credentials: 'include' });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const ev = JSON.parse(line.slice(6));
          if (ev.log) {
            const currentLog = document.getElementById('agent-log');
            if (currentLog) {
              const dv = document.createElement('div');
              dv.textContent = ev.log;
              currentLog.appendChild(dv);
              currentLog.scrollTop = currentLog.scrollHeight;
            }
            _agentLogLines.push({ text: ev.log, cls: null });
          }
          if (ev.error) {
            const currentLog = document.getElementById('agent-log');
            if (currentLog) {
              const dv = document.createElement('div');
              dv.className = 'log-err'; dv.textContent = '❌ ' + ev.error;
              currentLog.appendChild(dv);
            }
            _agentLogLines.push({ text: '❌ ' + ev.error, cls: 'log-err' });
          }
          if (ev.done && ev.summary) {
            const s = ev.summary;
            const currentLog = document.getElementById('agent-log');
            if (currentLog) {
              const dv = document.createElement('div');
              dv.className = 'log-done'; dv.textContent = '✅ Completato';
              currentLog.appendChild(dv);
            }
            _agentLogLines.push({ text: '✅ Completato', cls: 'log-done' });
            _agentSummaryHtml = [
              { v: s.events||0,     l: 'eventi' },
              { v: s.tasks||0,      l: 'email' },
              { v: s.dayType||'—',  l: 'giornata' },
              { v: s.studyItems||0, l: 'newsletter' },
              { v: s.emailSent ? '✓':'✗', l: 'email inviata' }
            ].map(x => `<div class="sum-chip"><div class="v">${x.v}</div><div class="l">${x.l}</div></div>`).join('');
            const currentSum = document.getElementById('agent-summary');
            if (currentSum) { currentSum.innerHTML = _agentSummaryHtml; currentSum.classList.add('visible'); }
            await loadDay();
          }
        } catch(e) { /* skip */ }
      }
    }
  } catch(e) {
    const currentLog = document.getElementById('agent-log');
    if (currentLog) {
      const dv = document.createElement('div');
      dv.className = 'log-err'; dv.textContent = '❌ ' + e.message;
      currentLog.appendChild(dv);
    }
    _agentLogLines.push({ text: '❌ ' + e.message, cls: 'log-err' });
  }

  btn.disabled = false;
  btn.textContent = '☀️ Briefing';
}

function closeAgentPanel() {
  _agentPanelVisible = false;
  _agentLogLines = [];
  _agentSummaryHtml = '';
  document.getElementById('agent-panel')?.classList.remove('visible');
}

// ── User menu ──────────────────────────────────────────────────────────────────
function toggleUserMenu() {
  document.getElementById('user-menu').classList.toggle('open');
  document.getElementById('overlay').style.display = 'block';
}
function closeUserMenu() {
  document.getElementById('user-menu').classList.remove('open');
  document.getElementById('overlay').style.display = 'none';
}
async function logout() {
  if (!confirm('Sei sicuro di voler uscire da Glint?')) return;
  await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  location.href = '/login.html';
}

// ── Utils ──────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
