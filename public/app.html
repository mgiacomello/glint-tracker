<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glint — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090b; --surface: #111113; --card: #18181b; --border: #27272a;
      --text: #fafafa; --muted: #a1a1aa; --subtle: #52525b;
      --accent: #6366f1; --accent2: #8b5cf6;
      --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --blue: #60a5fa;
      --radius: 12px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── TOPBAR ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(9,9,11,.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      height: 56px; padding: 0 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .tb-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .tb-logo .gem { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .tb-logo span { font-size: 16px; font-weight: 700; color: var(--text); }
    .tb-date { font-size: 13px; color: var(--muted); margin-left: 4px; }
    .tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .btn-run {
      display: flex; align-items: center; gap: 6px;
      background: var(--accent); border: none; border-radius: 8px;
      color: #fff; padding: 6px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity .15s;
    }
    .btn-run:hover { opacity: .85; }
    .btn-run:disabled { opacity: .4; cursor: not-allowed; }
    .btn-settings {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); padding: 6px 12px; font-size: 13px;
      cursor: pointer; text-decoration: none; transition: color .15s, border-color .15s;
    }
    .btn-settings:hover { color: var(--text); border-color: var(--subtle); }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ── LAYOUT ── */
    .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 56px); }

    /* ── SIDEBAR ── */
    .sidebar {
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      display: flex; flex-direction: column; gap: 6px;
      position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto;
    }
    .sidebar-section { font-size: 11px; font-weight: 600; color: var(--subtle); text-transform: uppercase; letter-spacing: .06em; padding: 12px 8px 4px; }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500;
      transition: background .15s, color .15s; text-decoration: none;
    }
    .sidebar-item:hover { background: var(--card); color: var(--text); }
    .sidebar-item.active { background: rgba(99,102,241,.12); color: #a5b4fc; }
    .sidebar-item .icon { font-size: 15px; width: 20px; text-align: center; }
    .sidebar-item .badge { margin-left: auto; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; }
    .sidebar-item .badge.blue { background: var(--accent); }

    /* ── MAIN ── */
    .main { padding: 24px; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }

    /* ── DAY HEADER ── */
    .day-header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .day-title { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
    .day-type-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .day-type-badge.focus  { background: rgba(34,197,94,.12);  color: #86efac; }
    .day-type-badge.maker  { background: rgba(245,158,11,.12); color: #fde68a; }
    .day-type-badge.manager{ background: rgba(99,102,241,.12); color: #a5b4fc; }
    .day-header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .progress-ring { font-size: 12px; color: var(--muted); }

    /* ── AGENT LOG (run panel) ── */
    .agent-panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: none;
    }
    .agent-panel.visible { display: block; }
    .agent-panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
    .agent-panel-header span { font-size: 13px; font-weight: 600; flex: 1; }
    .agent-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
    .agent-log-box {
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px;
      color: #86efac; background: #0a0a0c;
      padding: 14px 16px; max-height: 200px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 3px;
    }
    .log-err { color: #fca5a5; }
    .log-done { color: #a78bfa; font-weight: 600; }
    .agent-summary-bar {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: none; gap: 20px; flex-wrap: wrap;
    }
    .agent-summary-bar.visible { display: flex; }
    .sum-chip { display: flex; flex-direction: column; gap: 1px; }
    .sum-chip .v { font-size: 18px; font-weight: 800; color: #a5b4fc; }
    .sum-chip .l { font-size: 11px; color: var(--subtle); }

    /* ── SECTION CARD ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .card-header {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .card-header h2 { font-size: 13px; font-weight: 600; flex: 1; }
    .card-header .count { font-size: 12px; color: var(--subtle); }
    .card-body { padding: 0; }

    /* ── COACHING STRIP ── */
    .coaching-strip {
      background: linear-gradient(135deg, rgba(99,102,241,.08), rgba(139,92,246,.08));
      border: 1px solid rgba(99,102,241,.2);
      border-radius: var(--radius); padding: 14px 18px;
      font-size: 13px; color: #c4b5fd; line-height: 1.7;
    }

    /* ── HEALTH BAR ── */
    .health-bar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 18px;
      display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
    }
    .health-metric { display: flex; flex-direction: column; gap: 2px; }
    .health-metric .hv { font-size: 18px; font-weight: 700; }
    .health-metric .hl { font-size: 11px; color: var(--muted); }
    .health-recs { flex: 1; min-width: 200px; font-size: 12px; color: var(--muted); line-height: 1.8; border-left: 1px solid var(--border); padding-left: 16px; }

    /* ── EVENT ITEM ── */
    .event-item {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; gap: 14px; align-items: flex-start;
      transition: background .1s; cursor: pointer;
    }
    .event-item:last-child { border-bottom: none; }
    .event-item:hover { background: rgba(255,255,255,.02); }
    .event-item.done { opacity: .5; }
    .event-time { font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 90px; padding-top: 2px; }
    .event-info { flex: 1; }
    .event-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .event-participants { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .event-brief { font-size: 12px; color: var(--subtle); line-height: 1.5; }
    .event-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .btn-meet {
      background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.2);
      color: #86efac; border-radius: 6px; padding: 4px 10px;
      font-size: 11px; font-weight: 600; text-decoration: none;
      white-space: nowrap;
    }
    .btn-done {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--border); background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; transition: border-color .15s, background .15s;
    }
    .btn-done:hover { border-color: var(--green); }
    .btn-done.checked { background: var(--green); border-color: var(--green); color: #fff; }

    /* ── TASK ITEM ── */
    .task-item {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; gap: 12px; align-items: flex-start;
      transition: background .1s;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item:hover { background: rgba(255,255,255,.02); }
    .task-item.done { opacity: .45; }
    .q-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .q-dot.Q1 { background: var(--red); box-shadow: 0 0 6px rgba(239,68,68,.4); }
    .q-dot.Q2 { background: var(--blue); }
    .q-dot.Q3 { background: var(--amber); }
    .q-dot.Q4 { background: var(--subtle); }
    .task-info { flex: 1; min-width: 0; }
    .task-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-due { font-size: 11px; color: var(--muted); }
    .task-brief { font-size: 12px; color: var(--subtle); margin-top: 4px; line-height: 1.5; display: none; }
    .task-brief.open { display: block; }
    .task-aps { margin-top: 8px; display: none; flex-direction: column; gap: 4px; }
    .task-aps.open { display: flex; }
    .ap-item {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 12px; color: var(--muted); padding: 4px 0;
    }
    .ap-cb { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--border); background: none; cursor: pointer; flex-shrink: 0; margin-top: 1px; transition: background .1s, border-color .1s; }
    .ap-cb.done { background: var(--green); border-color: var(--green); }
    .ap-text.done { text-decoration: line-through; opacity: .5; }
    .task-link-btn {
      background: none; border: none; color: var(--subtle);
      font-size: 11px; cursor: pointer; padding: 0;
      transition: color .15s; white-space: nowrap;
    }
    .task-link-btn:hover { color: var(--muted); }
    .task-actions { display: flex; gap: 6px; align-items: flex-start; flex-shrink: 0; margin-top: 1px; }
    .btn-expand {
      background: none; border: none; color: var(--subtle); font-size: 15px;
      cursor: pointer; padding: 0; transition: color .15s;
    }
    .btn-expand:hover { color: var(--muted); }

    /* ── STUDY ITEMS ── */
    .study-item {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; gap: 12px; align-items: flex-start;
    }
    .study-item:last-child { border-bottom: none; }
    .study-item.done { opacity: .4; }
    .study-num { width: 24px; height: 24px; border-radius: 6px; background: rgba(167,139,250,.12); color: #a78bfa; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .study-info { flex: 1; }
    .study-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .study-source { font-size: 11px; color: var(--subtle); margin-bottom: 4px; }
    .study-summary { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 4px; }
    .study-rec { font-size: 12px; color: #6ee7b7; }

    /* ── FAMILY ── */
    .family-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .family-col { padding: 14px 18px; }
    .family-col:first-child { border-right: 1px solid var(--border); }
    .family-label { font-size: 11px; font-weight: 600; color: var(--subtle); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .family-item { font-size: 13px; color: var(--muted); line-height: 1.7; }
    .family-item .alert { color: var(--amber); font-size: 12px; margin-top: 4px; }

    /* ── NETWORK ── */
    .network-item { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; }
    .network-item:last-child { border-bottom: none; }
    .network-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; }
    .network-info { flex: 1; }
    .network-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .network-date { font-size: 11px; color: var(--muted); }
    .network-link { font-size: 11px; color: var(--accent); text-decoration: none; }
    .network-link:hover { text-decoration: underline; }

    /* ── EMPTY STATE ── */
    .empty { padding: 32px; text-align: center; color: var(--subtle); font-size: 13px; line-height: 1.7; }
    .empty-section { padding: 16px 0; color: var(--subtle); font-size: 13px; line-height: 1.7; }
    .empty .big { font-size: 28px; margin-bottom: 8px; }

    /* ── USER MENU ── */
    .user-menu {
      position: absolute; top: 52px; right: 16px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 8px; min-width: 200px; z-index: 200;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
      display: none;
    }
    .user-menu.open { display: block; }
    .um-name { padding: 8px 12px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--border); margin-bottom: 4px; color: var(--text); }
    .um-email { font-size: 11px; color: var(--subtle); font-weight: 400; }
    .um-item { padding: 8px 12px; font-size: 13px; color: var(--muted); cursor: pointer; border-radius: 8px; transition: background .1s; text-decoration: none; display: block; }
    .um-item:hover { background: rgba(255,255,255,.05); color: var(--text); }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .family-grid { grid-template-columns: 1fr; }
      .family-col:first-child { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <a class="tb-logo" href="/app.html"><div class="gem">✦</div><span>Glint</span></a>
  <span class="tb-date" id="tb-date"></span>
  <div class="tb-right">
    <button class="btn-run" id="run-btn" onclick="runAgent(false)">☀️ Briefing</button>
    <button class="btn-run" onclick="runAgent(true)" style="background:#3f3f46;font-size:12px;padding:5px 10px;" title="Rianalizza tutte le email da capo">⚡</button>
    <a href="/wellness.html" class="btn-settings" title="Wellness & Brain Training" style="font-size:16px">🧠</a>
    <a href="/settings.html" class="btn-settings">⚙️</a>
    <div class="avatar" id="avatar-btn" onclick="toggleUserMenu()">?
      <img id="avatar-img" src="" style="display:none"/>
    </div>
  </div>
  <div class="user-menu" id="user-menu">
    <div class="um-name" id="um-name">Caricamento...</div>
    <a href="/wellness.html" class="um-item">🧠 Wellness & Brain</a>
    <a href="/settings.html" class="um-item">⚙️ Impostazioni</a>
    <div class="um-item" onclick="logout()">↩ Esci</div>
  </div>
</header>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">Oggi</div>
    <div class="sidebar-item active" onclick="showSection('all')"><span class="icon">📋</span> Tutto il giorno</div>
    <div class="sidebar-item" onclick="showSection('events')"><span class="icon">📅</span> Riunioni <span class="badge blue" id="sb-events">0</span></div>
    <div class="sidebar-item" onclick="showSection('tasks')"><span class="icon">📧</span> Email <span class="badge" id="sb-tasks">0</span></div>
    <div class="sidebar-section">Extra</div>
    <div class="sidebar-item" onclick="showSection('growth')"><span class="icon">📚</span> Crescita</div>
    <div class="sidebar-item" onclick="showSection('family')"><span class="icon">👨‍👩‍👦</span> Famiglia</div>
    <div class="sidebar-item" onclick="showSection('network')"><span class="icon">🌐</span> Network</div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main-content">
    <div class="empty"><div class="big">☀️</div>Caricamento briefing...</div>
  </main>
</div>

<!-- User menu overlay -->
<div id="overlay" style="display:none;position:fixed;inset:0;z-index:150;" onclick="closeUserMenu()"></div>

<script>
const today = new Date().toISOString().slice(0,10);
let dayData = null;
let currentSection = 'all';
let userName = '';

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  // Set date
  const d = new Date();
  document.getElementById('tb-date').textContent = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });

  // Load user
  try {
    const r = await fetch('/api/me', { credentials: 'include' });
    if (r.status === 401) { location.href = '/login.html'; return; }
    const u = await r.json();
    userName = u.name || '';
    const initials = userName.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase() || '?';
    document.getElementById('avatar-btn').childNodes[0].nodeValue = initials;
    if (u.picture) {
      const img = document.getElementById('avatar-img');
      img.src = u.picture; img.style.display = 'block';
    }
    document.getElementById('um-name').innerHTML = `${u.name || ''}<div class="um-email">${u.email || ''}</div>`;
  } catch(e) { location.href = '/login.html'; return; }

  await loadDay();
})();

async function loadDay() {
  try {
    const r = await fetch(`/api/day/${today}`, { credentials: 'include' });
    dayData = await r.json();
    render();
  } catch(e) {
    renderEmpty();
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const d = dayData || {};
  const events   = d.events   || [];
  const tasks    = d.tasks    || [];
  const items    = d.items    || {};
  const insights = d.insights || {};
  const family   = d.family   || {};
  const network  = d.network  || {};
  const health   = d.health   || null;

  // Update sidebar badges
  document.getElementById('sb-events').textContent = events.length;
  document.getElementById('sb-tasks').textContent  = tasks.filter(t => !items[t.id]?.done).length;

  const main = document.getElementById('main-content');
  let html = '';

  if (currentSection === 'all' || currentSection === 'header') {
    // Day header
    const dayType = insights.dayType || '';
    const dayTypeHtml = dayType ? `<div class="day-type-badge ${dayType}">${{focus:'🧘 Focus Day', maker:'🛠️ Maker Day', manager:'👔 Manager Day'}[dayType] || dayType}</div>` : '';
    const done  = Object.values(items).filter(i => i.done).length;
    const total = events.length + tasks.length;
    html += `<div class="day-header">
      <div class="day-title">Buongiorno${userName ? ', ' + userName.split(' ')[0] : ''} 👋</div>
      ${dayTypeHtml}
      <div class="day-header-right">
        <span class="progress-ring">${done}/${total} completati</span>
      </div>
    </div>`;

    // Agent panel (hidden by default)
    html += `<div class="agent-panel" id="agent-panel">
      <div class="agent-panel-header">
        <span>☀️ Morning Agent</span>
        <button class="agent-close" onclick="closeAgentPanel()">×</button>
      </div>
      <div class="agent-log-box" id="agent-log"></div>
      <div class="agent-summary-bar" id="agent-summary"></div>
    </div>`;

    // Coaching strip
    if (insights.growthBrief) {
      html += `<div class="coaching-strip">✦ ${insights.growthBrief}</div>`;
    }

    // Health bar
    if (health) {
      const s = health.sleepScore; const hrv = health.hrv; const stress = health.stressLevel;
      const recs = health.recommendations;
      html += `<div class="health-bar">
        <div class="health-metric"><div class="hv" style="color:${s>=76?'#86efac':s>=60?'#fde68a':'#fca5a5'}">${s||'?'}/100</div><div class="hl">Sonno</div></div>
        <div class="health-metric"><div class="hv">${hrv||'?'} ms</div><div class="hl">HRV</div></div>
        <div class="health-metric"><div class="hv">${health.restingHR||'?'} bpm</div><div class="hl">FC riposo</div></div>
        <div class="health-metric"><div class="hv">${stress||'?'}</div><div class="hl">Stress</div></div>
        ${recs ? `<div class="health-recs">🏃 ${recs.activity}<br/>🧠 ${recs.mindset}</div>` : ''}
      </div>`;
    }
  }

  // Events
  if (currentSection === 'all' || currentSection === 'events') {
    if (events.length > 0) {
      html += `<div class="card">
        <div class="card-header"><h2>📅 Riunioni di oggi</h2><span class="count">${events.length}</span></div>
        <div class="card-body">`;
      for (const evt of events) {
        const st = items[evt.id] || {};
        const brief = st.brief || evt.brief || '';
        html += `<div class="event-item ${st.done ? 'done' : ''}" id="ei-${evt.id}">
          <div class="event-time">${evt.time || ''}</div>
          <div class="event-info">
            <div class="event-title">${esc(evt.title)}</div>
            ${evt.participants ? `<div class="event-participants">👥 ${esc(evt.participants)}</div>` : ''}
            ${brief ? `<div class="event-brief">${esc(brief).slice(0,200)}…</div>` : ''}
          </div>
          <div class="event-actions">
            ${evt.meetLink ? `<a href="${evt.meetLink}" target="_blank" class="btn-meet">Join ↗</a>` : ''}
            <button class="btn-done ${st.done ? 'checked' : ''}" onclick="toggleDone('${evt.id}','event')">${st.done ? '✓' : ''}</button>
          </div>
        </div>`;
      }
      html += `</div></div>`;
    }
  }

  // Tasks by quadrant
  if (currentSection === 'all' || currentSection === 'tasks') {
    const q1 = tasks.filter(t => (t.quadrant||'Q2').toUpperCase() === 'Q1');
    const q2 = tasks.filter(t => (t.quadrant||'Q2').toUpperCase() === 'Q2');
    const q3 = tasks.filter(t => (t.quadrant||'Q2').toUpperCase() === 'Q3');
    const q4 = tasks.filter(t => (t.quadrant||'Q2').toUpperCase() === 'Q4');

    const renderTaskSection = (list, qLabel, qColor, icon) => {
      if (!list.length) return '';
      return `<div class="card">
        <div class="card-header" style="border-left:3px solid ${qColor};">
          <h2>${icon} ${qLabel}</h2><span class="count">${list.filter(t => !items[t.id]?.done).length} attivi</span>
        </div>
        <div class="card-body">
          ${list.map(t => renderTask(t, items[t.id] || {})).join('')}
        </div>
      </div>`;
    };

    html += renderTaskSection(q1, 'Q1 — Urgente + Importante', '#ef4444', '🔴');
    html += renderTaskSection(q2, 'Q2 — Importante', '#60a5fa', '🔵');
    html += renderTaskSection(q3, 'Q3 — Urgente (delega)', '#f59e0b', '🟠');
    html += renderTaskSection(q4, 'Q4 — Bassa priorità', '#52525b', '⚫');

    if (!tasks.length) {
      html += `<div class="card"><div class="empty"><div class="big">📧</div>Nessuna email da gestire.<br/>Clicca <strong>☀️ Briefing</strong> per analizzare la tua inbox.</div></div>`;
    }
  }

  // Growth / study items
  if (currentSection === 'all' || currentSection === 'growth') {
    const study = insights.studyItems || [];
    html += `<div class="card">
      <div class="card-header"><h2>📚 Crescita · Da leggere</h2>${study.length ? `<span class="count">${study.length}</span>` : ''}</div>
      <div class="card-body">
        ${study.length ? study.map((s,i) => `<div class="study-item ${s.done ? 'done' : ''}">
          <div class="study-num">${i+1}</div>
          <div class="study-info">
            <div class="study-title">${esc(s.title||'')}</div>
            <div class="study-source">${esc(s.source||'')}</div>
            <div class="study-summary">${esc(s.summary||'')}</div>
            ${s.recommendation ? `<div class="study-rec">→ ${esc(s.recommendation)}</div>` : ''}
          </div>
          <div>
            <button class="btn-done ${s.done ? 'checked' : ''}" style="margin-top:2px;" onclick="toggleStudy(${i})">${s.done ? '✓' : ''}</button>
          </div>
        </div>`).join('') : `<div class="empty-section">Nessuna newsletter rilevante trovata.<br/><span style="font-size:12px;color:var(--subtle)">L'agente cerca in Gmail › Categorie › Aggiornamenti e Social.</span></div>`}
      </div>
    </div>`;
  }

  // Family
  if (currentSection === 'all' || currentSection === 'family') {
    const al = family.alessandraEvents || [];
    const tm = family.tommasoAlerts   || [];
    const spouseName = (dayData?.userSettings?.familyMembers||[]).find(f=>f.role==='spouse')?.name || 'Partner';
    const childName  = (dayData?.userSettings?.familyMembers||[]).find(f=>f.role==='child')?.name  || 'Figli';
    html += `<div class="card">
      <div class="card-header"><h2>👨‍👩‍👦 Famiglia</h2></div>
      <div class="family-grid">
        <div class="family-col">
          <div class="family-label">${esc(spouseName)}</div>
          <div class="family-item">${al.length ? al.map(e => `${e.time ? e.time + ' · ' : ''}${esc(e.title)}${e.isAway ? '<div class="alert">⚠️ Non sarà a casa</div>' : ''}`).join('<br/>') : '<span style="color:var(--subtle)">Nessun impegno rilevato oggi</span>'}</div>
        </div>
        <div class="family-col">
          <div class="family-label">${esc(childName)} · Scuola</div>
          <div class="family-item">${tm.length ? tm.map(t => `<a href="${t.link}" target="_blank" style="color:var(--blue);text-decoration:none;">${esc(t.title)}</a>${t.priority === 'high' ? ' 🔴' : ''}`).join('<br/>') : '<span style="color:var(--subtle)">Nessuna comunicazione recente</span>'}</div>
        </div>
      </div>
      ${!al.length && !tm.length ? `<div style="padding:8px 0 0;font-size:12px;color:var(--subtle)">Configura i membri della famiglia in <a href="/settings.html" style="color:var(--accent);text-decoration:none;">Impostazioni → Famiglia</a> per abilitare il monitoraggio.</div>` : ''}
    </div>`;
  }

  // Network
  if (currentSection === 'all' || currentSection === 'network') {
    const evts = network.events || [];
    const city = network.city || '';
    html += `<div class="card">
      <div class="card-header"><h2>🌐 Network${city ? ' · ' + esc(city) : ''}</h2>${evts.length ? `<span class="count">${evts.length} eventi</span>` : ''}</div>
      <div class="card-body">
        ${evts.length ? evts.map(e => `<div class="network-item">
          <div class="network-dot"></div>
          <div class="network-info">
            <div class="network-title">${esc(e.title||'')}</div>
            <div class="network-date">${esc(e.date||'')} ${e.description ? '· ' + esc(e.description) : ''}</div>
          </div>
          ${e.link ? `<a href="${e.link}" target="_blank" class="network-link">↗ Info</a>` : ''}
        </div>`).join('') : `<div class="empty-section">Nessun evento networking trovato.${!city ? '<br/><span style="font-size:12px;color:var(--subtle)">La città viene rilevata automaticamente dagli eventi Calendar con voli.</span>' : `<br/><span style="font-size:12px;color:var(--subtle)">Posizione: ${esc(city)}. Aggiungi la Perplexity API key in <a href="/settings.html" style="color:var(--accent);text-decoration:none;">Impostazioni</a> per abilitare la ricerca.</span>`}</div>`}
      </div>
    </div>`;
  }

  if (!html) html = renderEmpty(true);
  main.innerHTML = html;
}

function renderEmpty(ret = false) {
  const html = `<div class="card"><div class="empty">
    <div class="big">☀️</div>
    Nessun dato per oggi.<br/>
    Clicca <strong>☀️ Briefing</strong> in alto per analizzare Gmail e Calendar.
  </div></div>`;
  if (ret) return html;
  document.getElementById('main-content').innerHTML = html;
}

function renderTask(t, st) {
  const aps = st.actionPoints || [];
  return `<div class="task-item ${st.done ? 'done' : ''}" id="ti-${t.id}">
    <div class="q-dot ${(t.quadrant||'Q2').toUpperCase()}"></div>
    <div class="task-info">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-due">${esc(t.due||'')} ${t.link ? `<a href="${t.link}" target="_blank" style="color:var(--accent);text-decoration:none;margin-left:4px;">↗ Apri</a>` : ''}</div>
      <div class="task-brief" id="brief-${t.id}">${esc(t.brief||'').replace(/\n/g,'<br/>')}</div>
      ${aps.length ? `<div class="task-aps" id="aps-${t.id}">
        ${aps.map((ap,i) => `<div class="ap-item">
          <div class="ap-cb ${ap.done ? 'done' : ''}" onclick="toggleAp('${t.id}','${ap.id}',${i})"></div>
          <span class="ap-text ${ap.done ? 'done' : ''}">${esc(ap.text||'')}</span>
        </div>`).join('')}
      </div>` : ''}
    </div>
    <div class="task-actions">
      <button class="btn-expand" onclick="expandTask('${t.id}')" title="Espandi">⌄</button>
      <button class="btn-done ${st.done ? 'checked' : ''}" onclick="toggleDone('${t.id}','task')">${st.done ? '✓' : ''}</button>
    </div>
  </div>`;
}

// ── Interactions ──────────────────────────────────────────────────────────────
function showSection(s) {
  currentSection = s;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  render();
}

function expandTask(id) {
  const brief = document.getElementById(`brief-${id}`);
  const aps   = document.getElementById(`aps-${id}`);
  if (brief) brief.classList.toggle('open');
  if (aps)   aps.classList.toggle('open');
}

async function toggleDone(id, type) {
  if (!dayData) return;
  if (!dayData.items) dayData.items = {};
  if (!dayData.items[id]) dayData.items[id] = {};
  dayData.items[id].done = !dayData.items[id].done;
  render();
  await fetch(`/api/day/${today}/item/${id}`, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done: dayData.items[id].done })
  });
}

async function toggleAp(taskId, apId, idx) {
  if (!dayData?.items?.[taskId]?.actionPoints) return;
  const ap = dayData.items[taskId].actionPoints.find(a => a.id === apId) || dayData.items[taskId].actionPoints[idx];
  if (!ap) return;
  ap.done = !ap.done;
  render();
  await fetch(`/api/day/${today}/item/${taskId}/action-point/${apId}`, {
    method: 'PATCH', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done: ap.done })
  });
}

async function toggleStudy(idx) {
  if (!dayData?.insights?.studyItems?.[idx]) return;
  const s = dayData.insights.studyItems[idx];
  s.done = !s.done;
  render();
  await fetch(`/api/day/${today}/study-item/${idx}/done`, {
    method: 'PATCH', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ done: s.done })
  });
}

// ── Morning Agent runner ───────────────────────────────────────────────────────
async function runAgent(force = false) {
  const btn    = document.getElementById('run-btn');
  const panel  = document.getElementById('agent-panel');
  const logEl  = document.getElementById('agent-log');
  const sumEl  = document.getElementById('agent-summary');

  btn.disabled = true;
  btn.textContent = force ? '⚡ Force refresh...' : '⏳ In esecuzione...';
  panel.classList.add('visible');
  logEl.innerHTML = '';
  sumEl.classList.remove('visible');

  const url = force
    ? `/api/morning-agent/${today}/run?force=true`
    : `/api/morning-agent/${today}/run`;

  try {
    const r = await fetch(url, { method: 'POST', credentials: 'include' });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const ev = JSON.parse(line.slice(6));
          if (ev.log) {
            const d = document.createElement('div');
            d.textContent = ev.log;
            logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
          }
          if (ev.error) {
            const d = document.createElement('div');
            d.className = 'log-err'; d.textContent = '❌ ' + ev.error;
            logEl.appendChild(d);
          }
          if (ev.done && ev.summary) {
            const s = ev.summary;
            const d = document.createElement('div');
            d.className = 'log-done'; d.textContent = '✅ Completato';
            logEl.appendChild(d);
            sumEl.innerHTML = [
              { v: s.events||0,     l: 'eventi' },
              { v: s.tasks||0,      l: 'email' },
              { v: s.dayType||'—',  l: 'giornata' },
              { v: s.studyItems||0, l: 'newsletter' },
              { v: s.emailSent ? '✓':'✗', l: 'email inviata' }
            ].map(x => `<div class="sum-chip"><div class="v">${x.v}</div><div class="l">${x.l}</div></div>`).join('');
            sumEl.classList.add('visible');
            await loadDay();
          }
        } catch(e) { /* skip */ }
      }
    }
  } catch(e) {
    const d = document.createElement('div');
    d.className = 'log-err'; d.textContent = '❌ ' + e.message;
    logEl.appendChild(d);
  }

  btn.disabled = false;
  btn.textContent = '☀️ Briefing';
}

function closeAgentPanel() {
  document.getElementById('agent-panel')?.classList.remove('visible');
}

// ── User menu ──────────────────────────────────────────────────────────────────
function toggleUserMenu() {
  document.getElementById('user-menu').classList.toggle('open');
  document.getElementById('overlay').style.display = 'block';
}
function closeUserMenu() {
  document.getElementById('user-menu').classList.remove('open');
  document.getElementById('overlay').style.display = 'none';
}
async function logout() {
  if (!confirm('Sei sicuro di voler uscire da Glint?')) return;
  await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  location.href = '/login.html';
}

// ── Utils ──────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
