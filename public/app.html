<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #08080b;
      --surface: #0e0e12;
      --card:    #13131a;
      --card2:   #17171f;
      --border:  rgba(255,255,255,.07);
      --border2: rgba(255,255,255,.04);
      --text:    #f0f0f4;
      --muted:   #8e8ea0;
      --subtle:  #46465a;
      --accent:  #6366f1;
      --accent-dim: rgba(99,102,241,.15);
      --green:   #22c55e;
      --red:     #ef4444;
      --amber:   #f59e0b;
      --blue:    #60a5fa;
      --r: 14px;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px; line-height: 1.5;
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    /* ── TOPBAR ─────────────────────────────────────────────────────────── */
    .topbar {
      position: sticky; top: 0; z-index: 200;
      height: 52px; padding: 0 20px;
      background: rgba(8,8,11,.88); backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .tb-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; flex-shrink: 0; }
    .tb-gem {
      width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; box-shadow: 0 0 12px rgba(99,102,241,.35);
    }
    .tb-name { font-size: 15px; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
    .tb-divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    .tb-date { font-size: 12px; color: var(--muted); }
    .tb-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); border: none; border-radius: 8px;
      color: #fff; padding: 6px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: filter .15s; white-space: nowrap;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; filter: none; }
    .btn-ghost {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); padding: 5px 11px; font-size: 12px; font-weight: 500;
      cursor: pointer; text-decoration: none; transition: border-color .15s, color .15s;
      display: inline-flex; align-items: center;
    }
    .btn-ghost:hover { border-color: var(--subtle); color: var(--text); }
    .btn-force {
      background: rgba(255,255,255,.05); border: 1px solid var(--border);
      border-radius: 8px; color: var(--muted);
      padding: 5px 10px; font-size: 13px; cursor: pointer;
      transition: background .15s; display: inline-flex; align-items: center;
    }
    .btn-force:hover { background: rgba(255,255,255,.09); color: var(--text); }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg,#6366f1,#8b5cf6);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-menu {
      position: fixed; top: 54px; right: 16px;
      background: var(--card2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 6px;
      min-width: 200px; z-index: 300;
      box-shadow: 0 16px 40px rgba(0,0,0,.5);
      display: none;
    }
    .user-menu.open { display: block; }
    .um-head { padding: 8px 10px 10px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .um-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .um-email { font-size: 11px; color: var(--subtle); margin-top: 2px; }
    .um-item {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; font-size: 13px; color: var(--muted);
      cursor: pointer; border-radius: 8px; transition: background .1s; text-decoration: none;
    }
    .um-item:hover { background: rgba(255,255,255,.05); color: var(--text); }

    /* ── LAYOUT ─────────────────────────────────────────────────────────── */
    .layout { display: flex; min-height: calc(100vh - 52px); }

    /* ── SIDEBAR ─────────────────────────────────────────────────────────── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      padding: 16px 10px 24px;
      position: sticky; top: 52px; height: calc(100vh - 52px);
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 2px;
    }
    .sb-section {
      font-size: 10px; font-weight: 700; color: var(--subtle);
      text-transform: uppercase; letter-spacing: .1em;
      padding: 16px 10px 6px;
    }
    .sb-section:first-child { padding-top: 4px; }
    .sb-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 9px;
      cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 500;
      transition: background .12s, color .12s; text-decoration: none;
      position: relative;
    }
    .sb-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .sb-item.active {
      background: var(--accent-dim); color: #a5b4fc;
    }
    .sb-item.active::before {
      content: ''; position: absolute; left: 0; top: 25%; bottom: 25%;
      width: 3px; border-radius: 0 2px 2px 0; background: var(--accent);
    }
    .sb-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
    .sb-label { flex: 1; }
    .sb-badge {
      font-size: 10px; font-weight: 700; padding: 1px 7px;
      border-radius: 20px; min-width: 20px; text-align: center;
    }
    .sb-badge.red   { background: rgba(239,68,68,.2);  color: #f87171; }
    .sb-badge.blue  { background: rgba(99,102,241,.2); color: #a5b4fc; }
    .sb-badge.grey  { background: rgba(82,82,91,.25);  color: var(--muted); }
    .sb-badge.green { background: rgba(34,197,94,.15); color: #86efac; }

    /* ── MAIN AREA ─────────────────────────────────────────────────────── */
    .main { flex: 1; padding: 28px 32px; max-width: 980px; display: flex; flex-direction: column; gap: 20px; }

    /* ── GREETING ────────────────────────────────────────────────────────── */
    .greeting { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .greeting-name { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
    .greeting-wave { font-size: 24px; }
    .day-badge {
      padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .day-badge.focus   { background: rgba(34,197,94,.12);  color: #86efac; }
    .day-badge.maker   { background: rgba(245,158,11,.12); color: #fde68a; }
    .day-badge.manager { background: rgba(99,102,241,.12); color: #a5b4fc; }
    .progress-text { margin-left: auto; font-size: 12px; color: var(--subtle); }

    /* ── STATS ROW ───────────────────────────────────────────────────────── */
    .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r); padding: 16px 18px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .stat-card .s-label { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
    .stat-card .s-val   { font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
    .stat-card .s-sub   { font-size: 11px; color: var(--subtle); }
    .stat-card.urgent { border-color: rgba(239,68,68,.2); }
    .stat-card.urgent .s-val { color: #f87171; }

    /* ── COACHING STRIP ─────────────────────────────────────────────────── */
    .coaching {
      background: linear-gradient(135deg, rgba(99,102,241,.08) 0%, rgba(139,92,246,.05) 100%);
      border: 1px solid rgba(99,102,241,.15);
      border-radius: var(--r); padding: 16px 20px;
      font-size: 13px; color: #c4b5fd; line-height: 1.75;
      position: relative; overflow: hidden;
    }
    .coaching::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,.4), transparent);
    }

    /* ── HEALTH ROW ─────────────────────────────────────────────────────── */
    .health-row {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 16px 20px;
      display: flex; gap: 0; align-items: center; flex-wrap: wrap;
    }
    .h-metric { flex: 1; min-width: 80px; padding: 0 16px; border-right: 1px solid var(--border); }
    .h-metric:first-child { padding-left: 0; }
    .h-metric:last-of-type { border-right: none; }
    .h-val { font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
    .h-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .h-recs { flex: 2; min-width: 220px; padding-left: 20px; font-size: 12px; color: var(--muted); line-height: 1.8; border-left: 1px solid var(--border); margin-left: 8px; }

    /* ── AGENT LOG ─────────────────────────────────────────────────────── */
    .agent-panel {
      background: #070709; border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden; display: none;
    }
    .agent-panel.open { display: block; }
    .ap-header {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .ap-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: pulse 1.2s infinite; }
    .ap-dot.done { background: #6366f1; animation: none; }
    .ap-title { font-size: 12px; font-weight: 600; color: var(--muted); flex: 1; }
    .ap-close { background: none; border: none; color: var(--subtle); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px; }
    .ap-close:hover { color: var(--muted); }
    .ap-log {
      font-family: 'SF Mono','Fira Code',monospace; font-size: 11px;
      color: #86efac; padding: 12px 16px; max-height: 180px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 2px;
    }
    .ap-log .err { color: #fca5a5; }
    .ap-log .done-line { color: #a78bfa; font-weight: 600; }
    .ap-summary {
      display: none; gap: 20px; padding: 12px 16px;
      border-top: 1px solid var(--border); flex-wrap: wrap;
    }
    .ap-summary.visible { display: flex; }
    .sum-item .sv { font-size: 18px; font-weight: 800; color: #a5b4fc; }
    .sum-item .sl { font-size: 10px; color: var(--subtle); margin-top: 1px; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }

    /* ── SECTION HEADER ─────────────────────────────────────────────────── */
    .sec-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .sec-title { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
    .sec-count {
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 20px; background: rgba(255,255,255,.07); color: var(--muted);
    }
    .sec-count.red { background: rgba(239,68,68,.15); color: #f87171; }
    .sec-extra { margin-left: auto; font-size: 12px; color: var(--subtle); }

    /* ── CARD ────────────────────────────────────────────────────────────── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden;
    }

    /* ── EVENT ITEMS ─────────────────────────────────────────────────────── */
    .event-list { display: flex; flex-direction: column; }
    .event-item {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 14px 18px; border-bottom: 1px solid var(--border2);
      transition: background .1s; cursor: default;
    }
    .event-item:last-child { border-bottom: none; }
    .event-item:hover { background: rgba(255,255,255,.015); }
    .event-item.done { opacity: .45; }
    .evt-time {
      font-size: 12px; color: var(--muted); white-space: nowrap;
      min-width: 72px; padding-top: 2px; font-variant-numeric: tabular-nums;
    }
    .evt-body { flex: 1; }
    .evt-title { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .evt-meta  { font-size: 12px; color: var(--muted); }
    .evt-brief { font-size: 12px; color: var(--subtle); margin-top: 4px; line-height: 1.5; }
    .evt-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .btn-join {
      background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.2);
      color: #86efac; border-radius: 7px; padding: 4px 11px;
      font-size: 11px; font-weight: 600; text-decoration: none; white-space: nowrap;
      transition: background .12s;
    }
    .btn-join:hover { background: rgba(34,197,94,.18); }
    .btn-circle {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid var(--border); background: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; transition: border-color .12s, background .12s; flex-shrink: 0;
    }
    .btn-circle:hover { border-color: var(--green); }
    .btn-circle.done { background: var(--green); border-color: var(--green); color: #fff; }

    /* ── Q-TABS ─────────────────────────────────────────────────────────── */
    .q-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .q-tab {
      padding: 4px 11px; border-radius: 20px; font-size: 11px; font-weight: 600;
      border: 1px solid var(--border); background: transparent;
      color: var(--subtle); cursor: pointer; transition: all .12s;
    }
    .q-tab:hover { color: var(--muted); border-color: var(--subtle); }
    .q-tab.active { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.12); color: var(--text); }
    .q-tab.t1.active { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.3); color: #fca5a5; }
    .q-tab.t2.active { background: rgba(96,165,250,.1);  border-color: rgba(96,165,250,.3);  color: #93c5fd; }
    .q-tab.t3.active { background: rgba(245,158,11,.1);  border-color: rgba(245,158,11,.3);  color: #fde68a; }
    .q-tab.t4.active { background: rgba(82,82,91,.15);   border-color: rgba(82,82,91,.4);    color: var(--muted); }

    /* ── TASK ITEMS ─────────────────────────────────────────────────────── */
    .task-list { display: flex; flex-direction: column; }
    .task-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 18px; border-bottom: 1px solid var(--border2);
      transition: background .1s; cursor: default;
    }
    .task-item:last-child { border-bottom: none; }
    .task-item:hover { background: rgba(255,255,255,.015); }
    .task-item.done { opacity: .4; }
    .task-item.is-q1 {
      border-left: 3px solid rgba(239,68,68,.7);
      background: rgba(239,68,68,.025);
      padding-left: 15px;
    }
    .task-item.is-q1:hover { background: rgba(239,68,68,.045); }
    /* priority dot */
    .q-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
    .q-dot.Q1 { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,.6); }
    .q-dot.Q2 { background: #60a5fa; }
    .q-dot.Q3 { background: #f59e0b; }
    .q-dot.Q4 { background: var(--subtle); }
    /* task body */
    .task-body { flex: 1; min-width: 0; }
    .task-title {
      font-size: 14px; font-weight: 600; margin-bottom: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .task-item.is-q1 .task-title { color: #fef2f2; }
    .task-meta { font-size: 11px; color: var(--muted); }
    .task-meta a { color: var(--accent); text-decoration: none; }
    .task-meta a:hover { text-decoration: underline; }
    .task-brief {
      font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.55;
      display: none;
    }
    .task-brief.open { display: block; }
    .task-aps { margin-top: 8px; display: none; flex-direction: column; gap: 3px; }
    .task-aps.open { display: flex; }
    .ap-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--muted); padding: 3px 0; }
    .ap-cb {
      width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid var(--subtle);
      background: none; cursor: pointer; flex-shrink: 0; margin-top: 2px;
      transition: background .1s, border-color .1s;
    }
    .ap-cb.done { background: var(--green); border-color: var(--green); }
    .ap-text.done { text-decoration: line-through; opacity: .45; }
    /* task actions */
    .task-actions { display: flex; align-items: flex-start; gap: 6px; flex-shrink: 0; margin-top: 1px; }
    .btn-expand {
      background: none; border: none; color: var(--subtle); font-size: 16px;
      cursor: pointer; padding: 1px 2px; transition: color .12s, transform .2s;
      line-height: 1;
    }
    .btn-expand:hover { color: var(--muted); }
    .btn-expand.open { transform: rotate(180deg); color: var(--muted); }

    /* ── STUDY / GROWTH ─────────────────────────────────────────────────── */
    .study-list { display: flex; flex-direction: column; }
    .study-item {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 14px 18px; border-bottom: 1px solid var(--border2);
      transition: background .1s;
    }
    .study-item:last-child { border-bottom: none; }
    .study-item:hover { background: rgba(255,255,255,.012); }
    .study-item.done { opacity: .35; }
    .study-rank {
      width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
      background: rgba(167,139,250,.1); color: #a78bfa;
      font-size: 10px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .study-body { flex: 1; }
    .study-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .study-title a { color: inherit; text-decoration: none; }
    .study-title a:hover { color: #a5b4fc; }
    .study-source { font-size: 11px; color: var(--subtle); margin-bottom: 4px; }
    .study-summary { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 5px; }
    .study-rec { font-size: 11px; color: #6ee7b7; }
    .study-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
    .stag {
      font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px;
      text-transform: uppercase; letter-spacing: .3px;
    }
    .stag.high   { background: rgba(239,68,68,.12);  color: #f87171; }
    .stag.medium { background: rgba(234,179,8,.1);   color: #fbbf24; }
    .stag.low    { background: rgba(82,82,91,.15);   color: #9ca3af; }
    .stag.cat    { background: rgba(99,102,241,.1);  color: #a5b4fc; }
    .stag.gmail  { background: rgba(52,211,153,.08); color: #6ee7b7; }

    /* ── FAMILY ─────────────────────────────────────────────────────────── */
    .family-cols { display: grid; grid-template-columns: 1fr 1fr; }
    .family-col { padding: 16px 20px; }
    .family-col + .family-col { border-left: 1px solid var(--border2); }
    .family-col-label { font-size: 10px; font-weight: 700; color: var(--subtle); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .family-col-body { font-size: 13px; color: var(--muted); line-height: 1.75; }
    .family-alert { color: var(--amber); font-size: 12px; }

    /* ── NETWORK ─────────────────────────────────────────────────────────── */
    .net-list { display: flex; flex-direction: column; }
    .net-item {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 14px 18px; border-bottom: 1px solid var(--border2);
    }
    .net-item:last-child { border-bottom: none; }
    .net-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; box-shadow: 0 0 8px rgba(99,102,241,.4); }
    .net-body { flex: 1; }
    .net-title { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .net-meta { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .net-desc { font-size: 12px; color: var(--subtle); line-height: 1.5; }
    .net-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 5px; }
    .net-tag { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: var(--accent-dim); color: #a5b4fc; }
    .btn-reg {
      display: inline-flex; align-items: center; gap: 3px; white-space: nowrap;
      font-size: 11px; font-weight: 600; padding: 5px 12px; border-radius: 7px;
      background: var(--accent-dim); border: 1px solid rgba(99,102,241,.2);
      color: #a5b4fc; text-decoration: none; transition: background .12s;
    }
    .btn-reg:hover { background: rgba(99,102,241,.25); }

    /* ── EMPTY STATES ─────────────────────────────────────────────────────── */
    .empty-full {
      padding: 48px 24px; text-align: center;
      color: var(--muted); font-size: 13px; line-height: 1.8;
    }
    .empty-full .e-icon { font-size: 36px; margin-bottom: 12px; }
    .empty-full strong { color: var(--text); }
    .empty-inline { padding: 20px 20px; font-size: 13px; color: var(--subtle); line-height: 1.7; }
    .empty-inline span { color: var(--muted); }

    /* ── RESPONSIVE ─────────────────────────────────────────────────────── */
    @media (max-width: 780px) {
      .sidebar { display: none; }
      .main { padding: 20px 16px; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .family-cols { grid-template-columns: 1fr; }
      .family-col + .family-col { border-left: none; border-top: 1px solid var(--border2); }
    }
  </style>
</head>
<body>

<header class="topbar">
  <a class="tb-logo" href="/app.html">
    <div class="tb-gem">✦</div>
    <span class="tb-name">Glint</span>
  </a>
  <div class="tb-divider"></div>
  <span class="tb-date" id="tb-date"></span>
  <div class="tb-right">
    <button class="btn-primary" id="run-btn" onclick="runAgent(false)">☀️ Briefing</button>
    <button class="btn-force" onclick="runAgent(true)" title="Force refresh — rianalizza tutto">⚡</button>
    <a href="/wellness.html" class="btn-ghost" title="Wellness">🧠</a>
    <a href="/settings.html" class="btn-ghost">⚙️</a>
    <div class="avatar" id="avatar-btn" onclick="toggleMenu()">
      ?<img id="avatar-img" src="" style="display:none"/>
    </div>
  </div>
  <div class="user-menu" id="user-menu">
    <div class="um-head">
      <div class="um-name" id="um-name">—</div>
      <div class="um-email" id="um-email">—</div>
    </div>
    <a href="/wellness.html" class="um-item">🧠 Wellness &amp; Brain</a>
    <a href="/settings.html" class="um-item">⚙️ Impostazioni</a>
    <div class="um-item" onclick="logout()">↩ Esci</div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sb-section">Oggi</div>
    <div class="sb-item active" onclick="nav('all',this)">
      <span class="sb-icon">🏠</span><span class="sb-label">Panoramica</span>
    </div>
    <div class="sb-item" onclick="nav('events',this)">
      <span class="sb-icon">📅</span><span class="sb-label">Riunioni</span>
      <span class="sb-badge blue" id="sb-events">0</span>
    </div>
    <div class="sb-item" onclick="nav('tasks',this)">
      <span class="sb-icon">📧</span><span class="sb-label">Email</span>
      <span class="sb-badge red" id="sb-tasks">0</span>
    </div>
    <div class="sb-section">Altro</div>
    <div class="sb-item" onclick="nav('growth',this)">
      <span class="sb-icon">📚</span><span class="sb-label">Crescita</span>
      <span class="sb-badge grey" id="sb-growth" style="display:none">0</span>
    </div>
    <div class="sb-item" onclick="nav('family',this)">
      <span class="sb-icon">👨‍👩‍👦</span><span class="sb-label">Famiglia</span>
    </div>
    <div class="sb-item" onclick="nav('network',this)">
      <span class="sb-icon">🌐</span><span class="sb-label">Network</span>
      <span class="sb-badge blue" id="sb-network" style="display:none">0</span>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="overlay" style="display:none;position:fixed;inset:0;z-index:250;" onclick="closeMenu()"></div>

<script>
'use strict';
const TODAY = new Date().toISOString().slice(0,10);
let dayData = null;
let section = 'all';
let qFilter = 'all';
let userName = '';
// agent panel state
let _panelOpen = false, _logLines = [], _sumHtml = '';

// ── Bootstrap ──────────────────────────────────────────────────────────────
(async () => {
  document.getElementById('tb-date').textContent =
    new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  try {
    const r = await fetch('/api/me',{credentials:'include'});
    if (r.status===401){location.href='/login.html';return;}
    const u = await r.json();
    userName = u.name||'';
    const init = userName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
    document.getElementById('avatar-btn').childNodes[0].nodeValue = init;
    if (u.picture){const img=document.getElementById('avatar-img');img.src=u.picture;img.style.display='block';}
    document.getElementById('um-name').textContent = u.name||'';
    document.getElementById('um-email').textContent = u.email||'';
  } catch { location.href='/login.html'; return; }
  await loadDay();
})();

async function loadDay() {
  try {
    const r = await fetch(`/api/day/${TODAY}`,{credentials:'include'});
    dayData = await r.json();
    const tasks = dayData?.tasks||[], items = dayData?.items||{};
    if (qFilter==='all' && tasks.some(t=>(t.quadrant||'Q2').toUpperCase()==='Q1' && !items[t.id]?.done))
      qFilter='Q1';
    render();
  } catch { renderEmpty(); }
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const d       = dayData||{};
  const events  = d.events||[];
  const tasks   = d.tasks||[];
  const items   = d.items||{};
  const ins     = d.insights||{};
  const family  = d.family||{};
  const net     = d.network||{};
  const study   = ins.studyItems||[];
  const netEvts = net.events||[];
  const health  = d.health||null;

  const q = q => tasks.filter(t=>(t.quadrant||'Q2').toUpperCase()===q);
  const q1=q('Q1'), q2=q('Q2'), q3=q('Q3'), q4=q('Q4');
  const q1Active = q1.filter(t=>!items[t.id]?.done).length;
  const totalPending = tasks.filter(t=>!items[t.id]?.done).length;
  const done = Object.values(items).filter(i=>i.done).length;
  const total = events.length + tasks.length;

  // sidebar badges
  _sb('sb-events', events.length, 'blue');
  _sb('sb-tasks',  q1Active||totalPending, q1Active?'red':'blue');
  const sg=document.getElementById('sb-growth');
  if(study.length){sg.textContent=study.length;sg.style.display='';}else sg.style.display='none';
  const sn=document.getElementById('sb-network');
  if(netEvts.length){sn.textContent=netEvts.length;sn.style.display='';}else sn.style.display='none';

  let html = '';

  // ── Panoramica header ──
  if (section==='all') {
    const dayType = ins.dayType||'';
    const badge = dayType
      ? `<span class="day-badge ${dayType}">${{focus:'🧘 Focus',maker:'🛠️ Maker',manager:'👔 Manager'}[dayType]||dayType} Day</span>`
      : '';
    html += `
    <div class="greeting">
      <span class="greeting-name">Buongiorno${userName?', '+esc(userName.split(' ')[0]):''}${!userName?' 👋':''}</span>
      <span class="greeting-wave">${userName?' 👋':''}</span>
      ${badge}
      <span class="progress-text">${done}/${total} completati</span>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="s-label">Riunioni</div>
        <div class="s-val">${events.length}</div>
        <div class="s-sub">oggi in calendario</div>
      </div>
      <div class="stat-card ${q1Active>0?'urgent':''}">
        <div class="s-label">Urgenti Q1</div>
        <div class="s-val">${q1Active}</div>
        <div class="s-sub">${q1Active>0?'richiedono attenzione':'tutto sotto controllo'}</div>
      </div>
      <div class="stat-card">
        <div class="s-label">Email</div>
        <div class="s-val">${tasks.length}</div>
        <div class="s-sub">${totalPending} da completare</div>
      </div>
      <div class="stat-card">
        <div class="s-label">Da leggere</div>
        <div class="s-val">${study.length}</div>
        <div class="s-sub">newsletter &amp; aggiornamenti</div>
      </div>
    </div>`;
    // agent panel
    html += agentPanelHtml();
    // coaching
    if (ins.growthBrief)
      html += `<div class="coaching">✦ ${esc(ins.growthBrief).replace(/\n/g,'<br/>')}</div>`;
    // health
    if (health) html += healthHtml(health);
  } else {
    html += agentPanelHtml();
  }

  // ── EVENTS ──
  if (section==='all'||section==='events') {
    if (events.length) {
      html += secHeader('📅 Riunioni di oggi', events.length, null);
      html += `<div class="card"><div class="event-list">`;
      for (const e of events) {
        const st=items[e.id]||{}, brief=(st.brief||e.brief||'').slice(0,200);
        html += `<div class="event-item ${st.done?'done':''}" id="ei-${esc(e.id)}">
          <div class="evt-time">${esc(e.time||'')}</div>
          <div class="evt-body">
            <div class="evt-title">${esc(e.title)}</div>
            ${e.participants?`<div class="evt-meta">👥 ${esc(e.participants)}</div>`:''}
            ${brief?`<div class="evt-brief">${esc(brief)}${(st.brief||e.brief||'').length>200?'…':''}</div>`:''}
          </div>
          <div class="evt-actions">
            ${e.meetLink?`<a href="${esc(e.meetLink)}" target="_blank" class="btn-join">Join ↗</a>`:''}
            <button class="btn-circle ${st.done?'done':''}" onclick="toggleDone('${esc(e.id)}','event')">${st.done?'✓':''}</button>
          </div>
        </div>`;
      }
      html += `</div></div>`;
    } else if (section==='events') {
      html += `<div class="card"><div class="empty-full"><div class="e-icon">📅</div>Nessuna riunione per oggi.</div></div>`;
    }
  }

  // ── TASKS ──
  if (section==='all'||section==='tasks') {
    const cntFor = q => tasks.filter(t=>(t.quadrant||'Q2').toUpperCase()===q).length;
    const tabsHtml = `<div class="q-tabs">
      <button class="q-tab ${qFilter==='all'?'active':''}" onclick="setQ('all')">Tutti&nbsp;(${tasks.length})</button>
      <button class="q-tab t1 ${qFilter==='Q1'?'active':''}" onclick="setQ('Q1')">🔴&nbsp;Q1&nbsp;(${cntFor('Q1')})</button>
      <button class="q-tab t2 ${qFilter==='Q2'?'active':''}" onclick="setQ('Q2')">🔵&nbsp;Q2&nbsp;(${cntFor('Q2')})</button>
      <button class="q-tab t3 ${qFilter==='Q3'?'active':''}" onclick="setQ('Q3')">🟠&nbsp;Q3&nbsp;(${cntFor('Q3')})</button>
      <button class="q-tab t4 ${qFilter==='Q4'?'active':''}" onclick="setQ('Q4')">⚫&nbsp;Q4&nbsp;(${cntFor('Q4')})</button>
    </div>`;
    const filtered = qFilter==='all'?[...q1,...q2,...q3,...q4]:tasks.filter(t=>(t.quadrant||'Q2').toUpperCase()===qFilter);
    html += `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      ${secHeader('📧 Email', tasks.filter(t=>!items[t.id]?.done).length+' attivi', null, true)}
      ${tabsHtml}
    </div>`;
    html += `<div class="card"><div class="task-list">`;
    if (filtered.length) {
      html += filtered.map(t=>taskHtml(t,items[t.id]||{})).join('');
    } else if (!tasks.length) {
      html += `<div class="empty-full"><div class="e-icon">📧</div>Nessuna email da gestire.<br/>Clicca <strong>☀️ Briefing</strong> per analizzare la tua inbox.</div>`;
    } else {
      html += `<div class="empty-inline"><span>Nessun task in questa categoria.</span></div>`;
    }
    html += `</div></div>`;
  }

  // ── GROWTH ──
  if (section==='all'||section==='growth') {
    const high=study.filter(s=>s.priority==='high'), med=study.filter(s=>s.priority==='medium'), low=study.filter(s=>s.priority==='low'||!s.priority);
    const catSum = ['Aggiornamenti','Social','Promozioni','Forum'].filter(c=>study.some(s=>s.gmailCategory===c)).map(c=>`${c}: ${study.filter(s=>s.gmailCategory===c).length}`).join(' · ');
    const ordered = [...high,...med,...low];
    html += secHeader('📚 Crescita', study.length, catSum||null);
    html += `<div class="card"><div class="study-list">`;
    if (ordered.length) {
      html += ordered.map((s,i)=>`
        <div class="study-item ${s.done?'done':''}" id="si-${study.indexOf(s)}">
          <div class="study-rank">${study.indexOf(s)+1}</div>
          <div class="study-body">
            <div class="study-title">${s.link?`<a href="${esc(s.link)}" target="_blank">${esc(s.title||'')}</a>`:esc(s.title||'')}</div>
            <div class="study-source">${esc(s.source||'')}${s.gmailCategory?` · ${esc(s.gmailCategory)}`:''}</div>
            <div class="study-summary">${esc(s.summary||'')}</div>
            ${s.recommendation?`<div class="study-rec">→ ${esc(s.recommendation)}</div>`:''}
            <div class="study-tags">
              <span class="stag ${s.priority||'medium'}">${s.priority||'medium'}</span>
              ${s.category?`<span class="stag cat">${esc(s.category)}</span>`:''}
            </div>
          </div>
          <button class="btn-circle ${s.done?'done':''}" style="margin-top:2px;" onclick="toggleStudy(${study.indexOf(s)})">${s.done?'✓':''}</button>
        </div>`).join('');
    } else {
      html += `<div class="empty-full"><div class="e-icon">📚</div>Nessun contenuto trovato.<br/>Clicca <strong>⚡ Force Refresh</strong> per analizzare Aggiornamenti, Social e Promozioni.</div>`;
    }
    html += `</div></div>`;
  }

  // ── FAMILY ──
  if (section==='all'||section==='family') {
    const al=family.alessandraEvents||[], tm=family.tommasoAlerts||[];
    const sp=(dayData?.userSettings?.familyMembers||[]).find(f=>f.role==='spouse')?.name||'Partner';
    const ch=(dayData?.userSettings?.familyMembers||[]).find(f=>f.role==='child')?.name||'Figli';
    html += secHeader('👨‍👩‍👦 Famiglia', null, null);
    html += `<div class="card"><div class="family-cols">
      <div class="family-col">
        <div class="family-col-label">${esc(sp)}</div>
        <div class="family-col-body">${al.length?al.map(e=>`${e.time?esc(e.time)+' · ':''}${esc(e.title)}${e.isAway?'<div class="family-alert">⚠️ Non sarà a casa</div>':''}`).join('<br/>'):`<span style="color:var(--subtle)">Nessun impegno rilevato</span>`}</div>
      </div>
      <div class="family-col">
        <div class="family-col-label">${esc(ch)} · Scuola</div>
        <div class="family-col-body">${tm.length?tm.map(t=>`<a href="${esc(t.link)}" target="_blank" style="color:var(--blue);text-decoration:none;">${esc(t.title)}</a>${t.priority==='high'?' 🔴':''}`).join('<br/>'):`<span style="color:var(--subtle)">Nessuna comunicazione recente</span>`}</div>
      </div>
    </div>${!al.length&&!tm.length?`<div style="padding:8px 20px 14px;font-size:12px;color:var(--subtle)">Configura i membri in <a href="/settings.html" style="color:var(--accent);">Impostazioni → Famiglia</a></div>`:''}</div>`;
  }

  // ── NETWORK ──
  if (section==='all'||section==='network') {
    const city=net.city||'';
    html += secHeader(`🌐 Network${city?' · '+esc(city):''}`, netEvts.length||null, null);
    html += `<div class="card"><div class="net-list">`;
    if (netEvts.length) {
      html += netEvts.map(e=>`
        <div class="net-item">
          <div class="net-dot"></div>
          <div class="net-body">
            <div class="net-title">${esc(e.title||'')}</div>
            <div class="net-meta">${esc(e.date||'')}${e.time?' · '+esc(e.time):''}${e.location?' · 📍'+esc(e.location):''}</div>
            ${e.description?`<div class="net-desc">${esc(e.description)}</div>`:''}
            ${e.tags?.length?`<div class="net-tags">${e.tags.slice(0,4).map(t=>`<span class="net-tag">${esc(t)}</span>`).join('')}</div>`:''}
          </div>
          ${e.link?`<a href="${esc(e.link)}" target="_blank" class="btn-reg">↗ Info</a>`:''}
        </div>`).join('');
    } else {
      html += `<div class="empty-full"><div class="e-icon">🌐</div>Nessun evento trovato${city?' a '+esc(city):''}.<br/>Clicca <strong>☀️ Briefing</strong> per cercare eventi networking.</div>`;
    }
    html += `</div></div>`;
  }

  if (!html) {
    html = `<div class="card"><div class="empty-full"><div class="e-icon">☀️</div>Nessun dato per oggi.<br/>Clicca <strong>☀️ Briefing</strong> per iniziare.</div></div>`;
  }

  document.getElementById('main').innerHTML = html;

  // restore agent panel
  if (_panelOpen) {
    const p=document.getElementById('ap');
    if(p){
      p.classList.add('open');
      const log=document.getElementById('ap-log');
      if(log){
        _logLines.forEach(l=>{const d=document.createElement('div');if(l.c)d.className=l.c;d.textContent=l.t;log.appendChild(d);});
        log.scrollTop=log.scrollHeight;
      }
      const sum=document.getElementById('ap-sum');
      if(sum&&_sumHtml){sum.innerHTML=_sumHtml;sum.classList.add('visible');}
    }
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function secHeader(title, count, sub, inlineReturn=false) {
  const h = `<div class="sec-header">
    <span class="sec-title">${title}</span>
    ${count!==null&&count!==undefined&&count!==0?`<span class="sec-count">${count}</span>`:''}
    ${sub?`<span class="sec-extra" style="font-size:11px;color:var(--subtle);">${esc(sub)}</span>`:''}
  </div>`;
  return inlineReturn ? h.trim() : h;
}

function agentPanelHtml() {
  return `<div class="agent-panel" id="ap">
    <div class="ap-header">
      <div class="ap-dot" id="ap-dot"></div>
      <span class="ap-title">Morning Agent</span>
      <button class="ap-close" onclick="closePanel()">×</button>
    </div>
    <div class="ap-log" id="ap-log"></div>
    <div class="ap-summary" id="ap-sum"></div>
  </div>`;
}

function healthHtml(h) {
  const s=h.sleepScore, hrv=h.hrv, stress=h.stressLevel, rhr=h.restingHR;
  const sc = s>=76?'#86efac':s>=60?'#fde68a':'#fca5a5';
  const recs=h.recommendations;
  return `<div class="health-row">
    <div class="h-metric"><div class="h-val" style="color:${sc}">${s||'?'}<small style="font-size:14px;font-weight:400;color:var(--muted)">/100</small></div><div class="h-lbl">Sonno</div></div>
    <div class="h-metric"><div class="h-val">${hrv||'?'}<small style="font-size:12px;color:var(--muted)"> ms</small></div><div class="h-lbl">HRV</div></div>
    <div class="h-metric"><div class="h-val">${rhr||'?'}<small style="font-size:12px;color:var(--muted)"> bpm</small></div><div class="h-lbl">FC riposo</div></div>
    <div class="h-metric" style="border-right:none"><div class="h-val">${stress||'?'}</div><div class="h-lbl">Stress</div></div>
    ${recs?`<div class="h-recs">🏃 ${esc(recs.activity)}<br/>🧠 ${esc(recs.mindset)}</div>`:''}
  </div>`;
}

function taskHtml(t, st) {
  const aps=st.actionPoints||[], q=(t.quadrant||'Q2').toUpperCase();
  return `<div class="task-item ${st.done?'done':''} ${q==='Q1'?'is-q1':''}" id="ti-${esc(t.id)}">
    <div class="q-dot ${q}"></div>
    <div class="task-body">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta">${esc(t.due||'')}${t.link?` &nbsp;<a href="${esc(t.link)}" target="_blank">↗ Apri email</a>`:''}</div>
      <div class="task-brief" id="br-${esc(t.id)}">${esc(t.brief||'').replace(/\n/g,'<br/>')}</div>
      ${aps.length?`<div class="task-aps" id="ap-${esc(t.id)}">${aps.map((a,i)=>`
        <div class="ap-row">
          <div class="ap-cb ${a.done?'done':''}" onclick="toggleAp('${esc(t.id)}','${esc(a.id)}',${i})"></div>
          <span class="ap-text ${a.done?'done':''}">${esc(a.text||'')}</span>
        </div>`).join('')}</div>`:''}
    </div>
    <div class="task-actions">
      <button class="btn-expand" id="ex-${esc(t.id)}" onclick="expandTask('${esc(t.id)}')">⌄</button>
      <button class="btn-circle ${st.done?'done':''}" onclick="toggleDone('${esc(t.id)}','task')">${st.done?'✓':''}</button>
    </div>
  </div>`;
}

// ── Navigation ─────────────────────────────────────────────────────────────
function nav(s, el) {
  section = s;
  document.querySelectorAll('.sb-item').forEach(i=>i.classList.remove('active'));
  if(el) el.classList.add('active');
  render();
}
function setQ(q) { qFilter=q; render(); }

// ── Toggles ────────────────────────────────────────────────────────────────
function expandTask(id) {
  document.getElementById(`br-${id}`)?.classList.toggle('open');
  document.getElementById(`ap-${id}`)?.classList.toggle('open');
  document.getElementById(`ex-${id}`)?.classList.toggle('open');
}
async function toggleDone(id, type) {
  if(!dayData) return;
  if(!dayData.items) dayData.items={};
  if(!dayData.items[id]) dayData.items[id]={};
  dayData.items[id].done = !dayData.items[id].done;
  render();
  await fetch(`/api/day/${TODAY}/item/${id}`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:dayData.items[id].done})});
}
async function toggleAp(tid, aid, idx) {
  const aps=dayData?.items?.[tid]?.actionPoints; if(!aps) return;
  const ap=aps.find(a=>a.id===aid)||aps[idx]; if(!ap) return;
  ap.done=!ap.done; render();
  await fetch(`/api/day/${TODAY}/item/${tid}/action-point/${aid}`,{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:ap.done})});
}
async function toggleStudy(idx) {
  const s=dayData?.insights?.studyItems?.[idx]; if(!s) return;
  s.done=!s.done; render();
  await fetch(`/api/day/${TODAY}/study-item/${idx}/done`,{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:s.done})});
}

// ── Agent runner ───────────────────────────────────────────────────────────
async function runAgent(force=false) {
  const btn=document.getElementById('run-btn');
  _panelOpen=true; _logLines=[]; _sumHtml='';
  btn.disabled=true; btn.textContent=force?'⚡ In corso…':'⏳ In esecuzione…';
  if(section!=='all'){ section='all'; document.querySelectorAll('.sb-item').forEach((el,i)=>el.classList.toggle('active',i===0)); }
  render();
  const dot=document.getElementById('ap-dot'); if(dot) dot.className='ap-dot';
  const url=force?`/api/morning-agent/${TODAY}/run?force=true`:`/api/morning-agent/${TODAY}/run`;
  try {
    const r=await fetch(url,{method:'POST',credentials:'include'});
    const reader=r.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true) {
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines) {
        if(!line.startsWith('data: ')) continue;
        try {
          const ev=JSON.parse(line.slice(6));
          if(ev.log) { _push(ev.log,null); }
          if(ev.error) { _push('❌ '+ev.error,'err'); }
          if(ev.done&&ev.summary) {
            _push('✅ Completato','done-line');
            const s=ev.summary;
            _sumHtml=[
              {v:s.events||0,l:'eventi'},{v:s.tasks||0,l:'email'},
              {v:s.dayType||'—',l:'giornata'},{v:s.studyItems||0,l:'newsletter'},
              {v:s.emailSent?'✓':'✗',l:'email inviata'}
            ].map(x=>`<div class="sum-item"><div class="sv">${x.v}</div><div class="sl">${x.l}</div></div>`).join('');
            const dot=document.getElementById('ap-dot'); if(dot){dot.className='ap-dot done';}
            await loadDay();
          }
        } catch{}
      }
    }
  } catch(e) { _push('❌ '+e.message,'err'); }
  btn.disabled=false; btn.textContent='☀️ Briefing';
}
function _push(text, cls) {
  _logLines.push({t:text,c:cls});
  const log=document.getElementById('ap-log');
  if(log){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;}
}
function closePanel() {
  _panelOpen=false; _logLines=[]; _sumHtml='';
  document.getElementById('ap')?.classList.remove('open');
}
function renderEmpty() {
  document.getElementById('main').innerHTML=`<div class="card"><div class="empty-full"><div class="e-icon">☀️</div>Nessun dato per oggi.<br/>Clicca <strong>☀️ Briefing</strong> per analizzare Gmail e Calendar.</div></div>`;
}

// ── User menu ──────────────────────────────────────────────────────────────
function toggleMenu(){document.getElementById('user-menu').classList.toggle('open');document.getElementById('overlay').style.display='block';}
function closeMenu(){document.getElementById('user-menu').classList.remove('open');document.getElementById('overlay').style.display='none';}
async function logout(){if(!confirm('Uscire da Glint?'))return;await fetch('/api/logout',{method:'POST',credentials:'include'});location.href='/login.html';}

// ── Utils ──────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function _sb(id,val,cls){const el=document.getElementById(id);if(!el)return;el.textContent=val;el.className='sb-badge '+cls;}
</script>
