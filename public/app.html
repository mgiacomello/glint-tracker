<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Glint</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#7c6ef5"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Glint"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #0a0a0a;
      --s1:    #111111;
      --s2:    #181818;
      --s3:    #1f1f1f;
      --line:  rgba(255,255,255,.06);
      --line2: rgba(255,255,255,.03);
      --t0:    #f5f5f7;
      --t1:    #a0a0a8;
      --t2:    #555560;
      --accent:#7c6ef5;
      --adim:  rgba(124,110,245,.14);
      --red:   #ff4444;
      --green: #00d084;
      --amber: #ffb800;
      --blue:  #3b82f6;
      --r:     14px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--t0); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── TOP NAV ── */
    .topbar {
      position: sticky; top: 0; z-index: 200; height: 54px;
      padding: 0 28px; display: flex; align-items: center; gap: 6px;
      background: rgba(10,10,10,.9); backdrop-filter: blur(24px) saturate(160%);
      border-bottom: 1px solid var(--line);
    }
    .tb-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; margin-right: 28px; flex-shrink: 0; }
    .tb-gem {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg,#7c6ef5,#a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; box-shadow: 0 0 14px rgba(124,110,245,.3);
    }
    .tb-name { font-size: 16px; font-weight: 800; letter-spacing: -.03em; color: var(--t0); }
    .tab-nav { display: flex; gap: 2px; }
    .tb-context { font-size: 11px; color: var(--t2); margin-left: 12px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex: 1; }
    .tnav {
      padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
      color: var(--t2); cursor: pointer; border: none; background: none;
      transition: color .12s, background .12s;
    }
    .tnav:hover { color: var(--t1); background: rgba(255,255,255,.04); }
    .tnav.on { color: var(--t0); background: rgba(255,255,255,.08); }
    .tb-right { margin-left: auto; display: flex; align-items: center; gap: 7px; }
    .btn-run {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--accent); border: none; border-radius: 8px;
      color: #fff; padding: 6px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: filter .15s; white-space: nowrap;
    }
    .btn-run:hover { filter: brightness(1.1); }
    .btn-run:disabled { opacity: .4; cursor: not-allowed; filter: none; }
    .btn-icon {
      background: rgba(255,255,255,.05); border: 1px solid var(--line);
      border-radius: 8px; color: var(--t1); padding: 5px 10px; font-size: 13px;
      cursor: pointer; transition: background .12s; display: inline-flex; align-items: center;
    }
    .btn-icon:hover { background: rgba(255,255,255,.09); color: var(--t0); }
    .btn-link { background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--t1); padding: 5px 11px; font-size: 12px; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; transition: border-color .12s, color .12s; }
    .btn-link:hover { border-color: var(--t2); color: var(--t0); }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#7c6ef5,#a78bfa); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-menu { position: fixed; top: 58px; right: 16px; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; min-width: 210px; z-index: 300; box-shadow: 0 16px 40px rgba(0,0,0,.6); display: none; }
    .user-menu.open { display: block; }
    .um-head { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
    .um-name { font-size: 13px; font-weight: 600; }
    .um-email { font-size: 11px; color: var(--t2); margin-top: 2px; }
    .um-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; color: var(--t1); cursor: pointer; border-radius: 8px; transition: background .1s; text-decoration: none; }
    .um-item:hover { background: rgba(255,255,255,.05); color: var(--t0); }

    /* ── PAGE ── */
    .page { max-width: 1120px; margin: 0 auto; padding: 28px 28px 80px; display: flex; flex-direction: column; gap: 18px; }

    /* ── HERO ── */
    .hero { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 32px; }
    .hero-l { min-width: 0; }
    .hero-date { font-size: 10px; color: var(--t2); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
    .hero-name { font-size: 30px; font-weight: 900; letter-spacing: -.04em; line-height: 1.05; margin-bottom: 8px; }
    .hero-name em { font-style: normal; color: var(--accent); }
    .hero-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .hbadge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid; }
    .hbadge.focus   { border-color: rgba(0,208,132,.22);  color: var(--green); background: rgba(0,208,132,.07); }
    .hbadge.maker   { border-color: rgba(255,184,0,.22);  color: var(--amber); background: rgba(255,184,0,.07); }
    .hbadge.manager { border-color: rgba(124,110,245,.22); color: #a78bfa;     background: rgba(124,110,245,.07); }
    .hbadge.warn    { border-color: rgba(255,68,68,.22);  color: var(--red);   background: rgba(255,68,68,.07); }
    .prog-bar-wrap { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; max-width: 280px; }
    .prog-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
    .prog-text { font-size: 11px; color: var(--t2); margin-top: 5px; font-family: 'JetBrains Mono', monospace; }
    .prog-ring-wrap { position: relative; flex-shrink: 0; grid-row: span 2; }
    .prog-ring-svg { transform: rotate(-90deg); display: block; }
    .prog-ring-bg { fill: none; stroke: var(--line); stroke-width: 3.5; }
    .prog-ring-fill { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; transition: stroke-dashoffset .6s ease; filter: drop-shadow(0 0 5px rgba(124,110,245,.5)); }
    .prog-ring-inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .prog-ring-pct { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: var(--t0); line-height: 1; }
    .prog-ring-lbl { font-size: 9px; color: var(--t2); margin-top: 2px; }
    .hero-kpis { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: center; flex-shrink: 0; }
    .kpi { background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 11px 14px; text-align: center; min-width: 72px; }
    .kpi-n { font-size: 26px; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--t1); font-family: 'JetBrains Mono', monospace; }
    .kpi-n.red { color: var(--red); }
    .kpi-l { font-size: 10px; color: var(--t2); margin-top: 3px; font-weight: 500; }

    /* ── INTELLIGENCE FEED ── */
    .intel-feed { border-left: 3px solid var(--accent); padding: 12px 18px; margin-bottom: 0; }
    .intel-feed-label { font-size: 9px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
    .intel-feed-text { font-size: 14px; font-style: italic; color: var(--t0); line-height: 1.55; }

    /* ── PRIORITY BADGE ── */
    .prio-badge { font-size: 9px; font-weight: 800; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; }
    .prio-badge.CRITICO { background: rgba(255,68,68,.15); color: #ff7070; border: 1px solid rgba(255,68,68,.3); }
    .prio-badge.HIGH    { background: rgba(255,184,0,.12); color: var(--amber); border: 1px solid rgba(255,184,0,.25); }
    .prio-badge.MEDIUM  { background: rgba(59,130,246,.1); color: #60a5fa; border: 1px solid rgba(59,130,246,.2); }
    .prio-badge.LOW     { background: rgba(82,82,91,.1); color: var(--t2); border: 1px solid var(--line); }
    .tk-project { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: var(--t2); background: var(--s3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; margin-top: 5px; font-family: 'JetBrains Mono', monospace; }

    /* ── COACHING BRIEF ── */
    .brief-card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
    .brief-head { display: flex; align-items: center; gap: 8px; padding: 11px 18px 10px; border-bottom: 1px solid var(--line2); }
    .brief-head-label { font-size: 11px; font-weight: 700; color: var(--t2); text-transform: uppercase; letter-spacing: .07em; }
    .brief-body { padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start; }
    .brief-icon { font-size: 16px; flex-shrink: 0; margin-top: 2px; }
    .brief-text { font-size: 13px; color: var(--t1); line-height: 1.85; }
    .brief-text strong { color: var(--t0); }

    /* ── AGENT PANEL ── */
    .agent-panel { background: #080808; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: none; }
    .agent-panel.open { display: block; }
    .ap-header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .ap-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.2s infinite; flex-shrink: 0; }
    .ap-dot.done { background: var(--accent); animation: none; }
    .ap-title { font-size: 12px; font-weight: 600; color: var(--t1); flex: 1; }
    .ap-close { background: none; border: none; color: var(--t2); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px; }
    .ap-close:hover { color: var(--t1); }
    .ap-log { font-family: 'SF Mono','Fira Code',monospace; font-size: 11px; color: #86efac; padding: 12px 16px; max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .ap-log .err { color: #fca5a5; }
    .ap-log .done-line { color: #a78bfa; font-weight: 600; }
    .ap-summary { display: none; gap: 20px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .ap-summary.visible { display: flex; }
    .sum-item .sv { font-size: 18px; font-weight: 800; color: #a5b4fc; font-family: 'JetBrains Mono', monospace; }
    .sum-item .sl { font-size: 10px; color: var(--t2); margin-top: 1px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── BENTO GRID ── */
    .bento { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: start; }
    .bc { background: rgba(255,255,255,.025); backdrop-filter: blur(20px) saturate(140%); border: 1px solid rgba(255,255,255,.08); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; transition: transform .25s ease-out, box-shadow .25s ease-out; }
    .bc:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,110,245,.15), 0 0 0 1px rgba(124,110,245,.12); }
    .bc.s2 { grid-column: span 2; }
    .bc.s3 { grid-column: span 3; }
    .bc-head { display: flex; align-items: center; gap: 8px; padding: 13px 18px 11px; border-bottom: 1px solid var(--line2); flex-shrink: 0; }
    .bc-title { font-size: 11px; font-weight: 700; color: var(--t2); text-transform: uppercase; letter-spacing: .07em; flex: 1; }
    .bc-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,.05); color: var(--t2); }
    .bc-badge.red  { background: rgba(255,68,68,.1);   color: #ff7070; }
    .bc-badge.blue { background: rgba(59,130,246,.1);  color: #60a5fa; }
    .bc-badge.pur  { background: rgba(124,110,245,.1); color: #a78bfa; }
    .bc-more { font-size: 11px; color: var(--t2); text-decoration: none; padding: 2px 6px; border-radius: 6px; transition: color .12s; white-space: nowrap; }
    .bc-more:hover { color: var(--t1); }

    /* ── EVENT ROWS ── */
    .ev-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line2); transition: background .1s; }
    .ev-row:last-child { border-bottom: none; }
    .ev-row:hover { background: rgba(255,255,255,.018); }
    .ev-row.done { opacity: .4; }
    .ev-time { font-size: 11px; color: var(--t2); min-width: 76px; flex-shrink: 0; padding-top: 2px; font-family: 'JetBrains Mono', monospace; }
    .ev-body { flex: 1; min-width: 0; }
    .ev-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ev-meta  { font-size: 11px; color: var(--t2); }
    .ev-brief { font-size: 12px; color: var(--t2); margin-top: 4px; line-height: 1.5; }
    .ev-act { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .btn-join { background: rgba(0,208,132,.08); border: 1px solid rgba(0,208,132,.2); color: var(--green); border-radius: 7px; padding: 4px 10px; font-size: 11px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: background .12s; }
    .btn-join:hover { background: rgba(0,208,132,.15); }
    .btn-circle { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; transition: border-color .12s, background .12s; flex-shrink: 0; color: transparent; }
    .btn-circle:hover { border-color: var(--green); }
    .btn-circle.done { background: var(--green); border-color: var(--green); color: #fff; }

    /* ── HEALTH ── */
    .h-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .hm { padding: 14px 16px; border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); }
    .hm:nth-child(2n) { border-right: none; }
    .hm:nth-child(3),.hm:nth-child(4) { border-bottom: none; }
    .hm-val { font-size: 24px; font-weight: 800; letter-spacing: -.03em; font-family: 'JetBrains Mono', monospace; }
    .hm-lbl { font-size: 11px; color: var(--t2); margin-top: 2px; }
    .h-rec { padding: 11px 16px; font-size: 12px; color: var(--t2); border-top: 1px solid var(--line2); line-height: 1.8; }

    /* ── Q-FILTER ── */
    .q-strip { display: flex; gap: 4px; padding: 9px 18px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
    .qb { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid var(--line); background: transparent; color: var(--t2); cursor: pointer; transition: all .12s; }
    .qb:hover { color: var(--t1); }
    .qb.on      { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.12); color: var(--t0); }
    .qb.on.q1   { background: rgba(255,68,68,.1);    border-color: rgba(255,68,68,.25);   color: #ff7070; }
    .qb.on.q2   { background: rgba(59,130,246,.1);   border-color: rgba(59,130,246,.25);  color: #60a5fa; }
    .qb.on.q3   { background: rgba(255,184,0,.1);    border-color: rgba(255,184,0,.25);   color: #ffb800; }
    .qb.on.q4   { background: rgba(82,82,91,.15);    border-color: rgba(82,82,91,.4);     color: var(--t1); }

    /* ── TASK ROWS ── */
    .tk-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 18px; border-bottom: 1px solid var(--line2); transition: background .1s; }
    .tk-row:last-child { border-bottom: none; }
    .tk-row:hover { background: rgba(255,255,255,.018); }
    .tk-row.done { opacity: .38; }
    .tk-row.is-q1 { border-left: 2px solid rgba(255,68,68,.5); padding-left: 16px; }
    .tk-row.is-q2 { border-left: 2px solid rgba(59,130,246,.4); padding-left: 16px; }
    .tk-row.is-q3 { border-left: 2px solid rgba(255,184,0,.35); padding-left: 16px; }
    .tk-row.is-q4 { border-left: 2px solid rgba(82,82,91,.4); padding-left: 16px; }
    .q-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .q-dot.Q1 { background: var(--red); box-shadow: 0 0 5px rgba(255,68,68,.5); }
    .q-dot.Q2 { background: var(--blue); }
    .q-dot.Q3 { background: var(--amber); }
    .q-dot.Q4 { background: var(--t2); }
    .tk-body { flex: 1; min-width: 0; }
    .tk-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .tk-row.is-q1 .tk-title { color: #fff5f5; }
    .tk-meta { font-size: 11px; color: var(--t2); }
    .tk-meta a { color: var(--accent); text-decoration: none; }
    .tk-meta a:hover { text-decoration: underline; }
    .tk-brief { font-size: 12px; color: var(--t1); margin-top: 5px; line-height: 1.55; }
    .tk-aps { margin-top: 7px; display: none; flex-direction: column; gap: 3px; }
    .tk-aps.open { display: flex; }
    .ap-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--t1); padding: 2px 0; }
    .ap-cb { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid var(--t2); background: none; cursor: pointer; flex-shrink: 0; margin-top: 2px; transition: background .1s, border-color .1s; }
    .ap-cb.done { background: var(--green); border-color: var(--green); }
    .ap-text.done { text-decoration: line-through; opacity: .4; }
    .tk-acts { display: flex; align-items: flex-start; gap: 5px; flex-shrink: 0; margin-top: 1px; }
    .btn-exp { background: none; border: none; color: var(--t2); font-size: 16px; cursor: pointer; line-height: 1; padding: 1px 2px; transition: color .12s, transform .2s; }
    .btn-exp:hover { color: var(--t1); }
    .btn-exp.open { transform: rotate(180deg); }

    /* ── STUDY ROWS ── */
    .st-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 18px; border-bottom: 1px solid var(--line2); transition: background .1s; }
    .st-row:last-child { border-bottom: none; }
    .st-row:hover { background: rgba(255,255,255,.015); }
    .st-row.done { opacity: .35; }
    .st-num { width: 22px; height: 22px; border-radius: 6px; background: var(--adim); color: #a78bfa; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'JetBrains Mono', monospace; }
    .st-body { flex: 1; min-width: 0; }
    .st-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-title a { color: inherit; text-decoration: none; }
    .st-title a:hover { color: #a5b4fc; }
    .st-src { font-size: 11px; color: var(--t2); margin-bottom: 3px; }
    .st-sum { font-size: 12px; color: var(--t1); line-height: 1.5; margin-bottom: 4px; }
    .st-rec { font-size: 11px; color: var(--green); }
    .st-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
    .stag { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: .2px; }
    .stag.high   { background: rgba(255,68,68,.1);    color: #ff7070; }
    .stag.medium { background: rgba(255,184,0,.1);    color: #ffb800; }
    .stag.low    { background: rgba(82,82,91,.12);    color: #9ca3af; }
    .stag.cat    { background: rgba(124,110,245,.1);  color: #a78bfa; }
    .stag.gmail  { background: rgba(0,208,132,.07);   color: var(--green); }

    /* ── NETWORK ROWS ── */
    .net-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 18px; border-bottom: 1px solid var(--line2); }
    .net-row:last-child { border-bottom: none; }
    .net-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 7px rgba(124,110,245,.4); flex-shrink: 0; margin-top: 4px; }
    .net-body { flex: 1; min-width: 0; }
    .net-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .net-meta  { font-size: 11px; color: var(--t2); margin-bottom: 3px; }
    .net-desc  { font-size: 12px; color: var(--t2); line-height: 1.5; }
    .net-tags  { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
    .net-tag   { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: var(--adim); color: #a78bfa; }
    .btn-info  { display: inline-flex; align-items: center; white-space: nowrap; font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 7px; background: var(--adim); border: 1px solid rgba(124,110,245,.2); color: #a78bfa; text-decoration: none; transition: background .12s; flex-shrink: 0; }
    .btn-info:hover { background: rgba(124,110,245,.22); }

    /* ── FAMILY ── */
    .fam-cols { display: grid; grid-template-columns: 1fr 1fr; }
    .fam-col { padding: 14px 18px; }
    .fam-col + .fam-col { border-left: 1px solid var(--line2); }
    .fam-label { font-size: 10px; font-weight: 700; color: var(--t2); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
    .fam-body  { font-size: 13px; color: var(--t1); line-height: 1.75; }
    .fam-alert { color: var(--amber); font-size: 12px; margin-top: 4px; }

    /* ── EMPTY ── */
    .empty { padding: 44px 24px; text-align: center; color: var(--t1); font-size: 13px; line-height: 1.8; }
    .empty .ei { font-size: 34px; margin-bottom: 10px; }
    .empty strong { color: var(--t0); }
    .empty-sm { padding: 18px; font-size: 13px; color: var(--t2); }

    /* ── FULL-WIDTH SECTION (non-bento tabs) ── */
    .fw-section { display: flex; flex-direction: column; gap: 14px; }
    .fw-head { display: flex; align-items: center; gap: 10px; }
    .fw-title { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
    .fw-count { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; background: rgba(255,255,255,.07); color: var(--t1); }
    .fw-sub { margin-left: auto; font-size: 12px; color: var(--t2); }
    .card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

    /* ── ACTIVITIES ── */
    .act-sections { display: flex; flex-direction: column; gap: 20px; }
    .act-group-title { font-size: 13px; font-weight: 700; color: var(--t1); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .act-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .act-tab-bar { display: flex; gap: 8px; padding: 14px 18px 0; }
    .act-tab { padding: 7px 16px; border-radius: 20px; border: 1px solid var(--line); background: transparent; color: var(--t1); cursor: pointer; font-size: 13px; font-weight: 500; transition: all .15s; white-space: nowrap; }
    .act-tab:hover { border-color: var(--t1); color: var(--t0); }
    .act-tab.on { font-weight: 600; }
    .act-grid-full { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px 18px 18px; }
    .act-card {
      background: var(--s1); border: 1px solid var(--line); border-radius: var(--r);
      padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
      transition: border-color .15s;
    }
    .act-card:hover { border-color: rgba(255,255,255,.1); }
    .act-card-top { display: flex; align-items: flex-start; gap: 10px; }
    .act-price { font-size: 11px; font-weight: 700; color: var(--t2); flex-shrink: 0; margin-top: 2px; }
    .act-title { font-size: 14px; font-weight: 700; flex: 1; line-height: 1.3; }
    .act-location { font-size: 11px; color: var(--t2); }
    .act-desc { font-size: 12px; color: var(--t1); line-height: 1.6; }
    .act-why { font-size: 11px; color: var(--green); font-style: italic; }
    .act-footer { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .act-cat { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,.05); color: var(--t2); text-transform: uppercase; letter-spacing: .2px; }
    .act-link { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--accent); text-decoration: none; }
    .act-link:hover { text-decoration: underline; }
    /* type accent colors */
    .act-card.solo     { border-top: 2px solid rgba(59,130,246,.4); }
    .act-card.couple   { border-top: 2px solid rgba(255,100,130,.4); }
    .act-card.family   { border-top: 2px solid rgba(0,208,132,.4); }
    .act-card.restaurant { border-top: 2px solid rgba(255,184,0,.4); }

    /* ── RESPONSIVE ── */
    /* ── PROACTIVE AI ── */
    .pa-grid { display: flex; flex-direction: column; gap: 0; }
    .pa-card { padding: 14px 18px; border-bottom: 1px solid var(--line2); transition: background .1s; }
    .pa-card:last-child { border-bottom: none; }
    .pa-card:hover { background: rgba(255,255,255,.018); }
    .pa-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
    .pa-icon { font-size: 20px; flex-shrink: 0; line-height: 1.2; }
    .pa-title-wrap { flex: 1; min-width: 0; }
    .pa-title { font-size: 13px; font-weight: 600; color: var(--t0); display: block; margin-bottom: 2px; }
    .pa-time { font-size: 11px; color: var(--amber); font-family: 'JetBrains Mono', monospace; }
    .pa-health { font-size: 11px; color: var(--green); flex-shrink: 0; white-space: nowrap; }
    .pa-desc { font-size: 12px; color: var(--t1); line-height: 1.6; margin-bottom: 8px; }
    .pa-ref { display: inline-block; font-size: 10px; font-weight: 600; color: #a78bfa; background: rgba(124,110,245,.1); border: 1px solid rgba(124,110,245,.2); border-radius: 4px; padding: 1px 7px; margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; }
    .pa-actions { display: flex; gap: 6px; }
    .pa-btn { padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--t1); transition: all .12s; }
    .pa-btn:hover { background: rgba(255,255,255,.06); color: var(--t0); }
    .pa-btn.primary { background: rgba(124,110,245,.15); border-color: rgba(124,110,245,.3); color: #a78bfa; }
    .pa-btn.primary:hover { background: rgba(124,110,245,.25); }

    /* ── SPOTIFY ── */
    .sp-row { display: flex; align-items: center; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line2); transition: background .1s; }
    .sp-row:last-child { border-bottom: none; }
    .sp-row:hover { background: rgba(255,255,255,.018); }
    .sp-emoji { font-size: 20px; flex-shrink: 0; }
    .sp-body { flex: 1; min-width: 0; }
    .sp-name { font-size: 13px; font-weight: 600; color: var(--t0); }
    .sp-mood { font-size: 11px; color: var(--t2); margin-top: 1px; }
    .sp-play { flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; background: #1db954; color: #000; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: filter .12s; }
    .sp-play:hover { filter: brightness(1.15); }

    /* ── MOMENTO FAMIGLIA ── */
    .momento-card { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-bottom: 1px solid var(--line2); background: rgba(124,110,245,.04); }
    .momento-icon { font-size: 24px; flex-shrink: 0; margin-top: 1px; }
    .momento-body { flex: 1; min-width: 0; }
    .momento-title { font-size: 13px; font-weight: 600; color: var(--t0); margin-bottom: 3px; }
    .momento-desc { font-size: 12px; color: var(--t1); line-height: 1.55; margin-bottom: 4px; }
    .momento-meta { font-size: 11px; color: #a78bfa; }

    /* ── STUDY SCHEDULE ── */
    .st-schedule { font-size: 11px; color: var(--amber); font-family: 'JetBrains Mono', monospace; margin-bottom: 5px; }
    .st-actions { display: flex; gap: 6px; margin-top: 6px; }
    .st-btn-play { padding: 4px 11px; border-radius: 7px; font-size: 11px; font-weight: 600; background: rgba(0,208,132,.1); border: 1px solid rgba(0,208,132,.2); color: var(--green); text-decoration: none; display: inline-flex; align-items: center; transition: background .12s; }
    .st-btn-play:hover { background: rgba(0,208,132,.2); }
    .st-btn-later { padding: 4px 11px; border-radius: 7px; font-size: 11px; font-weight: 600; background: transparent; border: 1px solid var(--line); color: var(--t2); cursor: pointer; transition: all .12s; }
    .st-btn-later:hover { background: rgba(255,255,255,.05); color: var(--t1); }

    /* ── ENERGY SCHEDULE ── */
    .es-card { grid-column: span 3; }
    .es-slots { display: flex; flex-direction: column; gap: 8px; }
    .es-slot { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--s3); border: 1px solid var(--line); }
    .es-bar { width: 4px; border-radius: 4px; flex-shrink: 0; min-height: 42px; align-self: stretch; }
    .es-meta { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .es-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .es-time { font-size: 11px; font-weight: 700; color: var(--t2); font-family: 'JetBrains Mono', monospace; min-width: 40px; }
    .es-dur { font-size: 10px; color: var(--t2); background: var(--s2); border-radius: 4px; padding: 1px 6px; }
    .es-label { font-size: 12px; font-weight: 700; color: var(--t0); flex: 1; }
    .es-tasks { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
    .es-task { font-size: 11px; color: var(--t1); background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .es-reason { font-size: 11px; color: var(--t2); line-height: 1.4; margin-top: 3px; }
    .es-insight { font-size: 10px; font-weight: 600; color: #a78bfa; margin-top: 3px; }

    @media (max-width: 860px) {
      .es-card { grid-column: span 2; }
      .bento { grid-template-columns: 1fr 1fr; }
      .bc.s2, .bc.s3 { grid-column: span 2; }
      .hero-kpis { grid-template-columns: auto 1fr 1fr; }
      .tb-context { display: none; }
    }
    @media (max-width: 600px) {
      .es-card { grid-column: span 1; }
      .bento { grid-template-columns: 1fr; }
      .bc.s2, .bc.s3 { grid-column: span 1; }
      .page { padding: 14px 14px 80px; gap: 14px; }
      .tab-nav { display: none; }
      .act-grid-full { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px 14px 16px; }
      .act-tab-bar { padding: 12px 14px 0; gap: 6px; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .act-tab-bar::-webkit-scrollbar { display: none; }
      .act-tab { flex-shrink: 0; padding: 6px 12px; font-size: 12px; }
      .hero { grid-template-columns: 1fr; gap: 12px; }
      .hero-name { font-size: 26px; }
      .hero-kpis { grid-template-columns: auto 1fr 1fr; }
      .topbar { padding: 0 16px; }
      .tb-name { display: none; }
      .btn-run { padding: 6px 11px; font-size: 12px; }
      .btn-link { display: none; }
      .st-title { white-space: normal; overflow: visible; text-overflow: clip; }
      .fam-cols { grid-template-columns: 1fr !important; }
      .fam-col + .fam-col { border-left: none; border-top: 1px solid var(--line2); }
    }
    @media (max-width: 420px) {
      .act-grid-full { grid-template-columns: 1fr; }
    }

    /* ── BOTTOM NAV (mobile only) ── */
    .bottom-nav {
      display: none;
    }
    @media (max-width: 600px) {
      .bottom-nav {
        display: flex;
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 300;
        height: calc(58px + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        background: rgba(10,10,10,.96);
        backdrop-filter: blur(20px) saturate(160%);
        border-top: 1px solid var(--line);
        justify-content: space-around;
        align-items: stretch;
      }
      .bn-item {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; cursor: pointer; border: none; background: none;
        color: var(--t2); font-size: 10px; font-weight: 500; padding: 8px 2px 4px;
        transition: color .12s; -webkit-tap-highlight-color: transparent;
        min-width: 34px;
      }
      .bn-item.on { color: var(--accent); }
      .bn-item .bn-icon { font-size: 20px; line-height: 1; }
      .bn-item .bn-label { font-size: 8px; font-weight: 600; letter-spacing: .01em; }
      .bn-badge {
        position: absolute; top: 2px; right: 50%; transform: translateX(12px);
        min-width: 15px; height: 15px; padding: 0 3px;
        background: var(--red); border-radius: 8px;
        font-size: 9px; font-weight: 800; color: #fff; display: flex; align-items: center; justify-content: center;
      }
      .bn-item { position: relative; }
    }

    /* ── INSTALL BANNER ── */
    .install-banner {
      display: none; align-items: center; gap: 12px;
      background: linear-gradient(135deg, rgba(124,110,245,.15), rgba(167,139,250,.08));
      border: 1px solid rgba(124,110,245,.3); border-radius: var(--r);
      padding: 14px 18px; margin-bottom: 0;
    }
    .install-banner.show { display: flex; }
    .ib-icon { font-size: 26px; flex-shrink: 0; }
    .ib-text { flex: 1; }
    .ib-title { font-size: 14px; font-weight: 700; color: var(--t0); margin-bottom: 2px; }
    .ib-sub   { font-size: 12px; color: var(--t1); }
    .ib-btn   { padding: 8px 16px; border-radius: 8px; background: var(--accent); border: none; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .ib-close { background: none; border: none; color: var(--t2); cursor: pointer; font-size: 20px; padding: 0 4px; }

    /* ── SAFE AREA (notch/home indicator) ── */
    body { padding-top: env(safe-area-inset-top); }
    .topbar { padding-top: max(0px, env(safe-area-inset-top)); height: calc(54px + env(safe-area-inset-top)); }

    /* ── TOUCH IMPROVEMENTS ── */
    * { -webkit-tap-highlight-color: transparent; }
    button, a { touch-action: manipulation; }
    .ev-row, .tk-row, .st-row, .net-row { min-height: 44px; }

    /* ── AI STATUS DOT ── */
    .ai-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: none; flex-shrink: 0; }
    .ai-dot.active { display: block; animation: pulse 1.2s infinite; }
    .ai-dot.done-state { display: block; animation: none; background: var(--accent); }

    /* ── ARCHIVIO / COMPLETATI ── */
    .done-collapse { border-top: 1px solid var(--line2); }
    .done-toggle { display:flex; align-items:center; gap:8px; padding:10px 16px; background:transparent; border:none; color:var(--t2); font-size:12px; cursor:pointer; width:100%; text-align:left; }
    .done-toggle:hover { color:var(--t1); }
    .done-toggle .dt-count { background:var(--line); border-radius:10px; padding:1px 7px; font-size:11px; }
    .done-section { overflow:hidden; max-height:0; transition:max-height .3s ease; }
    .done-section.open { max-height:2000px; }
    .done-section .tk-row, .done-section .ev-row { opacity:.5; }
    .item-removing { animation: fadeSlide .4s ease forwards; }
    @keyframes fadeSlide { to { opacity:0; max-height:0; padding:0; margin:0; overflow:hidden; } }

    /* ── MONTH ── */
    .month-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .kpi-list-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line2); }
    .kpi-list-row:last-child { border-bottom: none; }
    .kpi-list-name { flex: 1; font-size: 13px; font-weight: 600; }
    .kpi-list-val { font-size: 12px; color: var(--t2); min-width: 70px; text-align: right; font-family: 'JetBrains Mono', monospace; }
    .kpi-pb-wrap { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 3px; }
    .kpi-pb-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
    .kpi-stepbtn { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); background: none; color: var(--t1); cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .1s; }
    .kpi-stepbtn:hover { background: rgba(255,255,255,.07); color: var(--t0); }
    .obj-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line2); }
    .obj-row:last-child { border-bottom: none; }
    .obj-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; cursor: pointer; transition: transform .1s; }
    .obj-dot:hover { transform: scale(1.3); }
    .obj-dot.todo { background: var(--t2); }
    .obj-dot.in-progress { background: var(--amber); box-shadow: 0 0 6px rgba(255,184,0,.4); }
    .obj-dot.done { background: var(--green); box-shadow: 0 0 6px rgba(0,208,132,.4); }
    .obj-name { flex: 1; font-size: 13px; }
    .obj-status { font-size: 11px; color: var(--t2); }
    .inline-form { display: flex; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line2); }
    .inline-form input, .inline-form select { flex: 1; background: var(--s2); border: 1px solid var(--line); border-radius: 8px; color: var(--t0); padding: 6px 10px; font-size: 12px; outline: none; }
    .inline-form input:focus, .inline-form select:focus { border-color: var(--accent); }
    .inline-form input::placeholder { color: var(--t2); }
    .btn-add { padding: 6px 12px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
    .btn-del { background: none; border: none; color: var(--t2); cursor: pointer; font-size: 14px; padding: 2px 4px; transition: color .1s; flex-shrink: 0; }
    .btn-del:hover { color: var(--red); }
    .month-stat { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 22px; display: flex; align-items: center; gap: 16px; }
    .month-stat-n { font-size: 36px; font-weight: 800; font-family: 'JetBrains Mono', monospace; letter-spacing: -.04em; color: var(--accent); }
    .month-stat-l { font-size: 12px; color: var(--t2); margin-top: 2px; }

    /* ── PROJECTS ── */
    .proj-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .proj-card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
    .proj-card-head { padding: 14px 18px 10px; border-left: 4px solid var(--accent); }
    .proj-card-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .proj-title { font-size: 15px; font-weight: 700; flex: 1; }
    .proj-client { font-size: 11px; color: var(--t2); margin-bottom: 6px; }
    .proj-desc { font-size: 12px; color: var(--t1); line-height: 1.5; }
    .status-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
    .status-badge.active  { background: rgba(0,208,132,.1); color: var(--green); }
    .status-badge.paused  { background: rgba(255,184,0,.1); color: var(--amber); }
    .status-badge.done    { background: rgba(255,255,255,.06); color: var(--t2); }
    .proj-tasks { border-top: 1px solid var(--line2); }
    .proj-task-row { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line2); }
    .proj-task-row:last-child { border-bottom: none; }
    .proj-task-text { flex: 1; font-size: 12px; }
    .proj-task-text.done { text-decoration: line-through; opacity: .4; }
    .proj-task-cb { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--t2); background: none; cursor: pointer; flex-shrink: 0; transition: background .1s, border-color .1s; }
    .proj-task-cb.done { background: var(--green); border-color: var(--green); }
    .proj-add-task { display: flex; gap: 6px; padding: 8px 14px; border-top: 1px solid var(--line2); }
    .proj-add-task input { flex: 1; background: var(--s2); border: 1px solid var(--line); border-radius: 8px; color: var(--t0); padding: 5px 8px; font-size: 12px; outline: none; }
    .proj-add-task input:focus { border-color: var(--accent); }
    .proj-add-task input::placeholder { color: var(--t2); }
    .proj-add-task button { padding: 5px 10px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-size: 12px; cursor: pointer; flex-shrink: 0; }
    .color-pick { display: flex; gap: 6px; }
    .color-swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color .1s; flex-shrink: 0; }
    .color-swatch.sel { border-color: #fff; }

    /* ── REFLECTION MODAL ── */
    .reflect-btn {
      position: fixed; bottom: 80px; right: 18px; z-index: 280;
      width: 48px; height: 48px; border-radius: 50%;
      background: linear-gradient(135deg,#7c6ef5,#a78bfa);
      border: none; cursor: pointer; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 18px rgba(124,110,245,.45);
      animation: reflectPulse 3s ease-in-out infinite;
    }
    @keyframes reflectPulse { 0%,100%{box-shadow:0 4px 18px rgba(124,110,245,.45)} 50%{box-shadow:0 4px 28px rgba(124,110,245,.75)} }

  await loadDay();

async function loadDay() {
  try {
    const r = await fetch(`/api/day/${TODAY}`,{credentials:'include'});
    if (r.status === 401) { window.location.href = '/login.html'; return; }
    if (!r.ok) { renderEmpty(); return; }
    dayData = await r.json();
    if (dayData?.error === 'Not authenticated') { window.location.href = '/login.html'; return; }
    // Auto-carry-forward: se oggi è vuoto ma c'è roba da ieri
    if (!dayData.tasks?.length && !dayData.events?.length) {
      try {
        const cf = await fetch(`/api/auto-carry-forward/${TODAY}`,{method:'POST',credentials:'include'});
        if (cf.ok) {
          const fresh = await fetch(`/api/day/${TODAY}`,{credentials:'include'});
          dayData = await fresh.json();
        }
      } catch {}
    }
    const tasks = dayData?.tasks||[], items = dayData?.items||{};
    if (qFilter==='Q1' && !tasks.some(t=>(t.quadrant||'Q2').toUpperCase()==='Q1'))
      qFilter = 'all';
    render();
    // Auto-trigger briefing completo se oggi non è stato ancora sincronizzato
    const syncedToday = dayData._syncedAt?.slice(0,10) === TODAY;
    if (!syncedToday && !_agentRunning) {
      runAgent(false);
    }
    // Load boards and check inbox in background
    loadBoards();
    checkInboxPending();
  } catch { renderEmpty(); }
}

    </div>
    <div class="pa-desc">${esc(pa.description)}</div>
    ${pa.taskRef?`<span class="pa-ref">${esc(pa.taskRef)}</span>`:''}
    <div class="pa-actions">

      <button class="pa-btn" onclick="dismissPA(${i})">Ignora</button>

function dismissPA(i) {
  const ins = dayData?.insights;
  if (!ins?.proactiveActions?.[i]) return;
  ins.proactiveActions[i]._dismissed = true;
  render();
}

function acceptPA(i) {
  showToast('Azione registrata ✓');
  dismissPA(i);
}

async function refreshProactiveAI() {
  if (!confirm('Rigenero i suggerimenti Proactive AI?')) return;
  const btn = document.querySelector('[onclick="refreshProactiveAI()"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  try {
    const r = await fetch(`/api/day/${TODAY}/proactive`, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' } });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (d.proactiveActions && dayData?.insights) {
      dayData.insights.proactiveActions = d.proactiveActions;
      render();
      showToast(`${d.proactiveActions.length} suggerimenti aggiornati ✓`);
    }
  } catch(e) {
    showToast('Errore refresh PA: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '⟳ Check'; }
  }
}

async function runAgent(force=false) {
  if (_agentRunning && !force) return;
  _agentRunning = true;
  const btn=document.getElementById('run-btn');
  const aidot=document.getElementById('ai-dot');
  _panelOpen=true; _logLines=[]; _sumHtml='';
  btn.disabled=true; btn.textContent=force?'⚡ In corso…':'⏳ Analisi…';
  if(aidot){aidot.className='ai-dot active';}
  if(section!=='all') nav('all',null);
  else render();
  const dot=document.getElementById('ap-dot'); if(dot) dot.className='ap-dot';
  const url=force?`/api/morning-agent/${TODAY}/run?force=true`:`/api/morning-agent/${TODAY}/run`;
  try {
    const r=await fetch(url,{method:'POST',credentials:'include'});
    const reader=r.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        try{
          const ev=JSON.parse(line.slice(6));
          if(ev.log) _push(ev.log,null);
          if(ev.error) _push('❌ '+ev.error,'err');
          if(ev.done&&ev.summary){
            _push('✅ Completato','done-line');
            const s=ev.summary;
            _sumHtml=[{v:s.events||0,l:'eventi'},{v:s.tasks||0,l:'email'},{v:s.dayType||'—',l:'giornata'},{v:s.studyItems||0,l:'newsletter'},{v:s.emailSent?'✓':'✗',l:'email inviata'}].map(x=>`<div class="sum-item"><div class="sv">${x.v}</div><div class="sl">${x.l}</div></div>`).join('');
            const dot=document.getElementById('ap-dot'); if(dot) dot.className='ap-dot done';
            await loadDay();
          }
        }catch{}
      }
    }
  } catch(e){ _push('❌ '+e.message,'err'); }
  _agentRunning = false;
  btn.disabled=false; btn.textContent='☀️ Briefing';
  if(aidot){aidot.className='ai-dot done-state'; setTimeout(()=>{aidot.className='ai-dot';},3000);}
}

// ── Push Notifications ─────────────────────────────────────────────────────
async function requestPushPermission() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  const result = await Notification.requestPermission();
  return result === 'granted';
}

async function subscribePush() {
  try {
    const granted = await requestPushPermission();
    if (!granted) return;
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if (existing) return; // already subscribed

    const keyRes = await fetch('/api/push/vapid-key', { credentials: 'include' });
    const { publicKey } = await keyRes.json();

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
    await fetch('/api/push/subscribe', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub.toJSON())
    });
    console.log('[Push] Subscribed');
  } catch(e) { console.warn('[Push]', e.message); }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = window.atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

// Auto-subscribe push after page loads (only asks once if not already granted)
window.addEventListener('load', () => setTimeout(subscribePush, 3000));

// ── Focus Timer ────────────────────────────────────────────────────────────
function startFocus(id, title) {
  if (_focusTimer) clearInterval(_focusTimer);
  _focusTask = {id, title};
  _focusRemaining = 25 * 60;
  _focusPaused = false;
  _updateFocusBar();
  document.getElementById('focus-bar').style.display = 'flex';
  document.getElementById('focus-pause-btn').textContent = '⏸';
  _focusTimer = setInterval(_focusTick, 1000);
}
function _focusTick() {
  if (_focusPaused) return;
  _focusRemaining--;
  _updateFocusBar();
  if (_focusRemaining <= 0) {
    clearInterval(_focusTimer); _focusTimer = null;
    document.getElementById('focus-bar').style.display = 'none';
    const flash = document.createElement('div');
    flash.className = 'focus-flash';
    flash.textContent = '✅ Focus completato!';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 3000);
  }
}
function _updateFocusBar() {
  const mins = Math.floor(_focusRemaining/60);
  const secs = _focusRemaining % 60;
  const timeEl = document.getElementById('focus-time');
  const nameEl = document.getElementById('focus-task-name');
  const pbEl = document.getElementById('focus-pb-fill');
  if (timeEl) timeEl.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  if (nameEl) nameEl.textContent = _focusTask?.title ? (_focusTask.title.length>35?_focusTask.title.slice(0,35)+'…':_focusTask.title) : '—';
  if (pbEl) pbEl.style.width = `${Math.round(_focusRemaining/(25*60)*100)}%`;
}
function toggleFocusPause() {
  _focusPaused = !_focusPaused;
  const btn = document.getElementById('focus-pause-btn');
  if (btn) btn.textContent = _focusPaused ? '▶' : '⏸';
}
function stopFocus() {
  if (_focusTimer) { clearInterval(_focusTimer); _focusTimer = null; }
  document.getElementById('focus-bar').style.display = 'none';
  _focusTask = null;
}

    boardsData = await r.json();
    // Re-render home bento if we're on the home section
    if (section === 'all') render();
  } catch {}
}

// ── Inbox triage ───────────────────────────────────────────────────────────
async function checkInboxPending() {
  try {
    const r = await fetch('/api/inbox/pending', {credentials:'include'});
    if (!r.ok) return;
    const data = await r.json();
    if (data.count > 0) {
      _triageEmails = data.pending;
      _inboxCount = data.count;
      if (section === 'all') render();
      openTriageModal();
      return;
    }
    // No pending — sync from Gmail to find new emails
    const s = await fetch('/api/inbox/sync', {method:'POST', credentials:'include'});
    if (!s.ok) return;
    const sd = await s.json();
    if (sd.added > 0) {
      // Fetch the newly populated pending list
      const r2 = await fetch('/api/inbox/pending', {credentials:'include'});
      if (!r2.ok) return;
      const d2 = await r2.json();
      _triageEmails = d2.pending;
      _inboxCount = d2.count;
      if (section === 'all') render();
      if (_inboxCount > 0) openTriageModal();
    }
  } catch {}
}

function openTriageModal() {
  if (!_triageEmails.length) return;
  _triageIdx = 0;
  _triageSelectedBoardId = null;
  const modal = document.getElementById('triage-modal');
  if (!modal) return;
  modal.style.display = 'flex';
  showTriageEmail(_triageEmails[0], 0, _triageEmails.length);
  // Close board panel
  const bp = document.getElementById('triage-board-panel');
  if (bp) bp.classList.remove('open');
}

function showTriageEmail(email, idx, total) {
  const pct = total > 0 ? Math.round((idx / total) * 100) : 0;
  const pb = document.getElementById('triage-pb');
  const ptxt = document.getElementById('triage-progress-txt');
  const catBadge = document.getElementById('triage-cat-badge');
  const fromEl = document.getElementById('triage-from');
  const subjEl = document.getElementById('triage-subject');
  const snipEl = document.getElementById('triage-snippet');
  if (pb) pb.style.width = pct + '%';
  if (ptxt) ptxt.textContent = `${idx + 1} di ${total}`;
  const catMap = {
    'CATEGORY_PERSONAL': 'Principale',
    'CATEGORY_UPDATES': 'Aggiornamenti',
    'CATEGORY_SOCIAL': 'Social',
    'CATEGORY_PROMOTIONS': 'Promozioni',
    'CATEGORY_FORUMS': 'Forum'
  };
  const cat = catMap[email.category] || email.category || '—';
  if (catBadge) catBadge.textContent = cat;
  if (fromEl) fromEl.textContent = email.from || '—';
  if (subjEl) subjEl.textContent = email.subject || '(nessun oggetto)';
  if (snipEl) snipEl.textContent = email.snippet || '';
}

function triageToggleBoardPanel() {
  const bp = document.getElementById('triage-board-panel');
  if (!bp) return;
  const isOpen = bp.classList.toggle('open');
  if (isOpen) {
    const list = document.getElementById('triage-board-list');
    if (list) {
      const boards = boardsData || [];
      if (boards.length === 0) {
        list.innerHTML = '<div style="font-size:12px;color:var(--t2);padding:4px 0">Nessuna board ancora</div>';
      } else {
        list.innerHTML = boards.map(b => {
          const openCount = (b.groups || []).reduce((n, g) => n + (g.items || []).filter(i => !i.done).length, 0);
          return `<button class="triage-board-item${_triageSelectedBoardId===b.id?' sel':''}" onclick="triageSelectBoard('${b.id}',this)">
            <span style="font-size:15px">${b.icon||'📋'}</span>
            <span style="flex:1">${esc(b.name)}</span>
            <span style="font-size:11px;color:var(--t2)">${openCount} task</span>
          </button>`;
        }).join('');
      }
    }
  }
}

function triageSelectBoard(boardId, el) {
  _triageSelectedBoardId = boardId;
  document.querySelectorAll('.triage-board-item').forEach(b => b.classList.toggle('sel', b === el));
  // Auto-confirm
  triageAction('board');
}

async function triageAction(action) {
  const email = _triageEmails[_triageIdx];
  if (!email) return;

  const body = { emailId: email.id, action };
  if (action === 'board') {
    const newName = document.getElementById('triage-new-board-name')?.value?.trim();
    if (_triageSelectedBoardId) {
      body.boardId = _triageSelectedBoardId;
    } else if (newName) {
      body.newBoardName = newName;
    } else {
      // Board panel open but nothing selected — just show it
      triageToggleBoardPanel();
      return;
    }
  }

  try {
    await fetch('/api/inbox/triage', {
      method: 'POST',
      credentials: 'include',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    // Reload boards if a new board was created
    if (action === 'board') loadBoards();
  } catch {}

  _triageIdx++;
  _triageSelectedBoardId = null;
  _inboxCount = _triageEmails.length - _triageIdx;

  const bp = document.getElementById('triage-board-panel');
  if (bp) bp.classList.remove('open');
  const inp = document.getElementById('triage-new-board-name');
  if (inp) inp.value = '';

  if (_triageIdx >= _triageEmails.length) {
    document.getElementById('triage-modal').style.display = 'none';
    _inboxCount = 0;
    if (section === 'all') render();
    return;
  }

  showTriageEmail(_triageEmails[_triageIdx], _triageIdx, _triageEmails.length);
  if (section === 'all') render();
}

async function triageSkipAll() {
  try {
    await fetch('/api/inbox/skip-all', {method:'POST', credentials:'include'});
  } catch {}
  document.getElementById('triage-modal').style.display = 'none';
  _triageEmails = [];
  _triageIdx = 0;
  _inboxCount = 0;
  if (section === 'all') render();
}
</script>
</body>
</html>
