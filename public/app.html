<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:    #0a0a0a;
      --s1:    #111111;
      --s2:    #181818;
      --s3:    #1f1f1f;
      --line:  rgba(255,255,255,.06);
      --line2: rgba(255,255,255,.03);
      --t0:    #f5f5f7;
      --t1:    #a0a0a8;
      --t2:    #555560;
      --accent:#7c6ef5;
      --adim:  rgba(124,110,245,.14);
      --red:   #ff4444;
      --green: #00d084;
      --amber: #ffb800;
      --blue:  #3b82f6;
      --r:     14px;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--t0); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ── TOP NAV ── */
    .topbar {
      position: sticky; top: 0; z-index: 200; height: 54px;
      padding: 0 28px; display: flex; align-items: center; gap: 6px;
      background: rgba(10,10,10,.9); backdrop-filter: blur(24px) saturate(160%);
      border-bottom: 1px solid var(--line);
    }
    .tb-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; margin-right: 28px; flex-shrink: 0; }
    .tb-gem {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg,#7c6ef5,#a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; box-shadow: 0 0 14px rgba(124,110,245,.3);
    }
    .tb-name { font-size: 16px; font-weight: 800; letter-spacing: -.03em; color: var(--t0); }
    .tab-nav { display: flex; gap: 2px; flex: 1; }
    .tnav {
      padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
      color: var(--t2); cursor: pointer; border: none; background: none;
      transition: color .12s, background .12s;
    }
    .tnav:hover { color: var(--t1); background: rgba(255,255,255,.04); }
    .tnav.on { color: var(--t0); background: rgba(255,255,255,.08); }
    .tb-right { margin-left: auto; display: flex; align-items: center; gap: 7px; }
    .btn-run {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--accent); border: none; border-radius: 8px;
      color: #fff; padding: 6px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: filter .15s; white-space: nowrap;
    }
    .btn-run:hover { filter: brightness(1.1); }
    .btn-run:disabled { opacity: .4; cursor: not-allowed; filter: none; }
    .btn-icon {
      background: rgba(255,255,255,.05); border: 1px solid var(--line);
      border-radius: 8px; color: var(--t1); padding: 5px 10px; font-size: 13px;
      cursor: pointer; transition: background .12s; display: inline-flex; align-items: center;
    }
    .btn-icon:hover { background: rgba(255,255,255,.09); color: var(--t0); }
    .btn-link { background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--t1); padding: 5px 11px; font-size: 12px; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; transition: border-color .12s, color .12s; }
    .btn-link:hover { border-color: var(--t2); color: var(--t0); }
    .avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#7c6ef5,#a78bfa); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-menu { position: fixed; top: 58px; right: 16px; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px; min-width: 210px; z-index: 300; box-shadow: 0 16px 40px rgba(0,0,0,.6); display: none; }
    .user-menu.open { display: block; }
    .um-head { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
    .um-name { font-size: 13px; font-weight: 600; }
    .um-email { font-size: 11px; color: var(--t2); margin-top: 2px; }
    .um-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; color: var(--t1); cursor: pointer; border-radius: 8px; transition: background .1s; text-decoration: none; }
    .um-item:hover { background: rgba(255,255,255,.05); color: var(--t0); }

    /* ── PAGE ── */
    .page { max-width: 1120px; margin: 0 auto; padding: 32px 28px 80px; display: flex; flex-direction: column; gap: 28px; }

    /* ── HERO ── */
    .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
    .hero-l {}
    .hero-date { font-size: 11px; color: var(--t2); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
    .hero-name { font-size: 36px; font-weight: 900; letter-spacing: -.04em; line-height: 1.05; margin-bottom: 10px; }
    .hero-name em { font-style: normal; color: var(--accent); }
    .hero-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .hbadge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid; }
    .hbadge.focus   { border-color: rgba(0,208,132,.22);  color: var(--green); background: rgba(0,208,132,.07); }
    .hbadge.maker   { border-color: rgba(255,184,0,.22);  color: var(--amber); background: rgba(255,184,0,.07); }
    .hbadge.manager { border-color: rgba(124,110,245,.22); color: #a78bfa;     background: rgba(124,110,245,.07); }
    .hbadge.warn    { border-color: rgba(255,68,68,.22);  color: var(--red);   background: rgba(255,68,68,.07); }
    .prog-bar-wrap { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; max-width: 280px; }
    .prog-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }
    .prog-text { font-size: 11px; color: var(--t2); margin-top: 5px; }
    .hero-kpis { display: flex; gap: 10px; flex-shrink: 0; }
    .kpi { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 22px; text-align: center; min-width: 84px; }
    .kpi-n { font-size: 34px; font-weight: 900; letter-spacing: -.05em; line-height: 1; color: var(--t1); }
    .kpi-n.red { color: var(--red); }
    .kpi-l { font-size: 11px; color: var(--t2); margin-top: 4px; font-weight: 500; }

    /* ── COACHING BRIEF ── */
    .brief-card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
    .brief-head { display: flex; align-items: center; gap: 8px; padding: 11px 18px 10px; border-bottom: 1px solid var(--line2); }
    .brief-head-label { font-size: 11px; font-weight: 700; color: var(--t2); text-transform: uppercase; letter-spacing: .07em; }
    .brief-body { padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start; }
    .brief-icon { font-size: 16px; flex-shrink: 0; margin-top: 2px; }
    .brief-text { font-size: 13px; color: var(--t1); line-height: 1.85; }
    .brief-text strong { color: var(--t0); }

    /* ── AGENT PANEL ── */
    .agent-panel { background: #080808; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: none; }
    .agent-panel.open { display: block; }
    .ap-header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
    .ap-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.2s infinite; flex-shrink: 0; }
    .ap-dot.done { background: var(--accent); animation: none; }
    .ap-title { font-size: 12px; font-weight: 600; color: var(--t1); flex: 1; }
    .ap-close { background: none; border: none; color: var(--t2); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 2px; }
    .ap-close:hover { color: var(--t1); }
    .ap-log { font-family: 'SF Mono','Fira Code',monospace; font-size: 11px; color: #86efac; padding: 12px 16px; max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
    .ap-log .err { color: #fca5a5; }
    .ap-log .done-line { color: #a78bfa; font-weight: 600; }
    .ap-summary { display: none; gap: 20px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .ap-summary.visible { display: flex; }
    .sum-item .sv { font-size: 18px; font-weight: 800; color: #a5b4fc; }
    .sum-item .sl { font-size: 10px; color: var(--t2); margin-top: 1px; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── BENTO GRID ── */
    .bento { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: start; }
    .bc { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
    .bc.s2 { grid-column: span 2; }
    .bc.s3 { grid-column: span 3; }
    .bc-head { display: flex; align-items: center; gap: 8px; padding: 13px 18px 11px; border-bottom: 1px solid var(--line2); flex-shrink: 0; }
    .bc-title { font-size: 11px; font-weight: 700; color: var(--t2); text-transform: uppercase; letter-spacing: .07em; flex: 1; }
    .bc-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,.05); color: var(--t2); }
    .bc-badge.red  { background: rgba(255,68,68,.1);   color: #ff7070; }
    .bc-badge.blue { background: rgba(59,130,246,.1);  color: #60a5fa; }
    .bc-badge.pur  { background: rgba(124,110,245,.1); color: #a78bfa; }
    .bc-more { font-size: 11px; color: var(--t2); text-decoration: none; padding: 2px 6px; border-radius: 6px; transition: color .12s; white-space: nowrap; }
    .bc-more:hover { color: var(--t1); }

    /* ── EVENT ROWS ── */
    .ev-row { display: flex; align-items: flex-start; gap: 12px; padding: 11px 18px; border-bottom: 1px solid var(--line2); transition: background .1s; }
    .ev-row:last-child { border-bottom: none; }
    .ev-row:hover { background: rgba(255,255,255,.018); }
    .ev-row.done { opacity: .4; }
    .ev-time { font-size: 11px; color: var(--t2); min-width: 76px; flex-shrink: 0; padding-top: 2px; font-variant-numeric: tabular-nums; }
    .ev-body { flex: 1; min-width: 0; }
    .ev-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ev-meta  { font-size: 11px; color: var(--t2); }
    .ev-brief { font-size: 12px; color: var(--t2); margin-top: 4px; line-height: 1.5; }
    .ev-act { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
    .btn-join { background: rgba(0,208,132,.08); border: 1px solid rgba(0,208,132,.2); color: var(--green); border-radius: 7px; padding: 4px 10px; font-size: 11px; font-weight: 600; text-decoration: none; white-space: nowrap; transition: background .12s; }
    .btn-join:hover { background: rgba(0,208,132,.15); }
    .btn-circle { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 9px; transition: border-color .12s, background .12s; flex-shrink: 0; color: transparent; }
    .btn-circle:hover { border-color: var(--green); }
    .btn-circle.done { background: var(--green); border-color: var(--green); color: #fff; }

    /* ── HEALTH ── */
    .h-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .hm { padding: 14px 16px; border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); }
    .hm:nth-child(2n) { border-right: none; }
    .hm:nth-child(3),.hm:nth-child(4) { border-bottom: none; }
    .hm-val { font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
    .hm-lbl { font-size: 11px; color: var(--t2); margin-top: 2px; }
    .h-rec { padding: 11px 16px; font-size: 12px; color: var(--t2); border-top: 1px solid var(--line2); line-height: 1.8; }

    /* ── Q-FILTER ── */
    .q-strip { display: flex; gap: 4px; padding: 9px 18px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
    .qb { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid var(--line); background: transparent; color: var(--t2); cursor: pointer; transition: all .12s; }
    .qb:hover { color: var(--t1); }
    .qb.on      { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.12); color: var(--t0); }
    .qb.on.q1   { background: rgba(255,68,68,.1);    border-color: rgba(255,68,68,.25);   color: #ff7070; }
    .qb.on.q2   { background: rgba(59,130,246,.1);   border-color: rgba(59,130,246,.25);  color: #60a5fa; }
    .qb.on.q3   { background: rgba(255,184,0,.1);    border-color: rgba(255,184,0,.25);   color: #ffb800; }
    .qb.on.q4   { background: rgba(82,82,91,.15);    border-color: rgba(82,82,91,.4);     color: var(--t1); }

    /* ── TASK ROWS ── */
    .tk-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 18px; border-bottom: 1px solid var(--line2); transition: background .1s; }
    .tk-row:last-child { border-bottom: none; }
    .tk-row:hover { background: rgba(255,255,255,.018); }
    .tk-row.done { opacity: .38; }
    .tk-row.is-q1 { border-left: 2px solid rgba(255,68,68,.5); padding-left: 16px; }
    .q-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .q-dot.Q1 { background: var(--red); box-shadow: 0 0 5px rgba(255,68,68,.5); }
    .q-dot.Q2 { background: var(--blue); }
    .q-dot.Q3 { background: var(--amber); }
    .q-dot.Q4 { background: var(--t2); }
    .tk-body { flex: 1; min-width: 0; }
    .tk-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
    .tk-row.is-q1 .tk-title { color: #fff5f5; }
    .tk-meta { font-size: 11px; color: var(--t2); }
    .tk-meta a { color: var(--accent); text-decoration: none; }
    .tk-meta a:hover { text-decoration: underline; }
    .tk-brief { font-size: 12px; color: var(--t1); margin-top: 5px; line-height: 1.55; }
    .tk-aps { margin-top: 7px; display: none; flex-direction: column; gap: 3px; }
    .tk-aps.open { display: flex; }
    .ap-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: var(--t1); padding: 2px 0; }
    .ap-cb { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid var(--t2); background: none; cursor: pointer; flex-shrink: 0; margin-top: 2px; transition: background .1s, border-color .1s; }
    .ap-cb.done { background: var(--green); border-color: var(--green); }
    .ap-text.done { text-decoration: line-through; opacity: .4; }
    .tk-acts { display: flex; align-items: flex-start; gap: 5px; flex-shrink: 0; margin-top: 1px; }
    .btn-exp { background: none; border: none; color: var(--t2); font-size: 16px; cursor: pointer; line-height: 1; padding: 1px 2px; transition: color .12s, transform .2s; }
    .btn-exp:hover { color: var(--t1); }
    .btn-exp.open { transform: rotate(180deg); }

    /* ── STUDY ROWS ── */
    .st-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 18px; border-bottom: 1px solid var(--line2); transition: background .1s; }
    .st-row:last-child { border-bottom: none; }
    .st-row:hover { background: rgba(255,255,255,.015); }
    .st-row.done { opacity: .35; }
    .st-num { width: 22px; height: 22px; border-radius: 6px; background: var(--adim); color: #a78bfa; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .st-body { flex: 1; min-width: 0; }
    .st-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-title a { color: inherit; text-decoration: none; }
    .st-title a:hover { color: #a5b4fc; }
    .st-src { font-size: 11px; color: var(--t2); margin-bottom: 3px; }
    .st-sum { font-size: 12px; color: var(--t1); line-height: 1.5; margin-bottom: 4px; }
    .st-rec { font-size: 11px; color: var(--green); }
    .st-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
    .stag { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: .2px; }
    .stag.high   { background: rgba(255,68,68,.1);    color: #ff7070; }
    .stag.medium { background: rgba(255,184,0,.1);    color: #ffb800; }
    .stag.low    { background: rgba(82,82,91,.12);    color: #9ca3af; }
    .stag.cat    { background: rgba(124,110,245,.1);  color: #a78bfa; }
    .stag.gmail  { background: rgba(0,208,132,.07);   color: var(--green); }

    /* ── NETWORK ROWS ── */
    .net-row { display: flex; gap: 12px; align-items: flex-start; padding: 11px 18px; border-bottom: 1px solid var(--line2); }
    .net-row:last-child { border-bottom: none; }
    .net-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 7px rgba(124,110,245,.4); flex-shrink: 0; margin-top: 4px; }
    .net-body { flex: 1; min-width: 0; }
    .net-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .net-meta  { font-size: 11px; color: var(--t2); margin-bottom: 3px; }
    .net-desc  { font-size: 12px; color: var(--t2); line-height: 1.5; }
    .net-tags  { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
    .net-tag   { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: var(--adim); color: #a78bfa; }
    .btn-info  { display: inline-flex; align-items: center; white-space: nowrap; font-size: 11px; font-weight: 600; padding: 4px 11px; border-radius: 7px; background: var(--adim); border: 1px solid rgba(124,110,245,.2); color: #a78bfa; text-decoration: none; transition: background .12s; flex-shrink: 0; }
    .btn-info:hover { background: rgba(124,110,245,.22); }

    /* ── FAMILY ── */
    .fam-cols { display: grid; grid-template-columns: 1fr 1fr; }
    .fam-col { padding: 14px 18px; }
    .fam-col + .fam-col { border-left: 1px solid var(--line2); }
    .fam-label { font-size: 10px; font-weight: 700; color: var(--t2); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
    .fam-body  { font-size: 13px; color: var(--t1); line-height: 1.75; }
    .fam-alert { color: var(--amber); font-size: 12px; margin-top: 4px; }

    /* ── EMPTY ── */
    .empty { padding: 44px 24px; text-align: center; color: var(--t1); font-size: 13px; line-height: 1.8; }
    .empty .ei { font-size: 34px; margin-bottom: 10px; }
    .empty strong { color: var(--t0); }
    .empty-sm { padding: 18px; font-size: 13px; color: var(--t2); }

    /* ── FULL-WIDTH SECTION (non-bento tabs) ── */
    .fw-section { display: flex; flex-direction: column; gap: 14px; }
    .fw-head { display: flex; align-items: center; gap: 10px; }
    .fw-title { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
    .fw-count { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; background: rgba(255,255,255,.07); color: var(--t1); }
    .fw-sub { margin-left: auto; font-size: 12px; color: var(--t2); }
    .card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

    /* ── ACTIVITIES ── */
    .act-sections { display: flex; flex-direction: column; gap: 20px; }
    .act-group-title { font-size: 13px; font-weight: 700; color: var(--t1); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .act-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .act-card {
      background: var(--s1); border: 1px solid var(--line); border-radius: var(--r);
      padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
      transition: border-color .15s;
    }
    .act-card:hover { border-color: rgba(255,255,255,.1); }
    .act-card-top { display: flex; align-items: flex-start; gap: 10px; }
    .act-price { font-size: 11px; font-weight: 700; color: var(--t2); flex-shrink: 0; margin-top: 2px; }
    .act-title { font-size: 14px; font-weight: 700; flex: 1; line-height: 1.3; }
    .act-location { font-size: 11px; color: var(--t2); }
    .act-desc { font-size: 12px; color: var(--t1); line-height: 1.6; }
    .act-why { font-size: 11px; color: var(--green); font-style: italic; }
    .act-footer { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .act-cat { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: rgba(255,255,255,.05); color: var(--t2); text-transform: uppercase; letter-spacing: .2px; }
    .act-link { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--accent); text-decoration: none; }
    .act-link:hover { text-decoration: underline; }
    /* type accent colors */
    .act-card.solo     { border-top: 2px solid rgba(59,130,246,.4); }
    .act-card.couple   { border-top: 2px solid rgba(255,100,130,.4); }
    .act-card.family   { border-top: 2px solid rgba(0,208,132,.4); }
    .act-card.restaurant { border-top: 2px solid rgba(255,184,0,.4); }

    /* ── RESPONSIVE ── */
    @media (max-width: 860px) {
      .bento { grid-template-columns: 1fr 1fr; }
      .bc.s2, .bc.s3 { grid-column: span 2; }
      .hero-kpis { display: none; }
    }
    @media (max-width: 600px) {
      .bento { grid-template-columns: 1fr; }
      .bc.s2, .bc.s3 { grid-column: span 1; }
      .page { padding: 20px 16px 60px; }
      .tab-nav .tnav:not(.on) { display: none; }
    }
  </style>
</head>
<body>

<nav class="topbar">
  <a class="tb-logo" href="/app.html">
    <div class="tb-gem">✦</div>
    <span class="tb-name">Glint</span>
  </a>
  <div class="tab-nav">
    <button class="tnav on" onclick="nav('all',this)">Oggi</button>
    <button class="tnav" onclick="nav('growth',this)">Crescita <span id="tnav-growth" style="display:none"></span></button>
    <button class="tnav" onclick="nav('activities',this)">Vita locale</button>
    <button class="tnav" onclick="nav('network',this)">Network</button>
    <button class="tnav" onclick="nav('family',this)">Famiglia</button>
  </div>
  <div class="tb-right">
    <button class="btn-run" id="run-btn" onclick="runAgent(false)">☀️ Briefing</button>
    <button class="btn-icon" onclick="runAgent(true)" title="Force refresh">⚡</button>
    <a href="/wellness.html" class="btn-link">🧠</a>
    <a href="/settings.html" class="btn-link">⚙️</a>
    <div class="avatar" id="avatar-btn" onclick="toggleMenu()">?<img id="avatar-img" src="" style="display:none"/></div>
  </div>
  <div class="user-menu" id="user-menu">
    <div class="um-head">
      <div class="um-name" id="um-name">—</div>
      <div class="um-email" id="um-email">—</div>
    </div>
    <a href="/wellness.html" class="um-item">🧠 Wellness &amp; Brain</a>
    <a href="/settings.html" class="um-item">⚙️ Impostazioni</a>
    <div class="um-item" onclick="logout()">↩ Esci</div>
  </div>
</nav>

<div class="page" id="page"></div>
<div id="overlay" style="display:none;position:fixed;inset:0;z-index:250;" onclick="closeMenu()"></div>

<script>
'use strict';
const TODAY = new Date().toISOString().slice(0,10);
let dayData = null;
let section = 'all';
let qFilter = 'all';
let userName = '';
let _panelOpen = false, _logLines = [], _sumHtml = '';

// ── Bootstrap ──────────────────────────────────────────────────────────────
(async () => {
  try {
    const r = await fetch('/api/me',{credentials:'include'});
    if (r.status===401){location.href='/login.html';return;}
    const u = await r.json();
    userName = u.name||'';
    const init = userName.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
    document.getElementById('avatar-btn').childNodes[0].nodeValue = init;
    if (u.picture){const img=document.getElementById('avatar-img');img.src=u.picture;img.style.display='block';}
    document.getElementById('um-name').textContent = u.name||'';
    document.getElementById('um-email').textContent = u.email||'';
  } catch { location.href='/login.html'; return; }
  await loadDay();
})();

async function loadDay() {
  try {
    const r = await fetch(`/api/day/${TODAY}`,{credentials:'include'});
    dayData = await r.json();
    const tasks = dayData?.tasks||[], items = dayData?.items||{};
    if (qFilter==='all' && tasks.some(t=>(t.quadrant||'Q2').toUpperCase()==='Q1' && !items[t.id]?.done))
      qFilter='Q1';
    render();
  } catch { renderEmpty(); }
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const d       = dayData||{};
  const events  = d.events||[];
  const tasks   = d.tasks||[];
  const items   = d.items||{};
  const ins     = d.insights||{};
  const family  = d.family||{};
  const net     = d.network||{};
  const study   = ins.studyItems||[];
  const netEvts = net.events||[];
  const health  = d.health||null;
  const byQ     = q => tasks.filter(t=>(t.quadrant||'Q2').toUpperCase()===q);
  const q1=byQ('Q1'),q2=byQ('Q2'),q3=byQ('Q3'),q4=byQ('Q4');
  const q1Active    = q1.filter(t=>!items[t.id]?.done).length;
  const totalPending= tasks.filter(t=>!items[t.id]?.done).length;
  const done        = Object.values(items).filter(i=>i.done).length;
  const total       = events.length + tasks.length;

  // update nav badge
  const tb = document.getElementById('tnav-growth');
  if(tb){if(study.length){tb.textContent='·'+study.length;tb.style.display='';} else tb.style.display='none';}

  // update tab active state
  document.querySelectorAll('.tnav').forEach(b=>b.classList.remove('on'));
  const tabMap = {'all':0,'growth':1,'activities':2,'network':3,'family':4};
  const tabIdx = tabMap[section]??0;
  document.querySelectorAll('.tnav')[tabIdx]?.classList.add('on');

  const page = document.getElementById('page');

  // ── SECTION: CRESCITA (full width) ──
  if (section==='growth') {
    const high=study.filter(s=>s.priority==='high'), med=study.filter(s=>s.priority==='medium'), low=study.filter(s=>s.priority==='low'||!s.priority);
    const catSub = ['Aggiornamenti','Social','Promozioni','Forum'].filter(c=>study.some(s=>s.gmailCategory===c)).map(c=>`${c} ${study.filter(s=>s.gmailCategory===c).length}`).join(' · ');
    const ordered = [...high,...med,...low];
    page.innerHTML = `
      ${_panelHtml()}
      <div class="fw-section">
        <div class="fw-head">
          <span class="fw-title">📚 Crescita</span>
          ${study.length?`<span class="fw-count">${study.length}</span>`:''}
          ${catSub?`<span class="fw-sub">${esc(catSub)}</span>`:''}
        </div>
        <div class="card">
          <div class="st-list">
            ${ordered.length ? ordered.map((s,_i)=>{
              const idx=study.indexOf(s);
              return stRow(s,idx);
            }).join('') : `<div class="empty"><div class="ei">📚</div>Nessun contenuto da Aggiornamenti, Social o Promozioni.<br/>Clicca <strong>⚡</strong> per forzare l'analisi.</div>`}
          </div>
        </div>
      </div>`;
    _restorePanel();
    return;
  }

  // ── SECTION: NETWORK (full width) ──
  if (section==='network') {
    const city=net.city||'';
    const refreshedAt=net._refreshedAt ? new Date(net._refreshedAt).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}) : null;
    page.innerHTML = `
      ${_panelHtml()}
      <div class="fw-section">
        <div class="fw-head">
          <span class="fw-title">🌐 Network${city?' · '+esc(city):''}</span>
          ${netEvts.length?`<span class="fw-count">${netEvts.length}</span>`:''}
          ${refreshedAt?`<span style="font-size:11px;color:var(--t2);margin-left:auto">aggiornato ${refreshedAt}</span>`:''}
          <button onclick="refreshLocal()" style="margin-left:${refreshedAt?'8px':'auto'};padding:4px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--t1);cursor:pointer;font-size:12px">⟳ Aggiorna</button>
        </div>
        <div id="local-refresh-log" style="display:none;padding:10px 16px;font-size:12px;color:var(--t1);font-family:monospace;white-space:pre-wrap;border-bottom:1px solid var(--line)"></div>
        <div class="card">
          ${netEvts.length ? netEvts.map(e=>netRow(e)).join('') : `<div class="empty"><div class="ei">🌐</div>Nessun evento trovato${city?' a '+esc(city):''}.<br/><button onclick="refreshLocal()" style="margin-top:8px;padding:6px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:12px">⟳ Cerca eventi ora</button></div>`}
        </div>
      </div>`;
    _restorePanel();
    return;
  }

  // ── SECTION: VITA LOCALE (full width) ──
  if (section==='activities') {
    const act   = d.localActivities||{};
    const items = act.items||[];
    const city  = act.city||net.city||'';
    const refreshedAt=act._refreshedAt ? new Date(act._refreshedAt).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}) : null;
    const byType = t => items.filter(a=>a.type===t);
    const members=dayData?.userSettings?.familyMembers||[];
    const groups = [
      { type:'solo',       icon:'🚶', label:'Solo',               color:'#3b82f6' },
      { type:'couple',     icon:'💑', label:`Con ${members.find(f=>f.role==='spouse')?.name||'partner'}`, color:'#ff6482' },
      { type:'family',     icon:'👨‍👩‍👦', label:`Con ${members.find(f=>f.role==='child')?.name||'figlio'} (${members.find(f=>f.role==='child')?.age||8} anni)`, color:'#00d084' },
      { type:'restaurant', icon:'🍽️', label:'Ristoranti', color:'#ffb800' },
    ];
    const actCard = a => `<div class="act-card ${esc(a.type||'')}">
      <div class="act-card-top">
        <div class="act-price">${esc(a.price||'')}</div>
        <div class="act-title">${esc(a.title||'')}</div>
      </div>
      ${a.location?`<div class="act-location">📍 ${esc(a.location)}</div>`:''}
      <div class="act-desc">${esc(a.description||'')}</div>
      ${a.why?`<div class="act-why">💡 ${esc(a.why)}</div>`:''}
      <div class="act-footer">
        ${a.category?`<span class="act-cat">${esc(a.category)}</span>`:''}
        ${a.link?`<a href="${esc(a.link)}" target="_blank" class="act-link">↗ Info</a>`:''}
      </div>
    </div>`;
    page.innerHTML = `
      ${_panelHtml()}
      <div class="fw-section">
        <div class="fw-head">
          <span class="fw-title">🗺️ Vita locale${city?' · '+esc(city):''}</span>
          ${items.length?`<span class="fw-count">${items.length} idee</span>`:''}
          ${refreshedAt?`<span style="font-size:11px;color:var(--t2);margin-left:auto">aggiornato ${refreshedAt}</span>`:''}
          <button onclick="refreshLocal()" style="margin-left:${refreshedAt?'8px':'auto'};padding:4px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--t1);cursor:pointer;font-size:12px">⟳ Aggiorna</button>
        </div>
        <div id="local-refresh-log" style="display:none;padding:10px 16px;font-size:12px;color:var(--t1);font-family:monospace;white-space:pre-wrap;border-bottom:1px solid var(--line)"></div>
        ${items.length ? `<div class="act-sections">
          ${groups.map(g=>{
            const gItems = byType(g.type);
            if(!gItems.length) return '';
            return `<div>
              <div class="act-group-title"><span>${g.icon}</span><span style="color:${g.color}">${g.label}</span></div>
              <div class="act-grid">${gItems.map(actCard).join('')}</div>
            </div>`;
          }).join('')}
        </div>`
        : `<div class="card"><div class="empty"><div class="ei">🗺️</div>Nessuna attività trovata${city?' per '+esc(city):''}.<br/><button onclick="refreshLocal()" style="margin-top:8px;padding:6px 16px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:12px">⟳ Cerca attività ora</button></div></div>`}
      </div>`;
    _restorePanel();
    return;
  }

  // ── SECTION: FAMIGLIA (full width) ──
  if (section==='family') {
    const al=family.alessandraEvents||[], tm=family.tommasoAlerts||[];
    const members=dayData?.userSettings?.familyMembers||[];
    const sp=members.find(f=>f.role==='spouse')?.name||'Partner';
    const ch=members.find(f=>f.role==='child')?.name||'Figli';
    const hasMembers=members.length>0;
    page.innerHTML = `
      ${_panelHtml()}
      <div class="fw-section">
        <div class="fw-head"><span class="fw-title">👨‍👩‍👦 Famiglia</span></div>
        ${!hasMembers ? `<div class="card"><div class="empty"><div class="ei">👨‍👩‍👦</div>Configura i tuoi familiari in <a href="/settings.html" style="color:var(--accent)">Impostazioni → Famiglia</a>,<br/>poi clicca <strong>☀️ Briefing</strong> per rilevare i loro impegni dal Calendar.</div></div>`
        : `<div class="card">
          <div class="fam-cols">
            <div class="fam-col">
              <div class="fam-label">${esc(sp)}</div>
              <div class="fam-body">${al.length?al.map(e=>`${e.time?esc(e.time)+' · ':''}${esc(e.title)}${e.isAway?`<div class="fam-alert">⚠️ Non sarà a casa</div>`:''}`).join('<br/>'):`<span style="color:var(--t2)">Nessun impegno rilevato oggi</span>`}</div>
            </div>
            <div class="fam-col">
              <div class="fam-label">${esc(ch)} · Scuola</div>
              <div class="fam-body">${tm.length?tm.map(t=>`<a href="${esc(t.link)}" target="_blank" style="color:#60a5fa;text-decoration:none">${esc(t.title)}</a>${t.priority==='high'?' 🔴':''}`).join('<br/>'):`<span style="color:var(--t2)">Nessuna comunicazione recente</span>`}</div>
            </div>
          </div>
          ${!al.length&&!tm.length?`<div style="padding:6px 18px 14px;font-size:12px;color:var(--t2)">Nessun evento rilevato oggi. Clicca <strong>☀️ Briefing</strong> per aggiornare.</div>`:''}
        </div>`}
      </div>`;
    _restorePanel();
    return;
  }

  // ── SECTION: OGGI (bento grid) ──
  const dayType = ins.dayType||'';
  const badgeClass = {focus:'focus',maker:'maker',manager:'manager'}[dayType]||'focus';
  const badgeLabel = {focus:'🟢 Focus Day',maker:'🛠️ Maker Day',manager:'👔 Manager Day'}[dayType]||(dayType||'');
  const pct = total>0 ? Math.round(done/total*100) : 0;
  const filteredTasks = qFilter==='all'?[...q1,...q2,...q3,...q4]:tasks.filter(t=>(t.quadrant||'Q2').toUpperCase()===qFilter);
  const studyPreview = study.slice(0,3);
  const netPreview   = netEvts.slice(0,3);
  const actData      = d.localActivities||{};
  const actPreview   = (actData.items||[]).slice(0,3);
  const sp=(dayData?.userSettings?.familyMembers||[]).find(f=>f.role==='spouse')?.name||'Partner';
  const ch=(dayData?.userSettings?.familyMembers||[]).find(f=>f.role==='child')?.name||'Figli';
  const al=family.alessandraEvents||[], tm=family.tommasoAlerts||[];

  page.innerHTML = `
    ${_panelHtml()}

    <!-- Hero -->
    <div class="hero">
      <div class="hero-l">
        <div class="hero-date">${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}</div>
        <div class="hero-name">Buongiorno,<br/><em>${userName?esc(userName.split(' ')[0]):'👋'}</em></div>
        <div class="hero-badges">
          ${badgeLabel?`<span class="hbadge ${badgeClass}">${badgeLabel}</span>`:''}
          ${q1Active>0?`<span class="hbadge warn">🔴 ${q1Active} urgent${q1Active>1?'i':''}</span>`:''}
        </div>
        <div class="prog-bar-wrap"><div class="prog-bar-fill" style="width:${pct}%"></div></div>
        <div class="prog-text">${done} di ${total} completat${done===1?'o':'i'}</div>
      </div>
      <div class="hero-kpis">
        <div class="kpi"><div class="kpi-n">${events.length}</div><div class="kpi-l">Riunioni</div></div>
        <div class="kpi"><div class="kpi-n ${q1Active>0?'red':''}">${q1Active}</div><div class="kpi-l">Urgenti Q1</div></div>
        <div class="kpi"><div class="kpi-n">${tasks.length}</div><div class="kpi-l">Email</div></div>
        <div class="kpi"><div class="kpi-n">${study.length}</div><div class="kpi-l">Da leggere</div></div>
      </div>
    </div>

    ${ins.growthBrief?`<div class="brief-card">
      <div class="brief-head"><span class="brief-head-label">☀️ Briefing del giorno</span></div>
      <div class="brief-body"><div class="brief-icon">💡</div><div class="brief-text">${esc(ins.growthBrief).replace(/\n/g,'<br/>')}</div></div>
    </div>`:''}

    ${health?`
    <div class="brief-card" style="gap:0;padding:0;overflow:hidden;">
      <div class="h-grid" style="flex:1;">
        ${(()=>{const s=health.sleepScore,hrv=health.hrv,rhr=health.restingHR,str=health.stressLevel;const sc=s>=76?'#86efac':s>=60?'#fde68a':'#fca5a5';return `
        <div class="hm"><div class="hm-val" style="color:${sc}">${s||'?'}<span style="font-size:13px;font-weight:400;color:var(--t2)">/100</span></div><div class="hm-lbl">Sonno</div></div>
        <div class="hm"><div class="hm-val">${hrv||'?'}<span style="font-size:12px;font-weight:400;color:var(--t2)"> ms</span></div><div class="hm-lbl">HRV</div></div>
        <div class="hm"><div class="hm-val">${rhr||'?'}<span style="font-size:12px;font-weight:400;color:var(--t2)"> bpm</span></div><div class="hm-lbl">FC riposo</div></div>
        <div class="hm"><div class="hm-val">${str||'?'}</div><div class="hm-lbl">Stress</div></div>
        ${health.recommendations?`<div class="h-rec" style="grid-column:span 2">🏃 ${esc(health.recommendations.activity||'')} &nbsp;·&nbsp; 🧠 ${esc(health.recommendations.mindset||'')}</div>`:''}
        `})()}
      </div>
    </div>`:''}

    <!-- Bento -->
    <div class="bento">

      <!-- Riunioni span2 -->
      <div class="bc s2">
        <div class="bc-head">
          <span class="bc-title">📅 Riunioni</span>
          ${events.length?`<span class="bc-badge blue">${events.length}</span>`:''}
        </div>
        ${events.length ? events.map(e=>{
          const st=items[e.id]||{}, br=(st.brief||e.brief||'').slice(0,160);
          return `<div class="ev-row ${st.done?'done':''}" id="ei-${esc(e.id)}">
            <div class="ev-time">${esc(e.time||'')}</div>
            <div class="ev-body">
              <div class="ev-title">${esc(e.title)}</div>
              ${e.participants?`<div class="ev-meta">👥 ${esc(e.participants)}</div>`:''}
              ${br?`<div class="ev-brief">${esc(br)}${(st.brief||e.brief||'').length>160?'…':''}</div>`:''}
            </div>
            <div class="ev-act">
              ${e.meetLink?`<a href="${esc(e.meetLink)}" target="_blank" class="btn-join">Join ↗</a>`:''}
              <button class="btn-circle ${st.done?'done':''}" onclick="toggleDone('${esc(e.id)}','event')">${st.done?'✓':''}</button>
            </div>
          </div>`;
        }).join('') : `<div class="empty"><div class="ei">📅</div>Nessuna riunione oggi.</div>`}
      </div>

      <!-- Salute span1 -->
      <div class="bc">
        <div class="bc-head"><span class="bc-title">🫀 Salute Oura</span></div>
        ${health ? `
        <div class="h-grid">
          ${(()=>{
            const s=health.sleepScore, hrv=health.hrv, rhr=health.restingHR, str=health.stressLevel;
            const rd=health.readinessScore, steps=health.steps, sleepMin=health.totalSleepMin;
            const sc=s>=76?'#86efac':s>=60?'#fde68a':'#fca5a5';
            const rc=rd>=85?'#86efac':rd>=60?'#fde68a':'#fca5a5';
            const sleepH=sleepMin?Math.floor(sleepMin/60)+'h '+(sleepMin%60)+'m':null;
            return`
            <div class="hm"><div class="hm-val" style="color:${sc}">${s||'?'}</div><div class="hm-lbl">Sonno</div></div>
            <div class="hm"><div class="hm-val" style="color:${rc}">${rd||'?'}</div><div class="hm-lbl">Readiness</div></div>
            <div class="hm"><div class="hm-val">${hrv||'?'}</div><div class="hm-lbl">HRV ms</div></div>
            <div class="hm"><div class="hm-val">${rhr||'?'}</div><div class="hm-lbl">FC riposo</div></div>
            ${sleepH?`<div class="hm" style="grid-column:span 2"><div class="hm-val" style="font-size:18px">${sleepH}</div><div class="hm-lbl">Sonno totale</div></div>`:''}
            ${steps?`<div class="hm" style="grid-column:span 2"><div class="hm-val" style="font-size:18px">${steps.toLocaleString('it-IT')}</div><div class="hm-lbl">Passi</div></div>`:''}
          `})()}
        </div>
        ${health.recommendations?`<div class="h-rec">🏃 ${esc(health.recommendations.activity||'')}<br/>🧠 ${esc(health.recommendations.mindset||'')}</div>`:''}
        ` : `<div class="empty"><div class="ei">🫀</div>Sincronizza Oura per vedere i dati.<br/><button onclick="syncOura()" style="margin-top:8px;padding:6px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:12px">⟳ Sincronizza ora</button></div>`}
      </div>

      <!-- Email span2 -->
      <div class="bc s2">
        <div class="bc-head">
          <span class="bc-title">📧 Email</span>
          ${q1Active>0?`<span class="bc-badge red">${q1Active} urgenti</span>`:''}
          ${tasks.length?`<span class="bc-badge">${tasks.length} totali</span>`:''}
        </div>
        <div class="q-strip">
          <button class="qb ${qFilter==='all'?'on':''}" onclick="setQ('all')">Tutti (${tasks.length})</button>
          <button class="qb q1 ${qFilter==='Q1'?'on':''}" onclick="setQ('Q1')">🔴 Q1 (${q1.length})</button>
          <button class="qb q2 ${qFilter==='Q2'?'on':''}" onclick="setQ('Q2')">🔵 Q2 (${q2.length})</button>
          <button class="qb q3 ${qFilter==='Q3'?'on':''}" onclick="setQ('Q3')">🟠 Q3 (${q3.length})</button>
          <button class="qb q4 ${qFilter==='Q4'?'on':''}" onclick="setQ('Q4')">⚫ Q4 (${q4.length})</button>
        </div>
        ${filteredTasks.length ? filteredTasks.map(t=>tkRow(t,items[t.id]||{})).join('')
          : tasks.length ? `<div class="empty-sm">Nessun task in questa categoria.</div>`
          : `<div class="empty"><div class="ei">📧</div>Nessuna email da gestire.<br/>Clicca <strong>☀️ Briefing</strong> per analizzare la inbox.</div>`}
      </div>

      <!-- Crescita preview span1 -->
      <div class="bc">
        <div class="bc-head">
          <span class="bc-title">📚 Crescita</span>
          ${study.length?`<span class="bc-badge pur">${study.length}</span>`:''}
          ${study.length>3?`<button class="bc-more" onclick="nav('growth',null)">Vedi tutti →</button>`:''}
        </div>
        ${studyPreview.length ? studyPreview.map((s,_i)=>stRowCompact(s,study.indexOf(s))).join('')
          : `<div class="empty"><div class="ei">📚</div>Nessuna newsletter.<br/>Clicca <strong>⚡</strong> per analizzare.</div>`}
      </div>

      <!-- Network preview span1 -->
      <div class="bc">
        <div class="bc-head">
          <span class="bc-title">🌐 Network${net.city?' · '+esc(net.city):''}</span>
          ${netEvts.length?`<span class="bc-badge blue">${netEvts.length}</span>`:''}
          ${netEvts.length>2?`<button class="bc-more" onclick="nav('network',null)">Tutti →</button>`:''}
        </div>
        ${netPreview.length ? netPreview.map(e=>netRow(e)).join('')
          : `<div class="empty"><div class="ei">🌐</div>Nessun evento.<br/><span style="font-size:11px">Avvia briefing per cercare</span></div>`}
      </div>

      <!-- Vita locale preview span1 -->
      <div class="bc">
        <div class="bc-head">
          <span class="bc-title">🗺️ Vita locale</span>
          ${actData.items?.length?`<span class="bc-badge pur">${actData.items.length}</span>`:''}
          ${actData.items?.length>3?`<button class="bc-more" onclick="nav('activities',null)">Tutti →</button>`:''}
        </div>
        ${actPreview.length ? actPreview.map(a=>`
          <div style="display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-bottom:1px solid var(--line2);">
            <div style="width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px;background:${{solo:'#3b82f6',couple:'#ff6482',family:'#00d084',restaurant:'#ffb800'}[a.type]||'var(--accent)'};"></div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(a.title||'')}</div>
              <div style="font-size:11px;color:var(--t2)">${esc(a.location||'')}${a.price?' · '+esc(a.price):''}</div>
            </div>
          </div>`).join('')
        : `<div class="empty"><div class="ei">🗺️</div>Nessuna idea locale.<br/><span style="font-size:11px">Avvia briefing per cercare</span></div>`}
      </div>

      <!-- Famiglia span1 -->
      <div class="bc">
        <div class="bc-head"><span class="bc-title">👨‍👩‍👦 Famiglia</span></div>
        <div class="fam-cols" style="grid-template-columns:1fr;">
          <div class="fam-col">
            <div class="fam-label">${esc(sp)}</div>
            <div class="fam-body">${al.length?al.slice(0,2).map(e=>`${e.time?esc(e.time)+' · ':''}${esc(e.title)}${e.isAway?`<div class="fam-alert">⚠️ Non sarà a casa</div>`:''}`).join('<br/>'):`<span style="color:var(--t2)">Nessun impegno</span>`}</div>
          </div>
          <div class="fam-col" style="border-top:1px solid var(--line2);border-left:none;">
            <div class="fam-label">${esc(ch)} · Scuola</div>
            <div class="fam-body">${tm.length?tm.slice(0,2).map(t=>`<a href="${esc(t.link)}" target="_blank" style="color:#60a5fa;text-decoration:none">${esc(t.title)}</a>`).join('<br/>'):`<span style="color:var(--t2)">Nessuna comunicazione</span>`}</div>
          </div>
        </div>
      </div>

    </div>`;

  _restorePanel();
}

// ── Row builders ───────────────────────────────────────────────────────────
function tkRow(t, st) {
  const aps=st.actionPoints||[], q=(t.quadrant||'Q2').toUpperCase();
  const brief = esc(t.brief||'').replace(/\n/g,'<br/>');
  return `<div class="tk-row ${st.done?'done':''} ${q==='Q1'?'is-q1':''}" id="ti-${esc(t.id)}">
    <div class="q-dot ${q}"></div>
    <div class="tk-body">
      <div class="tk-title">${esc(t.title)}</div>
      <div class="tk-meta">${esc(t.due||'')}${t.link?` &nbsp;<a href="${esc(t.link)}" target="_blank">↗ Apri email</a>`:''}</div>
      ${brief?`<div class="tk-brief">${brief}</div>`:''}
      ${aps.length?`<div class="tk-aps" id="ap-${esc(t.id)}">${aps.map((a,i)=>`
        <div class="ap-row">
          <div class="ap-cb ${a.done?'done':''}" onclick="toggleAp('${esc(t.id)}','${esc(a.id)}',${i})"></div>
          <span class="ap-text ${a.done?'done':''}">${esc(a.text||'')}</span>
        </div>`).join('')}</div>`:''}
    </div>
    <div class="tk-acts">
      ${aps.length?`<button class="btn-exp" id="ex-${esc(t.id)}" onclick="expandTask('${esc(t.id)}')">⌄</button>`:''}
      <button class="btn-circle ${st.done?'done':''}" onclick="toggleDone('${esc(t.id)}','task')">${st.done?'✓':''}</button>
    </div>
  </div>`;
}

function stRow(s, idx) {
  return `<div class="st-row ${s.done?'done':''}" id="si-${idx}">
    <div class="st-num">${idx+1}</div>
    <div class="st-body">
      <div class="st-title">${s.link?`<a href="${esc(s.link)}" target="_blank">${esc(s.title||'')}</a>`:esc(s.title||'')}</div>
      <div class="st-src">${esc(s.source||'')}${s.gmailCategory?` · ${esc(s.gmailCategory)}`:''}</div>
      <div class="st-sum">${esc(s.summary||'')}</div>
      ${s.recommendation?`<div class="st-rec">→ ${esc(s.recommendation)}</div>`:''}
      <div class="st-tags">
        <span class="stag ${s.priority||'medium'}">${s.priority||'medium'}</span>
        ${s.category?`<span class="stag cat">${esc(s.category)}</span>`:''}
        ${s.gmailCategory?`<span class="stag gmail">${esc(s.gmailCategory)}</span>`:''}
      </div>
    </div>
    <button class="btn-circle ${s.done?'done':''}" style="margin-top:2px;flex-shrink:0" onclick="toggleStudy(${idx})">${s.done?'✓':''}</button>
  </div>`;
}

function stRowCompact(s, idx) {
  return `<div class="st-row ${s.done?'done':''}" id="si-${idx}" style="padding:9px 16px;">
    <div class="st-num">${idx+1}</div>
    <div class="st-body">
      <div class="st-title">${s.link?`<a href="${esc(s.link)}" target="_blank">${esc(s.title||'')}</a>`:esc(s.title||'')}</div>
      <div class="st-src">${esc(s.source||'')}${s.gmailCategory?` · ${esc(s.gmailCategory)}`:''}</div>
      <div class="st-tags">
        <span class="stag ${s.priority||'medium'}">${s.priority||'medium'}</span>
        ${s.category?`<span class="stag cat">${esc(s.category)}</span>`:''}
      </div>
    </div>
    <button class="btn-circle ${s.done?'done':''}" style="margin-top:2px;flex-shrink:0" onclick="toggleStudy(${idx})">${s.done?'✓':''}</button>
  </div>`;
}

function netRow(e) {
  return `<div class="net-row">
    <div class="net-dot"></div>
    <div class="net-body">
      <div class="net-title">${esc(e.title||'')}</div>
      <div class="net-meta">${esc(e.date||'')}${e.time?' · '+esc(e.time):''}${e.location?' · 📍'+esc(e.location):''}</div>
      ${e.description?`<div class="net-desc">${esc(e.description)}</div>`:''}
      ${e.tags?.length?`<div class="net-tags">${e.tags.slice(0,4).map(t=>`<span class="net-tag">${esc(t)}</span>`).join('')}</div>`:''}
    </div>
    ${e.link?`<a href="${esc(e.link)}" target="_blank" class="btn-info">↗ Info</a>`:''}
  </div>`;
}

// ── Agent panel ─────────────────────────────────────────────────────────────
function _panelHtml() {
  return `<div class="agent-panel" id="ap">
    <div class="ap-header">
      <div class="ap-dot" id="ap-dot"></div>
      <span class="ap-title">Morning Agent</span>
      <button class="ap-close" onclick="closePanel()">×</button>
    </div>
    <div class="ap-log" id="ap-log"></div>
    <div class="ap-summary" id="ap-sum"></div>
  </div>`;
}
function _restorePanel() {
  if (!_panelOpen) return;
  const p=document.getElementById('ap'); if(!p) return;
  p.classList.add('open');
  const log=document.getElementById('ap-log');
  if(log){_logLines.forEach(l=>{const d=document.createElement('div');if(l.c)d.className=l.c;d.textContent=l.t;log.appendChild(d);});log.scrollTop=log.scrollHeight;}
  const sum=document.getElementById('ap-sum');
  if(sum&&_sumHtml){sum.innerHTML=_sumHtml;sum.classList.add('visible');}
}

// ── Navigation ─────────────────────────────────────────────────────────────
function nav(s, _el) { section=s; render(); }
function setQ(q) { qFilter=q; render(); }

// ── Toggles ────────────────────────────────────────────────────────────────
function expandTask(id) {
  document.getElementById(`ap-${id}`)?.classList.toggle('open');
  document.getElementById(`ex-${id}`)?.classList.toggle('open');
}
async function toggleDone(id, type) {
  if(!dayData) return;
  if(!dayData.items) dayData.items={};
  if(!dayData.items[id]) dayData.items[id]={};
  dayData.items[id].done = !dayData.items[id].done;
  render();
  await fetch(`/api/day/${TODAY}/item/${id}`,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:dayData.items[id].done})});
}
async function toggleAp(tid, aid, idx) {
  const aps=dayData?.items?.[tid]?.actionPoints; if(!aps) return;
  const ap=aps.find(a=>a.id===aid)||aps[idx]; if(!ap) return;
  ap.done=!ap.done; render();
  await fetch(`/api/day/${TODAY}/item/${tid}/action-point/${aid}`,{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:ap.done})});
}
async function toggleStudy(idx) {
  const s=dayData?.insights?.studyItems?.[idx]; if(!s) return;
  s.done=!s.done; render();
  await fetch(`/api/day/${TODAY}/study-item/${idx}/done`,{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:s.done})});
}

// ── Agent runner ───────────────────────────────────────────────────────────
async function runAgent(force=false) {
  const btn=document.getElementById('run-btn');
  _panelOpen=true; _logLines=[]; _sumHtml='';
  btn.disabled=true; btn.textContent=force?'⚡ In corso…':'⏳ Analisi…';
  if(section!=='all') nav('all',null);
  else render();
  const dot=document.getElementById('ap-dot'); if(dot) dot.className='ap-dot';
  const url=force?`/api/morning-agent/${TODAY}/run?force=true`:`/api/morning-agent/${TODAY}/run`;
  try {
    const r=await fetch(url,{method:'POST',credentials:'include'});
    const reader=r.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: ')) continue;
        try{
          const ev=JSON.parse(line.slice(6));
          if(ev.log) _push(ev.log,null);
          if(ev.error) _push('❌ '+ev.error,'err');
          if(ev.done&&ev.summary){
            _push('✅ Completato','done-line');
            const s=ev.summary;
            _sumHtml=[{v:s.events||0,l:'eventi'},{v:s.tasks||0,l:'email'},{v:s.dayType||'—',l:'giornata'},{v:s.studyItems||0,l:'newsletter'},{v:s.emailSent?'✓':'✗',l:'email inviata'}].map(x=>`<div class="sum-item"><div class="sv">${x.v}</div><div class="sl">${x.l}</div></div>`).join('');
            const dot=document.getElementById('ap-dot'); if(dot) dot.className='ap-dot done';
            await loadDay();
          }
        }catch{}
      }
    }
  } catch(e){ _push('❌ '+e.message,'err'); }
  btn.disabled=false; btn.textContent='☀️ Briefing';
}
function _push(text,cls){
  _logLines.push({t:text,c:cls});
  const log=document.getElementById('ap-log');
  if(log){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;}
}
function closePanel(){ _panelOpen=false; _logLines=[]; _sumHtml=''; document.getElementById('ap')?.classList.remove('open'); }
function renderEmpty(){ document.getElementById('page').innerHTML=`<div style="padding:80px 24px;text-align:center;color:var(--t1);font-size:14px;line-height:2"><div style="font-size:40px;margin-bottom:16px">☀️</div>Nessun dato per oggi.<br/>Clicca <strong style="color:var(--t0)">☀️ Briefing</strong> per analizzare Gmail e Calendar.</div>`; }

// ── User menu ──────────────────────────────────────────────────────────────
function toggleMenu(){document.getElementById('user-menu').classList.toggle('open');document.getElementById('overlay').style.display='block';}
function closeMenu(){document.getElementById('user-menu').classList.remove('open');document.getElementById('overlay').style.display='none';}
async function logout(){if(!confirm('Uscire da Glint?'))return;await fetch('/api/logout',{method:'POST',credentials:'include'});location.href='/login.html';}

async function refreshLocal(){
  const logEl = document.getElementById('local-refresh-log');
  if(logEl){ logEl.style.display='block'; logEl.textContent=''; }
  try {
    const r = await fetch(`/api/local/refresh?date=${TODAY}`, { method:'POST', credentials:'include' });
    const reader = r.body.getReader(); const dec = new TextDecoder();
    let buf='';
    while(true){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n'); buf=lines.pop()||'';
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        try{
          const d=JSON.parse(line.slice(5).trim());
          if(d.log && logEl) logEl.textContent+=d.log+'\n';
          if(d.done){ await loadDay(); render(); }
        }catch{}
      }
    }
  } catch(e){ if(logEl) logEl.textContent+='Errore: '+e.message; }
}

async function syncOura(){
  const btn = event?.target;
  if(btn){btn.textContent='⟳ Sync…';btn.disabled=true;}
  try{
    const r = await fetch('/api/oura/sync',{method:'POST',credentials:'include'});
    const d = await r.json();
    if(d.ok){ await loadDay(); render(); }
    else{ alert('Errore sync Oura: '+(d.error||'sconosciuto')); }
  }catch(e){ alert('Errore sync: '+e.message); }
  finally{ if(btn){btn.textContent='⟳ Sincronizza ora';btn.disabled=false;} }
}

// ── Utils ──────────────────────────────────────────────────────────────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
