<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accedi — Glint Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f4f6fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,.08);
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo-wrap {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      margin: 0 auto 20px;
    }
    h1 { font-size: 22px; font-weight: 700; color: #111827; margin-bottom: 6px; }
    p  { font-size: 14px; color: #6b7280; margin-bottom: 32px; }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 13px 20px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      font-size: 15px;
      font-weight: 500;
      color: #111827;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, border-color .15s, box-shadow .15s;
      font-family: inherit;
    }
    .btn-google:hover {
      background: #f9fafb;
      border-color: #d1d5db;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .btn-google svg { flex-shrink: 0; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:#e5e7eb; }
    .divider span { font-size: 12px; color: #9ca3af; }
    .features { text-align: left; margin-top: 28px; }
    .feature { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; font-size: 13px; color: #6b7280; }
    .feature-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .error-msg { color: #dc2626; font-size: 13px; margin-top: 12px; padding: 10px 14px; background: #fef2f2; border-radius: 8px; display: none; }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">✦</div>
    <h1>Glint Tracker</h1>
    <p>Il tuo assistente personale per briefing, task e calendario</p>

    <a class="btn-google" href="/auth/google">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continua con Google
    </a>

    <div id="error-msg" class="error-msg"></div>

    <div class="features">
      <div class="feature"><span class="feature-icon">✦</span><span><strong>Briefing mattutino</strong> — Gmail, Calendar, Drive in un unico riepilogo</span></div>
      <div class="feature"><span class="feature-icon">✓</span><span><strong>Task Manager</strong> — organizza le attività stile Microsoft To Do</span></div>
      <div class="feature"><span class="feature-icon">👥</span><span><strong>Multi-utente</strong> — ogni account ha il suo spazio privato</span></div>
    </div>
  </div>

  <script>
    // Check if redirected after failed auth
    const params = new URLSearchParams(location.search);
    if (params.get('error')) {
      const el = document.getElementById('error-msg');
      el.textContent = decodeURIComponent(params.get('error'));
      el.classList.add('show');
    }
    // If already logged in, redirect to app
    fetch('/api/me').then(r => {
      if (r.ok) location.href = '/';
    }).catch(() => {});
  </script>
</body>
</html>
