<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Accedi — Glint</title>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#7c6ef5"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #111113;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
    }
    .logo .gem {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo span { font-size: 22px; font-weight: 800; color: #fafafa; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #71717a; margin-bottom: 32px; line-height: 1.6; }
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #111;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
      margin-bottom: 16px;
    }
    .btn-google:hover { opacity: .93; transform: translateY(-1px); }
    .note { font-size: 12px; color: #52525b; line-height: 1.6; }
    .note a { color: #6366f1; text-decoration: none; }
    .divider { border: none; border-top: 1px solid #27272a; margin: 24px 0; }
    .back { font-size: 13px; color: #52525b; text-decoration: none; }
    .back:hover { color: #a1a1aa; }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="logo">
      <div class="gem">✦</div>
      <span>Glint</span>
    </a>
    <h1>Bentornato</h1>
    <p>Connetti il tuo Google Account per accedere al tuo briefing mattutino personalizzato.</p>
    <a href="/auth/google" class="btn-google">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continua con Google
    </a>
    <p class="note">
      Accedendo accetti i nostri <a href="/terms.html">Termini di servizio</a> e la <a href="/privacy.html">Privacy Policy</a>.<br/>
      I tuoi dati Gmail e Calendar non vengono mai condivisi o venduti.
    </p>
    <hr class="divider"/>
    <a href="/" class="back">← Torna alla home</a>
  </div>
</body>
</html>
