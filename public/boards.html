function applySearch() { renderView(); }

// ── DROPDOWN / COLOR HELPERS ───────────────────────────────────────────────────
function toggleDropdown(id, event) {
  event.stopPropagation();
  const el = document.getElementById(id);
  if (!el) return;
  const wasHidden = el.classList.contains('hidden');
  closeAllDropdowns();
  if (wasHidden) {
    el.classList.remove('hidden');
    const rect = el.parentElement.getBoundingClientRect();
    el.style.top = (rect.bottom + 4) + 'px';
    el.style.left = rect.left + 'px';
    el.style.position = 'fixed';
  }
}

function showDropdown(event, items) {
  closeAllDropdowns();
  const dd = document.getElementById('global-dropdown');
  dd.innerHTML = items.map(item => {
    if (item.type === 'divider') return `<div class="dropdown-divider"></div>`;
    return `<div class="dropdown-item ${item.danger?'danger':''}" onclick="(${item.action.toString()})();closeAllDropdowns()">${item.label}</div>`;
  }).join('');
  dd.classList.remove('hidden');
  dd.style.position = 'fixed';
  dd.style.top = (event.clientY + 4) + 'px';
  dd.style.left = event.clientX + 'px';
}

function showColorPicker(event, callback) {
  closeAllDropdowns();
  const dd = document.getElementById('global-dropdown');
  dd.innerHTML = `<div class="color-grid">${BOARD_COLORS.map(c => `<div class="color-swatch" style="background:${c}" onclick="(${callback.toString()})('${c}');closeAllDropdowns()"></div>`).join('')}</div>`;
  dd.classList.remove('hidden');
  dd.style.position = 'fixed';
  dd.style.top = (event.clientY + 4) + 'px';
  dd.style.left = event.clientX + 'px';
}

function closeAllDropdowns() {
  document.getElementById('global-dropdown').classList.add('hidden');
  document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.add('hidden'));
}

document.addEventListener('click', closeAllDropdowns);

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y.slice(2)}`;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(url, method = 'GET', body = null) {
  const opts = { method, headers: {} };
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  if (!r.ok) {
    const err = await r.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${r.status}`);
  }
  return r.json();
}

// ── GMAIL PANEL ────────────────────────────────────────────────────────────────
let gmailEmails = [];
let gmailSearchTimer = null;
let expandedEmailId = null;
let gmailMessageCache = {};

function toggleGmailPanel() {
  const panel = document.getElementById('gmail-panel');
  const isOpen = panel.classList.toggle('open');
  if (isOpen && !gmailEmails.length) loadGmailInbox();
}

function debounceGmailSearch() {
  clearTimeout(gmailSearchTimer);
  gmailSearchTimer = setTimeout(() => loadGmailInbox(), 450);
}

async function loadGmailInbox() {
  const listEl = document.getElementById('gmail-list');
  const q = document.getElementById('gmail-search-input')?.value.trim() || '';
  listEl.innerHTML = `<div style="padding:24px;text-align:center;color:var(--t2);font-size:12px">Caricamento…</div>`;
  try {
    const query = q || 'in:inbox';
    gmailEmails = await api(`/api/gmail/inbox?q=${encodeURIComponent(query)}&max=30`);
    renderGmailList();
  } catch (e) {
    listEl.innerHTML = `<div style="padding:24px;text-align:center;color:var(--red);font-size:12px">
      ${e.message.includes('Google non connesso') ? '⚠️ Connetti Google nelle Impostazioni per accedere alle email.' : `Errore: ${esc(e.message)}`}
    </div>`;
  }
}

function renderGmailList() {
  const listEl = document.getElementById('gmail-list');
  if (!gmailEmails.length) {
    listEl.innerHTML = `<div style="padding:24px;text-align:center;color:var(--t2);font-size:12px">Nessuna email trovata.</div>`;
    return;
  }
  listEl.innerHTML = gmailEmails.map(email => `
    <div class="gmail-item ${expandedEmailId === email.id ? 'expanded' : ''}" id="gitem-${email.id}" onclick="toggleEmailExpand('${email.id}')">
      <div class="gmail-item-subject">${esc(email.subject)}</div>
      <div class="gmail-item-from">${esc(formatGmailFrom(email.from))}</div>
      <div class="gmail-item-snippet">${esc(email.snippet)}</div>
      <div class="gmail-item-date">${formatGmailDate(email.date)}</div>
    </div>
    <div class="gmail-preview ${expandedEmailId === email.id ? 'show' : ''}" id="gpreview-${email.id}">
      <div class="gmail-preview-body" id="gbody-${email.id}">
        ${gmailMessageCache[email.id] ? esc(gmailMessageCache[email.id].body.slice(0, 600)) : '<span style="color:var(--t2)">Caricamento anteprima…</span>'}
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <a href="https://mail.google.com/mail/u/0/#inbox/${email.id}" target="_blank" class="btn ghost sm">↗ Apri</a>
        <button class="btn sm" onclick="event.stopPropagation();openCreateFromEmail('${email.id}')">＋ Crea task</button>
      </div>
    </div>
    <div class="gmail-create-form ${expandedEmailId === email.id && gmailCreateFormOpen === email.id ? 'show' : ''}" id="gcreate-${email.id}"></div>
  `).join('');
}

let gmailCreateFormOpen = null;

async function toggleEmailExpand(emailId) {
  if (expandedEmailId === emailId) {
    expandedEmailId = null;
    gmailCreateFormOpen = null;
  } else {
    expandedEmailId = emailId;
    gmailCreateFormOpen = null;
    // Load full message if not cached
    if (!gmailMessageCache[emailId]) {
      try {
        gmailMessageCache[emailId] = await api(`/api/gmail/message/${emailId}`);
      } catch (e) {
        gmailMessageCache[emailId] = { body: '(impossibile caricare il testo)', subject: '', from: '' };
      }
    }
  }
  renderGmailList();
}

function openCreateFromEmail(emailId) {
  event.stopPropagation();
  gmailCreateFormOpen = emailId;
  const email = gmailEmails.find(e => e.id === emailId);
  const cached = gmailMessageCache[emailId];
  const subject = cached?.subject || email?.subject || '';
  const from    = cached?.from    || email?.from    || '';
  const snippet = cached?.body?.slice(0, 300) || email?.snippet || '';
  const gmailLink = `https://mail.google.com/mail/u/0/#inbox/${emailId}`;

  const groups = currentBoard?.groups || [];
  const groupOpts = groups.map(g => `<option value="${g.id}">${esc(g.title)}</option>`).join('');
  const statusCol = currentBoard?.columns.find(c => c.type === 'status');
  const statusOpts = statusCol
    ? `<label>Stato</label>
       <select class="gmail-select" id="gcf-status-${emailId}">
         <option value="">— nessuno —</option>
         ${(statusCol.options||[]).map(o => `<option value="${o.id}">${esc(o.label)}</option>`).join('')}
       </select>`
    : '';

  const formHtml = `
    <label>Titolo task</label>
    <input class="gmail-input" id="gcf-title-${emailId}" value="${esc(subject)}" placeholder="Titolo…"/>
    <label>Gruppo</label>
    <select class="gmail-select" id="gcf-group-${emailId}">${groupOpts}</select>
    ${statusOpts}
    <label>Note (opzionale)</label>
    <textarea class="gmail-input" id="gcf-notes-${emailId}" rows="2" placeholder="Aggiungi note…" style="resize:vertical">${esc('Da: ' + from + '\n' + snippet.slice(0, 200))}</textarea>
    <div style="display:flex;gap:6px;margin-top:10px">
      <button class="btn ghost sm" onclick="event.stopPropagation();gmailCreateFormOpen=null;renderGmailList()">Annulla</button>
      <button class="btn sm" onclick="event.stopPropagation();createTaskFromEmail('${emailId}','${esc(gmailLink)}')">✓ Crea task</button>
    </div>
  `;

  const formEl = document.getElementById(`gcreate-${emailId}`);
  if (formEl) { formEl.innerHTML = formHtml; formEl.classList.add('show'); }
}

async function createTaskFromEmail(emailId, gmailLink) {
  if (!currentBoard) return;
  const title   = document.getElementById(`gcf-title-${emailId}`)?.value.trim();
  const groupId = document.getElementById(`gcf-group-${emailId}`)?.value;
  const notes   = document.getElementById(`gcf-notes-${emailId}`)?.value.trim();
  const statusColEl = document.getElementById(`gcf-status-${emailId}`);
  const statusVal = statusColEl?.value || null;

  if (!title) { toast('Inserisci un titolo'); return; }
  if (!groupId) { toast('Seleziona un gruppo'); return; }

  const statusCol = currentBoard.columns.find(c => c.type === 'status');
  const notesCol  = currentBoard.columns.find(c => c.type === 'text' && !c.fixed);
  const urlCol    = currentBoard.columns.find(c => c.type === 'url');

  const values = {};
  if (statusCol && statusVal)  values[statusCol.id] = statusVal;
  if (notesCol  && notes)      values[notesCol.id]  = notes;
  if (urlCol)                  values[urlCol.id]    = gmailLink;

  const item = await api(`/api/boards/${currentBoard.id}/groups/${groupId}/items`, 'POST', { title, values });
  const g = currentBoard.groups.find(g => g.id === groupId);
  if (g) g.items.push(item);

  // Close form & collapse email
  expandedEmailId = null;
  gmailCreateFormOpen = null;
  renderGmailList();
  renderView();
  toast(`✓ Task creato: "${title}"`);
}

function formatGmailFrom(from) {
  if (!from) return '';
  const m = from.match(/^"?([^"<]+)"?\s*<?/);
  return m ? m[1].trim() : from.split('@')[0];
}

function formatGmailDate(dateStr) {
  if (!dateStr) return '';
  try {
    const d = new Date(dateStr);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    if (isToday) return d.toLocaleTimeString('it', { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString('it', { day: '2-digit', month: 'short' });
  } catch { return dateStr; }
}

init();
</script>
