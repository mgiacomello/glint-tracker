name: Keep Chiaro awake

# Pings the Render health endpoint so the free web service doesn't spin down
# (Render sleeps after ~15 min idle → cold start of 30-60s on next open).
# Note: GitHub-scheduled runs can be delayed under load; pair with an external
# uptime monitor (e.g. cron-job.org) for best reliability.

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch: {} # allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://chiaro.onrender.com/api/health) || code="000"
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Health check did not return 200 after retries (service may be waking up)."
